          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <!-- Header -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="AutoKlik Trans"
                      android:textColor="#10B981"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="Pengontrol Klik Otomatis &amp; Multi-Touch"
                      android:textColor="#94A3B8"
                      android:textSize="13sp" />

                  <!-- MANAJEMEN PROFIL SKRIP (FITUR 15) -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="📁 MANAJEMEN PROFIL SKRIP (Fitur 15)"
                          android:textColor="#38BDF8"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <Spinner
                          android:id="@+id/spProfiles"
                          android:layout_width="match_parent"
                          android:layout_height="44dp"
                          android:layout_marginTop="6dp"
                          android:background="#0F172A" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnLoadProfile"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_weight="1"
                              android:backgroundTint="#0284C7"
                              android:text="📂 Muat Skrip"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp" />

                          <Button
                              android:id="@+id/btnDeleteProfile"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:backgroundTint="#DC2626"
                              android:text="🗑️ Hapus"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:layout_marginTop="10dp"
                          android:layout_marginBottom="10dp"
                          android:background="#334155" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Simpan Sebagai Profil Baru:"
                          android:textColor="#CBD5E1"
                          android:textSize="11sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:orientation="horizontal">

                          <EditText
                              android:id="@+id/etNewProfileName"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_weight="2"
                              android:background="#0F172A"
                              android:hint="Nama Profil (misal: Game A)"
                              android:padding="6dp"
                              android:textColor="#F8FAFC"
                              android:textColorHint="#64748B"
                              android:textSize="12sp" />

                          <Button
                              android:id="@+id/btnSaveNewProfile"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:backgroundTint="#10B981"
                              android:text="💾 Simpan"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp" />
                      </LinearLayout>

                  </LinearLayout>

                  <!-- Status Aksesibilitas & Overlay -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Status Perizinan Sistem"
                          android:textColor="#F8FAFC"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtAccessibilityStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Aksesibilitas: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtOverlayStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:text="Jendela Mengapung: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnAccessibility"
                              android:layout_width="0dp"
                              android:layout_height="38dp"
                              android:layout_weight="1"
                              android:backgroundTint="#334155"
                              android:text="⚙️ Aksesibilitas"
                              android:textColor="#F8FAFC"
                              android:textSize="11sp" />

                          <Button
                              android:id="@+id/btnOverlay"
                              android:layout_width="0dp"
                              android:layout_height="38dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:backgroundTint="#334155"
                              android:text="🔓 Izin Overlay"
                              android:textColor="#F8FAFC"
                              android:textSize="11sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Tombol Luncurkan Panel Melayang -->
                  <Button
                      android:id="@+id/btnStartFloating"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginTop="14dp"
                      android:backgroundTint="#10B981"
                      android:text="▶ TAMPILKAN PANEL MELAYANG"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <!-- Fitur Cepat Ringkasan -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Panduan Tombol Panel Melayang:"
                          android:textColor="#10B981"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
