          package com.autoklik.android.service

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.InputMethod
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.SystemClock
          import android.view.KeyCharacterMap
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import androidx.annotation.RequiresApi
          import com.autoklik.android.security.LicenseManager
          import kotlinx.coroutines.*
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong
          import kotlin.coroutines.resume
          import kotlin.math.abs
          import kotlin.math.hypot

          class AutoClickAccessibilityService : AccessibilityService() {

              private val serviceScope = CoroutineScope(Dispatchers.Default + SupervisorJob())
              private val activeSessionId = AtomicLong(0L)
              private var activeInputJob: Job? = null
              @Volatile
              private var lastPopupDismissAtMs: Long = 0L

              companion object {
                  var instance: AutoClickAccessibilityService? = null
                      private set
              }

              fun beginNewExecutionSession(): Long {
                  activeInputJob?.cancel()
                  activeInputJob = null
                  return activeSessionId.incrementAndGet()
              }

              fun cancelAllRunningActions() {
                  activeSessionId.incrementAndGet()
                  activeInputJob?.cancel()
                  activeInputJob = null
                  setKeyboardHiddenForTyping(false)
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      try {
                          val info = serviceInfo
                          if (info != null && (info.flags and AccessibilityServiceInfo.FLAG_INPUT_METHOD_EDITOR) == 0) {
                              info.flags = info.flags or AccessibilityServiceInfo.FLAG_INPUT_METHOD_EDITOR
                              serviceInfo = info
                          }
                      } catch (e: Exception) {}
                  }
              }

              @RequiresApi(Build.VERSION_CODES.TIRAMISU)
              override fun onCreateInputMethod(): InputMethod {
                  return super.onCreateInputMethod()
              }

              fun setKeyboardHiddenForTyping(hidden: Boolean) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      try {
                          val mode = if (hidden) SHOW_MODE_HIDDEN else SHOW_MODE_AUTO
                          if (softKeyboardController.showMode != mode) {
                              softKeyboardController.setShowMode(mode)
                          }
                      } catch (e: Exception) {}
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  cancelAllRunningActions()
                  instance = null
              }

              override fun onDestroy() {
                  cancelAllRunningActions()
                  super.onDestroy()
                  instance = null
                  serviceScope.cancel()
              }

              private fun clampX(x: Float): Float {
                  val w = resources.displayMetrics.widthPixels.toFloat().coerceAtLeast(200f)
                  return x.coerceIn(2f, w - 2f)
              }

              private fun clampY(y: Float): Float {
                  val h = resources.displayMetrics.heightPixels.toFloat().coerceAtLeast(400f)
                  return y.coerceIn(2f, h - 2f)
              }

              // AKURASI KLIK SESUAI BESARNYA IKON (20dp - 80dp):
              // Memindai seluruh lingkaran area bulatan ikon (radiusPx). Jika ada tombol / elemen klik yang
              // masuk atau tersentuh di dalam lingkaran ikon tersebut, bidikan otomatis mengarah tepat ke tombol itu!
              private fun resolveTargetPointInIconRadius(
                  centerX: Float,
                  centerY: Float,
                  radiusPx: Float
              ): Pair<Float, Float> {
                  if (radiusPx <= 6f) return centerX to centerY
                  val root = try {
                      rootInActiveWindow
                  } catch (e: Exception) {
                      null
                  } ?: return centerX to centerY

                  val cx = centerX.toInt()
                  val cy = centerY.toInt()
                  val rect = Rect()
                  val queue = ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)

                  var bestPoint: Pair<Float, Float>? = null
                  var bestDist = Float.MAX_VALUE
                  var bestArea = Int.MAX_VALUE

                  try {
                      while (queue.isNotEmpty()) {
                          val node = queue.removeFirst()
                          node.getBoundsInScreen(rect)

                          val isInteractive = node.isClickable ||
                              node.isEditable ||
                              node.isCheckable ||
                              node.className?.contains("Button", true) == true ||
                              node.className?.contains("EditText", true) == true

                          if (isInteractive && rect.width() > 4 && rect.height() > 4) {
                              // Jika titik tengah ikon sudah berada di dalam tombol ini, langsung pakai centerX, centerY
                              if (rect.contains(cx, cy)) {
                                  val area = rect.width() * rect.height()
                                  if (area < bestArea) {
                                      bestArea = area
                                      bestDist = 0f
                                      bestPoint = centerX to centerY
                                  }
                              } else if (bestDist > 0f) {
                                  // Cek jarak terdekat dari pusat ikon (centerX, centerY) ke kotak tombol (rect)
                                  val nearestX = centerX.coerceIn(rect.left.toFloat(), rect.right.toFloat())
                                  val nearestY = centerY.coerceIn(rect.top.toFloat(), rect.bottom.toFloat())
                                  val dist = hypot((centerX - nearestX).toDouble(), (centerY - nearestY).toDouble()).toFloat()

                                  // Jika tombol berada di dalam jangkauan bulatan ikon (radiusPx)
                                  if (dist <= radiusPx && dist < bestDist) {
                                      bestDist = dist
                                      // Arahkan ketukan sedikit masuk ke dalam area tombol yang tersentuh bulatan ikon
                                      val insetX = nearestX.coerceIn(
                                          (rect.left + 4).coerceAtMost(rect.centerX()).toFloat(),
                                          (rect.right - 4).coerceAtLeast(rect.centerX()).toFloat()
                                      )
                                      val insetY = nearestY.coerceIn(
                                          (rect.top + 4).coerceAtMost(rect.centerY()).toFloat(),
                                          (rect.bottom - 4).coerceAtLeast(rect.centerY()).toFloat()
                                      )
                                      bestPoint = insetX to insetY
                                  }
                              }
                          }

                          for (i in 0 until node.childCount) {
                              node.getChild(i)?.let { queue.add(it) }
                          }
                      }
                  } catch (e: Exception) {
                      // Abaikan bila pohon tampilan berubah cepat saat transisi layar
                  }

                  return bestPoint ?: (centerX to centerY)
              }

              // DETEKTOR KHUSUS FERIZY (FITUR #3):
              // Berhenti & Bunyikan Alarm HANYA saat:
              // 1. Berganti slide dari /order menuju /order/verification
              // 2. Angka/tulisan Kuota pada /ferryschedule berganti dari 0 menjadi > 0 (misal Kuota : 1 / 2 / 4 / 10)
              // (Tidak berhenti saat server padat/limit agar looping terus berjalan)
              private val quotaRegex = Regex("""kuota\s*:?\s*(\d+)""", RegexOption.IGNORE_CASE)

              fun checkFerizyQuotaOrVerificationTrigger(
                  sawOrderSlide: AtomicBoolean
              ): String? {
                  val root = try {
                      rootInActiveWindow
                  } catch (e: Exception) {
                      null
                  } ?: return null

                  val queue = ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)

                  try {
                      while (queue.isNotEmpty()) {
                          val node = queue.removeFirst()
                          val rawText = (node.text ?: node.contentDescription)?.toString() ?: ""
                          if (rawText.isNotEmpty()) {
                              val lower = rawText.lowercase()
                              if ((lower.contains("trip.ferizy.com/order") || lower.contains("/order")) &&
                                  !lower.contains("/order/verification")
                              ) {
                                  sawOrderSlide.set(true)
                              }
                              // 1. Deteksi instan URL /order/verification atau /payment (termasuk teks halaman verifikasi bila address bar tertutup scroll)
                              if (lower.contains("trip.ferizy.com/order/verification") ||
                                  lower.contains("/order/verification") ||
                                  lower.contains("trip.ferizy.com/payment") ||
                                  (sawOrderSlide.get() && (
                                      lower.contains("verifikasi pesanan") ||
                                      lower.contains("lanjutkan pembayaran") ||
                                      lower.contains("pilih metode pembayaran") ||
                                      lower.contains("batas waktu pembayaran")
                                  ))
                              ) {
                                  return "🔔 Pindah Slide ke /order/verification!"
                              }

                              // 2. Auto-Tutup Popup Error / Kuota Habis KHUSUS Ferizy dengan filter ketat & jeda 1000ms agar tidak memicu klik liar
                              val nowMs = SystemClock.uptimeMillis()
                              if (sawOrderSlide.get() &&
                                  rawText.length in 6..220 &&
                                  (nowMs - lastPopupDismissAtMs) > 1000L &&
                                  (lower.contains("kuota habis") || lower.contains("kuota tidak mencukupi") || lower.contains("kuota tidak tersedia") || lower.contains("kuota penuh") || lower.contains("pemesanan gagal")) &&
                                  !lower.contains("setuju") && !lower.contains("lanjutkan pembayaran")
                              ) {
                                  for (i in 0 until node.childCount) {
                                      val child = node.getChild(i)
                                      val cTxt = (child?.text ?: child?.contentDescription)?.toString()?.trim()?.lowercase() ?: ""
                                      if (child != null && child.isClickable && (cTxt == "ok" || cTxt == "oke" || cTxt == "tutup" || cTxt == "mengerti")) {
                                          lastPopupDismissAtMs = nowMs
                                          child.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                          break
                                      }
                                  }
                              }
                          }

                          for (i in 0 until node.childCount) {
                              node.getChild(i)?.let { queue.add(it) }
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return null
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executeTap(
                  x: Float,
                  y: Float,
                  durationMs: Long = 50L,
                  radiusPx: Float = 0f,
                  callback: (() -> Unit)? = null
              ) {
                  if (!LicenseManager.isLicensed(this)) {
                      callback?.invoke()
                      return
                  }
                  val session = activeSessionId.get()
                  val completed = AtomicBoolean(false)
                  var watchdogJob: Job? = null
                  val finishOnce = {
                      if (completed.compareAndSet(false, true)) {
                          watchdogJob?.cancel()
                          callback?.invoke()
                      }
                  }

                  // KETUKAN PRESISI TEPAT DI TITIK BIDIK TENGAH (Tanpa melenceng ke tombol lain di sekitar radius & mikro-jitter aman ±1px)
                  val microJitterX = (kotlin.random.Random.nextFloat() * 2f) - 1f
                  val microJitterY = (kotlin.random.Random.nextFloat() * 2f) - 1f
                  val safeX = clampX(x + microJitterX)
                  val safeY = clampY(y + microJitterY)
                  val safeDur = durationMs.coerceIn(15L, 500L)

                  // Watchdog aman (cukup longgar agar gesture asli selesai dulu sebelum fallback, mencegah klik beruntun bertabrakan)
                  watchdogJob = serviceScope.launch {
                      delay(safeDur + 850L)
                      finishOnce()
                  }

                  fun dispatchAttempt(isRetry: Boolean) {
                      if (completed.get() || activeSessionId.get() != session) {
                          finishOnce()
                          return
                      }
                      try {
                          val path = Path().apply { moveTo(safeX, safeY) }
                          val stroke = GestureDescription.StrokeDescription(path, 0L, safeDur)
                          val gesture = GestureDescription.Builder().addStroke(stroke).build()

                          val dispatched = dispatchGesture(gesture, object : GestureResultCallback() {
                              override fun onCompleted(gestureDescription: GestureDescription?) {
                                  finishOnce()
                              }

                              override fun onCancelled(gestureDescription: GestureDescription?) {
                                  if (!isRetry && !completed.get() && activeSessionId.get() == session) {
                                      serviceScope.launch {
                                          delay(45)
                                          dispatchAttempt(true)
                                      }
                                  } else {
                                      finishOnce()
                                  }
                              }
                          }, null)

                          if (!dispatched) {
                              if (!isRetry && !completed.get() && activeSessionId.get() == session) {
                                  serviceScope.launch {
                                      delay(45)
                                      dispatchAttempt(true)
                                  }
                              } else {
                                  finishOnce()
                              }
                          }
                      } catch (e: Exception) {
                          finishOnce()
                      }
                  }

                  dispatchAttempt(false)
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executeSwipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  durationMs: Long = 260L,
                  callback: (() -> Unit)? = null
              ) {
                  if (!LicenseManager.isLicensed(this)) {
                      callback?.invoke()
                      return
                  }
                  val session = activeSessionId.get()
                  val completed = AtomicBoolean(false)
                  var watchdogJob: Job? = null
                  val finishOnce = {
                      if (completed.compareAndSet(false, true)) {
                          watchdogJob?.cancel()
                          callback?.invoke()
                      }
                  }

                  val density = resources.displayMetrics.density.coerceAtLeast(1f)
                  val screenH = resources.displayMetrics.heightPixels.toFloat().coerceAtLeast(600f)
                  val topMargin = (32f * density).coerceAtLeast(40f)
                  val bottomMargin = (screenH - 42f * density).coerceAtLeast(240f)
                  val maxSingleStrokeSpan = (bottomMargin - topMargin).coerceAtLeast(200f)

                  val safeStartX = clampX(startX)
                  val safeEndX = clampX(endX)

                  val isUp = endY <= startY
                  // Tambahkan kompensasi Touch-Slop Android (+32dp) & Pengali Skala (1.35x) agar gerakan layar sesuai panjang garis!
                  val rawRequestedDist = abs(endY - startY).coerceAtLeast(80f * density)
                  val effectiveTotalDist = (rawRequestedDist * 1.35f) + (32f * density)

                  // Hitung berapa segmen geseran jika pengguna meminta jarak swipe > 1 layar penuh (misal 2000px - 5000px)
                  val strokeCount = kotlin.math.ceil(effectiveTotalDist / maxSingleStrokeSpan).toInt().coerceIn(1, 4)
                  val perStrokeDist = (effectiveTotalDist / strokeCount).coerceIn(90f * density, maxSingleStrokeSpan)

                  // Jika titik awal terlalu dekat dengan batas atas/bawah sehingga memotong garis, otomatis geser titik pangkal agar jarak swipe tetap penuh!
                  var strokeStartY = clampY(startY)
                  var strokeEndY: Float

                  if (isUp) {
                      if (strokeStartY - perStrokeDist < topMargin) {
                          strokeStartY = (topMargin + perStrokeDist).coerceIn(topMargin, bottomMargin)
                      }
                      strokeEndY = (strokeStartY - perStrokeDist).coerceIn(topMargin, bottomMargin)
                  } else {
                      if (strokeStartY + perStrokeDist > bottomMargin) {
                          strokeStartY = (bottomMargin - perStrokeDist).coerceIn(topMargin, bottomMargin)
                      }
                      strokeEndY = (strokeStartY + perStrokeDist).coerceIn(topMargin, bottomMargin)
                  }

                  val singleDur = durationMs.coerceIn(150L, 420L)

                  // Watchdog Anti-Macet untuk Swipe (dibatalkan otomatis saat swipe selesai)
                  watchdogJob = serviceScope.launch {
                      delay((singleDur + 160L) * strokeCount + 850L)
                      finishOnce()
                  }

                  // Gunakan kurva 2-segmen (90% gerak utama + 10% pengereman halus 2px di ujung)
                  // agar layar berhenti presisi di titik akhir dan TIDAK berubah-ubah saat disusul tugas klik berikutnya!
                  fun buildStabilizedSwipeGesture(): GestureDescription {
                      val brakeY = if (isUp) {
                          (strokeEndY + 4f).coerceIn(topMargin, bottomMargin)
                      } else {
                          (strokeEndY - 4f).coerceIn(topMargin, bottomMargin)
                      }
                      val singlePath = Path().apply {
                          moveTo(safeStartX, strokeStartY)
                          lineTo(safeEndX, brakeY)
                          lineTo(safeEndX, strokeEndY)
                      }
                      val stroke = GestureDescription.StrokeDescription(singlePath, 0L, singleDur)
                      return GestureDescription.Builder().addStroke(stroke).build()
                  }

                  fun runStrokeStep(stepIndex: Int, isRetry: Boolean) {
                      if (completed.get() || activeSessionId.get() != session) {
                          finishOnce()
                          return
                      }
                      try {
                          val gesture = buildStabilizedSwipeGesture()
                          val dispatched = dispatchGesture(gesture, object : GestureResultCallback() {
                              override fun onCompleted(gestureDescription: GestureDescription?) {
                                  if (stepIndex + 1 < strokeCount) {
                                      serviceScope.launch {
                                          delay(45L)
                                          runStrokeStep(stepIndex + 1, false)
                                      }
                                  } else {
                                      serviceScope.launch {
                                          // Jeda stabilisasi 40ms setelah swipe selesai agar posisi layar terkunci sebelum tugas berikutnya jalan
                                          delay(40L)
                                          finishOnce()
                                      }
                                  }
                              }

                              override fun onCancelled(gestureDescription: GestureDescription?) {
                                  if (!isRetry && !completed.get() && activeSessionId.get() == session) {
                                      serviceScope.launch {
                                          delay(50L)
                                          runStrokeStep(stepIndex, true)
                                      }
                                  } else {
                                      finishOnce()
                                  }
                              }
                          }, null)

                          if (!dispatched) {
                              if (!isRetry && !completed.get() && activeSessionId.get() == session) {
                                  serviceScope.launch {
                                      delay(50L)
                                      runStrokeStep(stepIndex, true)
                                  }
                              } else {
                                  finishOnce()
                              }
                          }
                      } catch (e: Exception) {
                          finishOnce()
                      }
                  }

                  runStrokeStep(0, false)
              }

              private fun findEditableNodeInRadius(
                  root: AccessibilityNodeInfo?,
                  targetX: Int,
                  targetY: Int,
                  radiusPx: Float
              ): AccessibilityNodeInfo? {
                  if (root == null) return null

                  val focused = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  if (focused != null && (focused.isEditable || focused.className?.contains("EditText", true) == true)) {
                      return focused
                  }

                  val rect = Rect()
                  val queue = ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)

                  var bestMatch: AccessibilityNodeInfo? = null
                  var bestDist = Float.MAX_VALUE

                  while (queue.isNotEmpty()) {
                      val current = queue.removeFirst()
                      current.getBoundsInScreen(rect)
                      val isInput = current.isEditable ||
                          current.className?.contains("EditText", true) == true ||
                          current.className?.contains("Input", true) == true

                      if (isInput) {
                          if (rect.contains(targetX, targetY)) {
                              return current
                          }
                          val nearestX = targetX.toFloat().coerceIn(rect.left.toFloat(), rect.right.toFloat())
                          val nearestY = targetY.toFloat().coerceIn(rect.top.toFloat(), rect.bottom.toFloat())
                          val dist = hypot((targetX - nearestX).toDouble(), (targetY - nearestY).toDouble()).toFloat()
                          if (dist <= radiusPx.coerceAtLeast(16f) && dist < bestDist) {
                              bestDist = dist
                              bestMatch = current
                          }
                      }

                      for (i in 0 until current.childCount) {
                          current.getChild(i)?.let { queue.add(it) }
                      }
                  }
                  return bestMatch ?: focused
              }

              // RAW TAP PRESISI (Tanpa radius scan elemen DOM belakang & tanpa acak koordinat mikro)
