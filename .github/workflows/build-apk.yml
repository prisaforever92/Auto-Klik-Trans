              private fun loadNamedConfiguration(configName: String) {
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE)
                  val rawJson = prefs.getString(configName, null)
                  if (rawJson.isNullOrBlank()) {
                      Toast.makeText(this, "Konfigurasi '$configName' tidak ditemukan!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  try {
                      val profileObj = JSONObject(rawJson)
                      val pointsArray = profileObj.optJSONArray("points")
                      if (pointsArray == null || pointsArray.length() == 0) {
                          Toast.makeText(this, "Konfigurasi '$configName' belum memiliki titik tersimpan!", Toast.LENGTH_SHORT).show()
                          return
                      }

                      // Hapus semua titik lama beserta Garis Swipe & Pin Keyboard dari layar
                      for (point in targetPoints) {
                          r9yMnTm4NSzvG9rrwjM2ec8xZgh1cafXH8(point)
                      }
                      targetPoints.clear()

                      currentSizePercent = profileObj.optInt("size_percent", currentSizePercent).coerceIn(0, 100)
                      arePointsVisible = true
                      floatingContainer?.findViewById<Button>(R.id.btnFloatingVisibility)?.text = "👁️"

                      // Urutkan JSON berdasarkan field "order" sebelum ditambahkan
                      val jsonList = mutableListOf<JSONObject>()
                      for (i in 0 until pointsArray.length()) {
                          jsonList.add(pointsArray.getJSONObject(i))
                      }
                      jsonList.sortBy { it.optInt("order", 999) }

                      for (ptObj in jsonList) {
                          addTargetPoint(ptObj)
                      }

                      reindexTargetPoints()
                      currentLoadedConfigName = configName
                      if (isPointsLocked) {
                          setTargetPointsTouchable(false)
                      }

                      Toast.makeText(this, "📂 Konfigurasi '$configName' (${targetPoints.size} titik) berhasil dimuat!", Toast.LENGTH_LONG).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Gagal memuat konfigurasi: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

