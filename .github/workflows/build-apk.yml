                  // Helper untuk menyimpan isi form dialog saat ini ke objek point (dipakai saat klik Simpan maupun saat pindah titik)
                  fun saveCurrentDialogFieldsToPoint() {
                      point.type = selectedType

                      val isSec = rgDelayUnit.checkedRadioButtonId == R.id.rbUnitSec
                      val delayInputVal = etDelay.text.toString().toDoubleOrNull() ?: if (isSec) 1.0 else 1000.0
                      point.delayValue = delayInputVal
                      point.delayUnit = if (isSec) "s" else "ms"
                      point.delayMs = if (isSec) (delayInputVal * 1000.0).toLong().coerceAtLeast(50L) else delayInputVal.toLong().coerceAtLeast(50L)

                      point.swipeDistancePx = etSwipeDistance.text.toString().toFloatOrNull() ?: point.swipeDistancePx

                      point.jumpEnabled = cbSubLoop.isChecked
                      point.jumpToPoint = (etJumpTo.text.toString().toIntOrNull() ?: 1).coerceIn(1, targetPoints.size.coerceAtLeast(1))
                      point.jumpAfterCycle = (etJumpCycle.text.toString().toIntOrNull() ?: 8).coerceAtLeast(0)

                      val collectedPaste = pasteEditTexts.map { it.text.toString().trim() }.filter { it.isNotEmpty() }.toMutableList()
                      point.pasteTexts = collectedPaste
                      point.pasteText = collectedPaste.firstOrNull() ?: ""
                      point.currentPasteIndex = 0
                      point.currentJumpCount = 0

                      point.autoTapPaste = cbAutoTap.isChecked
                      point.keyDelayMs = etPopupKeyDelay.text.toString().toLongOrNull()?.coerceAtLeast(150L) ?: 400L

                      updatePointVisual(point)
                      syncAllSwipeOverlays()
                  }

                  // Tombol Ubah No. Urut (Maju / Mundur) di Header
                  btnMoveOrderPrev.isEnabled = point.order > 1
                  btnMoveOrderPrev.alpha = if (point.order > 1) 1f else 0.4f
                  btnMoveOrderPrev.setOnClickListener {
                      if (point.order > 1) {
                          saveCurrentDialogFieldsToPoint()
                          val prevPoint = targetPoints.find { it.order == point.order - 1 }
                          if (prevPoint != null) {
                              prevPoint.order += 1
                              point.order -= 1
                              reindexTargetPoints()
                              Toast.makeText(this, "🔢 Titik dipindah menjadi No. Urut #${point.order}", Toast.LENGTH_SHORT).show()
                              showPointSettingsDialog(point)
                          }
                      }
                  }

                  btnMoveOrderNext.isEnabled = point.order < targetPoints.size
                  btnMoveOrderNext.alpha = if (point.order < targetPoints.size) 1f else 0.4f
                  btnMoveOrderNext.setOnClickListener {
                      if (point.order < targetPoints.size) {
                          saveCurrentDialogFieldsToPoint()
                          val nextPoint = targetPoints.find { it.order == point.order + 1 }
                          if (nextPoint != null) {
                              nextPoint.order -= 1
                              point.order += 1
                              reindexTargetPoints()
                              Toast.makeText(this, "🔢 Titik dipindah menjadi No. Urut #${point.order}", Toast.LENGTH_SHORT).show()
                              showPointSettingsDialog(point)
                          }
                      }
                  }

                  // FITUR PERMUDAH TITIK DI LOKASI SAMA & PINDAH CEPAT ANTAR TITIK
                  if (targetPoints.size <= 1) {
                      layoutMultiHelper.visibility = View.GONE
                  } else {
                      layoutMultiHelper.visibility = View.VISIBLE
                      layoutQuickSwitch.removeAllViews()
                      layoutSnapPos.removeAllViews()

                      val sorted = targetPoints.sortedBy { it.order }
                      for (other in sorted) {
                          val btnSwitch = Button(this).apply {
                              text = "#${other.order} ${getPointTypeSymbol(other)}"
                              textSize = 10.5f
                              minWidth = 0
                              minHeight = 0
                              setPadding((7 * density).toInt(), 0, (7 * density).toInt(), 0)
                              setTextColor(Color.WHITE)
                              val isCurrent = other.order == point.order
                              backgroundTintList = android.content.res.ColorStateList.valueOf(
                                  Color.parseColor(if (isCurrent) "#10B981" else "#334155")
                              )
                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.WRAP_CONTENT,
                                  (26 * density).toInt()
                              ).apply {
                                  marginEnd = (4 * density).toInt()
                              }
                              setOnClickListener {
                                  if (!isCurrent) {
                                      saveCurrentDialogFieldsToPoint()
                                      bringPointToFront(other)
                                      showPointSettingsDialog(other)
                                  }
                              }
                          }
                          layoutQuickSwitch.addView(btnSwitch)

                          if (other.order != point.order) {
                              val btnSnap = Button(this).apply {
                                  text = "#${other.order}"
                                  textSize = 10.5f
                                  minWidth = 0
                                  minHeight = 0
                                  setPadding((7 * density).toInt(), 0, (7 * density).toInt(), 0)
                                  setTextColor(Color.WHITE)
                                  backgroundTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#0284C7"))
                                  layoutParams = LinearLayout.LayoutParams(
                                      LinearLayout.LayoutParams.WRAP_CONTENT,
                                      (26 * density).toInt()
                                  ).apply {
                                      marginEnd = (4 * density).toInt()
                                  }
                                  setOnClickListener {
                                      point.params.x = other.params.x
                                      point.params.y = other.params.y
                                      try {
                                          windowManager.updateViewLayout(point.view, point.params)
                                      } catch (e: Exception) {}
                                      updatePointVisual(point)
                                      syncAllSwipeOverlays()
                                      Toast.makeText(
                                          this@FloatingOverlayService,
                                          "📍 Posisi Titik #${point.order} disamakan dengan #${other.order}!",
                                          Toast.LENGTH_SHORT
                                      ).show()
                                  }
                              }
                              layoutSnapPos.addView(btnSnap)
                          }
                      }
                      layoutSnapRowContainer.visibility = if (layoutSnapPos.childCount > 0) View.VISIBLE else View.GONE
                  }

                  // Set Jeda dan Unit (Default 1 Detik)
                  if (point.delayUnit == "s") {
                      rbUnitSec.isChecked = true
                      val formatted = if (point.delayValue % 1.0 == 0.0) point.delayValue.toLong().toString() else point.delayValue.toString()
                      etDelay.setText(formatted)
                  } else {
                      rbUnitMs.isChecked = true
                      etDelay.setText(point.delayValue.toLong().toString())
                  }

                  rgDelayUnit.setOnCheckedChangeListener { _, checkedId ->
                      val currentVal = etDelay.text.toString().toDoubleOrNull() ?: 1.0
                      if (checkedId == R.id.rbUnitSec && currentVal >= 100.0) {
                          val secVal = currentVal / 1000.0
                          val formatted = if (secVal % 1.0 == 0.0) secVal.toLong().toString() else secVal.toString()
                          etDelay.setText(formatted)
                      } else if (checkedId == R.id.rbUnitMs && currentVal < 50.0) {
                          val msVal = (currentVal * 1000.0).toLong()
                          etDelay.setText(msVal.toString())
                      }
                  }

                  etSwipeDistance.setText(point.swipeDistancePx.toInt().toString())

                  // Sub-Loop state
                  cbSubLoop.isChecked = point.jumpEnabled
                  layoutSubLoop.visibility = if (point.jumpEnabled) View.VISIBLE else View.GONE
                  etJumpTo.setText(point.jumpToPoint.toString())
                  etJumpCycle.setText(point.jumpAfterCycle.toString())

                  cbSubLoop.setOnCheckedChangeListener { _, isChecked ->
                      layoutSubLoop.visibility = if (isChecked) View.VISIBLE else View.GONE
                  }

                  // Paste & Popup state
                  cbAutoTap.isChecked = point.autoTapPaste
                  etPopupKeyDelay.setText(point.keyDelayMs.toString())

                  // Terapkan pilihan Tipe Aksi awal
                  selectTypeUI(point.type)

                  btnSave.setOnClickListener {
                      saveCurrentDialogFieldsToPoint()
                      closePointSettingsDialog()
                      val isSec = point.delayUnit == "s"
                      val unitLabel = if (isSec) "${point.delayValue} dtk" else "${point.delayMs} ms"
                      if (point.type == "popup") {
                          Toast.makeText(this, "⌨️ Mode Popup Titik #${point.order} Aktif! Geser Pin Ungu (⌨️${point.order}) ke huruf di Keyboard HP.", Toast.LENGTH_LONG).show()
                      } else if (point.type == "swipe_up" || point.type == "swipe_down") {
                          Toast.makeText(this, "Titik #${point.order} (${getPointTypeSymbol(point)} Swipe) disimpan! Tarik ujung panah #${point.order} untuk atur panjang.", Toast.LENGTH_SHORT).show()
                      } else if (point.type == "paste" && point.pasteTexts.size > 1) {
                          Toast.makeText(this, "📋 Titik #${point.order} Multi-Paste (${point.pasteTexts.size} teks berputar mengikuti siklus) disimpan!", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "Titik #${point.order} disimpan (Jeda: $unitLabel) ✔", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnClose.setOnClickListener {
                      closePointSettingsDialog()
                  }

                  windowManager.addView(dialogView, dialogParams)
                  currentDialogView = dialogView
                  currentDialogParams = dialogParams
              }

              private fun closePointSettingsDialog() {
                  if (currentDialogView != null) {
                      try {
                          windowManager.removeView(currentDialogView)
                      } catch (e: Exception) {}
                      currentDialogView = null
                      currentDialogParams = null
                  }
              }

