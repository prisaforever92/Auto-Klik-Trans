      - name: Validate Generated Android Project Files
        run: |
          echo "=== Struktur Project Android yang Dibuat Otomatis ==="
          ls -la app/src/main/
          ls -la app/src/main/res/layout/
          echo "Semua file Android berhasil digenerate!"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoKlik-Android-APK
          path: app/build/outputs/apk/debug/*.apk
