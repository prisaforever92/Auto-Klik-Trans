          mkdir -p app/src/main/java/com/autoklik/android/ui
          cat << 'EOF' > app/src/main/java/com/autoklik/android/ui/MainActivity.kt
          package com.autoklik.android.ui

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.autoklik.android.R
          import com.autoklik.android.service.AutoClickAccessibilityService
          import com.autoklik.android.service.FloatingOverlayService
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {

              private lateinit var txtAccessibilityStatus: TextView
              private lateinit var txtOverlayStatus: TextView
              private lateinit var btnAccessibility: Button
              private lateinit var btnOverlay: Button
              private lateinit var btnStartFloating: Button
              private lateinit var btnStopFloating: Button

              private lateinit var spProfiles: Spinner
              private lateinit var btnLoadProfile: Button
              private lateinit var btnDeleteProfile: Button
              private lateinit var etNewProfileName: EditText
              private lateinit var btnSaveNewProfile: Button

              private val profileList = mutableListOf<String>()
              private lateinit var profileAdapter: ArrayAdapter<String>

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  txtAccessibilityStatus = findViewById(R.id.txtAccessibilityStatus)
                  txtOverlayStatus = findViewById(R.id.txtOverlayStatus)
                  btnAccessibility = findViewById(R.id.btnAccessibility)
                  btnOverlay = findViewById(R.id.btnOverlay)
                  btnStartFloating = findViewById(R.id.btnStartFloating)
                  btnStopFloating = findViewById(R.id.btnStopFloating)

                  spProfiles = findViewById(R.id.spProfiles)
                  btnLoadProfile = findViewById(R.id.btnLoadProfile)
                  btnDeleteProfile = findViewById(R.id.btnDeleteProfile)
                  etNewProfileName = findViewById(R.id.etNewProfileName)
                  btnSaveNewProfile = findViewById(R.id.btnSaveNewProfile)

                  setupProfilesManager()

                  btnAccessibility.setOnClickListener {
                      try {
                          val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          startActivity(intent)
                          Toast.makeText(this, "Buka Aplikasi Terunduh > Aktifkan AutoKlik", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Buka Pengaturan Aksesibilitas di HP Anda", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnOverlay.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          try {
                              val intent = Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                              startActivity(intent)
                          } catch (e: Exception) {
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION)
                              startActivity(intent)
                          }
                      } else {
                          Toast.makeText(this, "Izin overlay otomatis aktif pada versi ini", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnStartFloating.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Harap izinkan Jendela Mengapung terlebih dahulu", Toast.LENGTH_LONG).show()
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          startActivity(intent)
                          return@setOnClickListener
                      }

                      if (!isAccessibilityServiceEnabled()) {
                          Toast.makeText(this, "Harap aktifkan Layanan Aksesibilitas AutoKlik!", Toast.LENGTH_LONG).show()
                          val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          startActivity(intent)
                          return@setOnClickListener
                      }

                      val intent = Intent(this, FloatingOverlayService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      Toast.makeText(this, "Panel Melayang Aktif! Tekan ➕ untuk titik target.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }

                  btnStopFloating.setOnClickListener {
                      val intent = Intent(this, FloatingOverlayService::class.java)
                      stopService(intent)
                      Toast.makeText(this, "Panel Melayang Ditutup", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun setupProfilesManager() {
                  profileAdapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, profileList)
                  spProfiles.adapter = profileAdapter

                  loadProfileListFromPrefs()

                  btnSaveNewProfile.setOnClickListener {
                      val name = etNewProfileName.text.toString().trim()
                      if (name.isEmpty()) {
                          Toast.makeText(this, "Ketikkan nama konfigurasi terlebih dahulu!", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      saveProfileToPrefs(name)
                      etNewProfileName.setText("")
                      loadProfileListFromPrefs()
                      Toast.makeText(this, "Konfigurasi '$name' berhasil disimpan! ✔", Toast.LENGTH_SHORT).show()
                  }

                  btnLoadProfile.setOnClickListener {
                      val selected = spProfiles.selectedItem?.toString()
                      if (selected.isNullOrBlank() || selected == "(Belum ada konfigurasi tersimpan)") {
                          Toast.makeText(this, "Pilih konfigurasi yang valid atau simpan dari tombol 💾 di panel melayang!", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Harap izinkan Jendela Mengapung terlebih dahulu", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }

                      val intent = Intent(this, FloatingOverlayService::class.java).apply {
                          putExtra("load_profile_name", selected)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      Toast.makeText(this, "Konfigurasi '$selected' dimuat ke Panel Melayang! 📂", Toast.LENGTH_SHORT).show()
                      moveTaskToBack(true)
                  }

                  btnDeleteProfile.setOnClickListener {
                      val selected = spProfiles.selectedItem?.toString()
                      if (!selected.isNullOrBlank() && selected != "(Belum ada konfigurasi tersimpan)") {
                          deleteProfileFromPrefs(selected)
                          loadProfileListFromPrefs()
                          Toast.makeText(this, "Konfigurasi '$selected' dihapus 🗑️", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "Tidak ada konfigurasi untuk dihapus", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun loadProfileListFromPrefs() {
                  profileList.clear()
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE)
                  for ((key, value) in prefs.all) {
                      val str = value as? String ?: continue
                      try {
                          val json = JSONObject(str)
                          val pts = json.optJSONArray("points")
                          if (pts != null && pts.length() > 0) {
                              profileList.add(key)
                          }
                      } catch (e: Exception) {}
                  }

                  if (profileList.isEmpty()) {
                      profileList.add("(Belum ada konfigurasi tersimpan)")
                  }
                  profileAdapter.notifyDataSetChanged()
              }

              private fun saveProfileToPrefs(profileName: String) {
                  val defaultPoints = org.json.JSONArray().apply {
                      put(JSONObject().apply {
                          put("order", 1)
                          put("x", 220)
                          put("y", 420)
                          put("type", "tap")
                          put("delayValue", 1.0)
                          put("delayUnit", "s")
                          put("delayMs", 1000L)
                          put("swipeDistancePx", 300.0)
                          put("jumpEnabled", false)
                          put("jumpToPoint", 7)
                          put("jumpAfterCycle", 1)
                          put("pasteText", "a")
                          put("autoTapPaste", true)
                      })
                  }
                  val profileObj = JSONObject().apply {
                      put("name", profileName)
                      put("size_percent", 50)
                      put("points", defaultPoints)
                      put("saved_at", System.currentTimeMillis())
                  }
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE).edit()
                  prefs.putString(profileName, profileObj.toString())
                  prefs.apply()
              }

              private fun deleteProfileFromPrefs(profileName: String) {
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE).edit()
                  prefs.remove(profileName)
                  prefs.apply()
              }

              override fun onResume() {
                  super.onResume()
                  updatePermissionStatus()
                  loadProfileListFromPrefs()
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  try {
                      val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                      val enabledServices = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                      for (service in enabledServices) {
                          if (service.resolveInfo.serviceInfo.packageName == packageName) {
                              return true
                          }
                      }
                  } catch (e: Exception) {}
                  return AutoClickAccessibilityService.instance != null
              }

              private fun updatePermissionStatus() {
                  val isA11y = isAccessibilityServiceEnabled()
                  if (isA11y) {
                      txtAccessibilityStatus.text = "Aksesibilitas: 🟢 AKTIF (Siap Klik Otomatis)"
                      txtAccessibilityStatus.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtAccessibilityStatus.text = "Aksesibilitas: 🔴 NONAKTIF (Harap Aktifkan)"
                      txtAccessibilityStatus.setTextColor(Color.parseColor("#EF4444"))
                  }

                  val isOverlay = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else {
                      true
                  }
                  if (isOverlay) {
                      txtOverlayStatus.text = "Jendela Mengapung: 🟢 SUDAH DIIZINKAN"
                      txtOverlayStatus.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtOverlayStatus.text = "Jendela Mengapung: 🔴 BELUM DIIZINKAN (Wajib)"
                      txtOverlayStatus.setTextColor(Color.parseColor("#EF4444"))
                  }
              }
          }
