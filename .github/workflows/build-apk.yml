name: Build Android AutoKlik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoKlik Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate Android Scaffolding & Project Files
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoKlik"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
          }
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'kotlin-kapt'
          }

          android {
              namespace 'com.autoklik.android'
              compileSdk 34

              defaultConfig {
                  applicationId "com.autoklik.android"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'
          }
          EOF

          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.autoklik.android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />

                  <service
                      android:name=".service.AutoClickAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AutoKlik Trans</string>
              <string name="accessibility_desc">Layanan Aksesibilitas AutoKlik untuk simulasi sentuhan dan multi-gesture tanpa root.</string>
          </resources>
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:windowBackground">#0F172A</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/bg_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#E60F172A" />
              <stroke android:width="2.5dp" android:color="#10B981" />
          </shape>
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/bg_panel_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F20F172A" />
              <corners android:radius="24dp" />
              <stroke android:width="1.5dp" android:color="#334155" />
          </shape>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:gravity="center_horizontal">

              <!-- Garis Panah Atas (Swipe Up) - Tarik Ujung Panah untuk Atur Panjang/Pendek -->
              <LinearLayout
                  android:id="@+id/layoutArrowUp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center_horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="8dp"
                  android:visibility="gone">

                  <!-- Handle Ujung Panah Atas yang Bisa Diseret (Drag) -->
                  <TextView
                      android:id="@+id/tvArrowHandleUp"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="#E60F172A"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:text="▲ SERET"
                      android:textColor="#38BDF8"
                      android:textSize="10sp"
                      android:textStyle="bold" />

                  <!-- Batang Garis Panah Atas (Panjang sesuai tarikan jari) -->
                  <View
                      android:id="@+id/viewLineUp"
                      android:layout_width="4dp"
                      android:layout_height="140dp"
                      android:background="#38BDF8" />

                  <TextView
                      android:id="@+id/tvSwipeDistUp"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="▲ 140px"
                      android:textColor="#38BDF8"
                      android:textSize="9sp"
                      android:background="#D90F172A"
                      android:paddingStart="4dp"
                      android:paddingEnd="4dp" />
              </LinearLayout>

              <!-- Lingkaran Titik Target Utama (Bulat Sempurna 1:1) -->
              <FrameLayout
                  android:id="@+id/pointRoot"
                  android:layout_width="30dp"
                  android:layout_height="30dp"
                  android:background="@drawable/bg_target_point">

                  <TextView
                      android:id="@+id/tvTargetNumber"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center"
                      android:includeFontPadding="false"
                      android:text="1"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvTargetType"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|center_horizontal"
                      android:layout_marginBottom="1dp"
                      android:includeFontPadding="false"
                      android:text="🎯"
                      android:textSize="8sp" />
              </FrameLayout>

              <!-- Garis Panah Bawah (Swipe Down) - Tarik Ujung Panah untuk Atur Panjang/Pendek -->
              <LinearLayout
                  android:id="@+id/layoutArrowDown"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center_horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="8dp"
                  android:visibility="gone">

                  <TextView
                      android:id="@+id/tvSwipeDistDown"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="▼ 140px"
                      android:textColor="#F59E0B"
                      android:textSize="9sp"
                      android:background="#D90F172A"
                      android:paddingStart="4dp"
                      android:paddingEnd="4dp" />

                  <!-- Batang Garis Panah Bawah (Panjang sesuai tarikan jari) -->
                  <View
                      android:id="@+id/viewLineDown"
                      android:layout_width="4dp"
                      android:layout_height="140dp"
                      android:background="#F59E0B" />

                  <!-- Handle Ujung Panah Bawah yang Bisa Diseret (Drag) -->
                  <TextView
                      android:id="@+id/tvArrowHandleDown"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="#E60F172A"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:text="▼ SERET"
                      android:textColor="#F59E0B"
                      android:textSize="10sp"
                      android:textStyle="bold" />
              </LinearLayout>
          </LinearLayout>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_size_dialog.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="300dp"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="@drawable/bg_panel_pill"
              android:padding="16dp">

              <TextView
                  android:id="@+id/tvSizeDialogTitle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Ukuran Titik: 50% (30dp)"
                  android:textColor="#10B981"
                  android:textSize="15sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:text="Rentang: 0% (20dp terkecil) - 100% (40dp terbesar)"
                  android:textColor="#94A3B8"
                  android:textSize="11sp" />

              <SeekBar
                  android:id="@+id/sbSizePercent"
                  android:layout_width="match_parent"
                  android:layout_height="36dp"
                  android:layout_marginTop="12dp"
                  android:max="100"
                  android:progress="50" />

              <!-- Tombol Preset Cepat -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:orientation="horizontal"
                  android:gravity="center">

                  <Button
                      android:id="@+id/btnSize0"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_weight="1"
                      android:text="0%\n20dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize25"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="25%\n25dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize50"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="50%\n30dp"
                      android:textSize="8sp"
                      android:backgroundTint="#10B981"
                      android:textColor="#FFFFFF"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize75"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="75%\n35dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize100"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="100%\n40dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />
              </LinearLayout>

              <Button
                  android:id="@+id/btnSizeClose"
                  android:layout_width="match_parent"
                  android:layout_height="36dp"
                  android:layout_marginTop="14dp"
                  android:backgroundTint="#475569"
                  android:text="Tutup"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp" />
          </LinearLayout>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_point_dialog.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="340dp"
              android:layout_height="wrap_content"
              android:background="@drawable/bg_panel_pill"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:id="@+id/tvDialogTitle"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Pengaturan Titik #1"
                      android:textColor="#10B981"
                      android:textSize="16sp"
                      android:textStyle="bold" />

                  <!-- PILIHAN TIPE GERAKAN (FITUR 1 & 13) -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Pilih Tipe Gerakan:"
                      android:textColor="#CBD5E1"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <RadioGroup
                      android:id="@+id/rgPointType"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp">

                      <RadioButton
                          android:id="@+id/rbTypeTap"
                          android:layout_width="wrap_content"
                          android:layout_height="32dp"
                          android:text="🎯 Tap (Sentuh Titik)"
                          android:textColor="#F8FAFC"
                          android:textSize="12sp"
                          android:checked="true" />

                      <RadioButton
                          android:id="@+id/rbTypeSwipeUp"
                          android:layout_width="wrap_content"
                          android:layout_height="32dp"
                          android:text="▲ Swipe Up (Garis Panah ke Atas)"
                          android:textColor="#38BDF8"
                          android:textSize="12sp" />

                      <RadioButton
                          android:id="@+id/rbTypeSwipeDown"
                          android:layout_width="wrap_content"
                          android:layout_height="32dp"
                          android:text="▼ Swipe Down (Garis Panah ke Bawah)"
                          android:textColor="#F59E0B"
                          android:textSize="12sp" />

                      <RadioButton
                          android:id="@+id/rbTypePaste"
                          android:layout_width="wrap_content"
                          android:layout_height="32dp"
                          android:text="📋 Paste (Tap Form - Paste Teks)"
                          android:textColor="#F8FAFC"
                          android:textSize="12sp" />

                      <RadioButton
                          android:id="@+id/rbTypePopup"
                          android:layout_width="wrap_content"
                          android:layout_height="32dp"
                          android:text="⌨️ Popup (Tap Form + Pin Huruf Keyboard)"
                          android:textColor="#C084FC"
                          android:textStyle="bold"
                          android:textSize="12sp" />
                  </RadioGroup>

                  <!-- FITUR 1: PENGATURAN PANJANG GARIS SWIPE (SERET LANGSUNG DI LAYAR) -->
                  <LinearLayout
                      android:id="@+id/layoutSwipeSettings"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:layout_marginTop="6dp"
                      android:background="#131F33"
                      android:padding="10dp"
                      android:visibility="gone">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="💡 Cara Atur Panjang/Pendek Swipe: Setelah klik Simpan, seret langsung ujung panah (▲ SERET / ▼ SERET) di layar HP Anda untuk memanjangkan atau memendekkan garis swipe!"
                          android:textColor="#38BDF8"
                          android:textSize="11sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:layout_marginTop="6dp">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Panjang Garis Saat Ini (px):"
                              android:textColor="#CBD5E1"
                              android:textSize="11sp" />

                          <EditText
                              android:id="@+id/etSwipeDistance"
                              android:layout_width="80dp"
                              android:layout_height="36dp"
                              android:background="#1E293B"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="350"
                              android:textColor="#38BDF8"
                              android:textSize="13sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- FITUR 4: PILIHAN JEDA (MILISEKON / DETIK) - 2 BARIS JELAS TERLIHAT -->
                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="6dp"
                      android:background="#334155" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Jeda Setelah Titik Ini:"
                      android:textColor="#10B981"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:background="#131F33"
                      android:padding="10dp"
                      android:orientation="vertical">

                      <!-- Baris 1: Kotak Input Angka Jeda -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Masukkan Angka Jeda:"
                              android:textColor="#E2E8F0"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <EditText
                              android:id="@+id/etDialogDelay"
                              android:layout_width="95dp"
                              android:layout_height="38dp"
                              android:background="#1E293B"
                              android:gravity="center"
                              android:inputType="numberDecimal"
                              android:text="500"
                              android:textColor="#10B981"
                              android:textSize="14sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <!-- Baris 2: Pilihan Satuan Waktu (Milisekon vs Detik) 100% Terlihat -->
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="Pilih Satuan Waktu (Milisekon / Detik):"
                          android:textColor="#CBD5E1"
                          android:textSize="11sp" />

                      <RadioGroup
                          android:id="@+id/rgDelayUnit"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:orientation="horizontal">

                          <RadioButton
                              android:id="@+id/rbUnitMs"
                              android:layout_width="0dp"
                              android:layout_height="36dp"
                              android:layout_weight="1"
                              android:text="⚡ Milisekon (ms)"
                              android:textColor="#F8FAFC"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:checked="true" />

                          <RadioButton
                              android:id="@+id/rbUnitSec"
                              android:layout_width="0dp"
                              android:layout_height="36dp"
                              android:layout_weight="1"
                              android:text="⏱️ Detik (s)"
                              android:textColor="#38BDF8"
                              android:textSize="12sp"
                              android:textStyle="bold" />
                      </RadioGroup>
                  </LinearLayout>

                  <!-- FITUR 2: SUB-LOOP PADA TITIK -->
                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="6dp"
                      android:background="#334155" />

                  <CheckBox
                      android:id="@+id/cbPointSubLoop"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Lompat Balik (Sub-Loop) di Titik Ini"
                      android:textColor="#38BDF8"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <LinearLayout
                      android:id="@+id/layoutPointSubLoopFields"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:layout_marginTop="6dp"
                      android:background="#131F33"
                      android:padding="10dp"
                      android:visibility="gone">

                      <!-- Baris 1: Lompat Balik ke Titik Target -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Lompat Balik ke Titik #:"
                              android:textColor="#E2E8F0"
                              android:textSize="12sp"
                              android:textStyle="bold" />

                          <EditText
                              android:id="@+id/etPointJumpTo"
                              android:layout_width="70dp"
                              android:layout_height="38dp"
                              android:background="#1E293B"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="7"
                              android:textColor="#38BDF8"
                              android:textSize="14sp"
                              android:textStyle="bold" />
