name: Build Android AutoKlik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoKlik Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate Android Scaffolding & Project Files
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoKlik"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
          }
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'kotlin-kapt'
          }

          android {
              namespace 'com.autoklik.android'
              compileSdk 34

              defaultConfig {
                  applicationId "com.autoklik.android"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'
          }
          EOF

          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.autoklik.android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />

                  <service
                      android:name=".service.AutoClickAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AutoKlik Trans</string>
              <string name="accessibility_desc">Layanan Aksesibilitas AutoKlik untuk simulasi sentuhan dan multi-gesture tanpa root.</string>
          </resources>
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:windowBackground">#0F172A</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/bg_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#E60F172A" />
              <stroke android:width="2.5dp" android:color="#10B981" />
          </shape>
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/bg_panel_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F20F172A" />
              <corners android:radius="24dp" />
              <stroke android:width="1.5dp" android:color="#334155" />
          </shape>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/pointRoot"
              android:layout_width="30dp"
              android:layout_height="30dp"
              android:background="@drawable/bg_target_point">

              <!-- Titik Bidik Tengah Presisi (Center Crosshair Dot) tepat di koordinat klik (50%, 50%) -->
              <View
                  android:id="@+id/viewCenterDot"
                  android:layout_width="3dp"
                  android:layout_height="3dp"
                  android:layout_gravity="center"
                  android:alpha="0.45"
                  android:background="#38BDF8" />

              <!-- Nomor Urut Titik tepat di tengah lingkaran -->
              <TextView
                  android:id="@+id/tvTargetNumber"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:includeFontPadding="false"
                  android:text="1"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp"
                  android:textStyle="bold" />

              <!-- Simbol Tipe Gerakan (Tap / Swipe / Paste / Popup) -->
              <TextView
                  android:id="@+id/tvTargetType"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom|center_horizontal"
                  android:layout_marginBottom="1dp"
                  android:includeFontPadding="false"
                  android:singleLine="true"
                  android:text="🎯"
                  android:textColor="#E2E8F0"
                  android:textSize="7.5sp" />

              <!-- Placeholder tersembunyi untuk kompatibilitas ID lama -->
              <View
                  android:id="@+id/layoutArrowUp"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:visibility="gone" />

              <View
                  android:id="@+id/layoutArrowDown"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:visibility="gone" />

          </FrameLayout>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_size_dialog.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="300dp"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="@drawable/bg_panel_pill"
              android:padding="16dp">

              <TextView
                  android:id="@+id/tvSizeDialogTitle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Ukuran Titik: 50% (30dp)"
                  android:textColor="#10B981"
                  android:textSize="15sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:text="Rentang: 0% (20dp terkecil) - 100% (40dp terbesar)"
                  android:textColor="#94A3B8"
                  android:textSize="11sp" />

              <SeekBar
                  android:id="@+id/sbSizePercent"
                  android:layout_width="match_parent"
                  android:layout_height="36dp"
                  android:layout_marginTop="12dp"
                  android:max="100"
                  android:progress="50" />

              <!-- Tombol Preset Cepat -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:orientation="horizontal"
                  android:gravity="center">

                  <Button
                      android:id="@+id/btnSize0"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_weight="1"
                      android:text="0%\n20dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize25"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="25%\n25dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize50"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="50%\n30dp"
                      android:textSize="8sp"
                      android:backgroundTint="#10B981"
                      android:textColor="#FFFFFF"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize75"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="75%\n35dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />

                  <Button
                      android:id="@+id/btnSize100"
                      android:layout_width="0dp"
                      android:layout_height="34dp"
                      android:layout_marginStart="3dp"
                      android:layout_weight="1"
                      android:text="100%\n40dp"
                      android:textSize="8sp"
                      android:backgroundTint="#334155"
                      android:textColor="#F8FAFC"
                      android:padding="0dp" />
              </LinearLayout>

              <Button
                  android:id="@+id/btnSizeClose"
                  android:layout_width="match_parent"
                  android:layout_height="36dp"
                  android:layout_marginTop="14dp"
                  android:backgroundTint="#475569"
                  android:text="Tutup"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp" />
          </LinearLayout>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_point_dialog.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="320dp"
              android:layout_height="wrap_content"
              android:background="@drawable/bg_panel_pill"
              android:padding="12dp"
              android:scrollbars="none">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <!-- BARIS 1: JUDUL TITIK + TOMBOL UBAH NO. URUT DALAM 1 BARIS RINGKAS -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/tvDialogTitle"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="Titik #1"
                          android:textColor="#10B981"
                          android:textSize="14.5sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:id="@+id/layoutReorderRow"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginEnd="4dp"
                              android:text="Urutan:"
                              android:textColor="#94A3B8"
                              android:textSize="10sp" />

                          <Button
                              android:id="@+id/btnMoveOrderPrev"
                              android:layout_width="wrap_content"
                              android:layout_height="26dp"
                              android:backgroundTint="#334155"
                              android:minWidth="0dp"
                              android:paddingStart="7dp"
                              android:paddingEnd="7dp"
                              android:paddingTop="0dp"
                              android:paddingBottom="0dp"
                              android:text="⬅️"
                              android:textColor="#FFFFFF"
                              android:textSize="10sp" />

                          <Button
                              android:id="@+id/btnMoveOrderNext"
                              android:layout_width="wrap_content"
                              android:layout_height="26dp"
                              android:layout_marginStart="3dp"
                              android:backgroundTint="#334155"
                              android:minWidth="0dp"
                              android:paddingStart="7dp"
                              android:paddingEnd="7dp"
                              android:paddingTop="0dp"
                              android:paddingBottom="0dp"
                              android:text="➡️"
                              android:textColor="#FFFFFF"
                              android:textSize="10sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- BARIS 2: PINDAH EDIT TITIK & SAMAKAN POSISI (KOMPAK) -->
                  <LinearLayout
                      android:id="@+id/layoutMultiPointHelper"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:background="#131F33"
                      android:orientation="vertical"
                      android:padding="6dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="46dp"
                              android:layout_height="wrap_content"
                              android:text="🔄 Edit:"
                              android:textColor="#94A3B8"
                              android:textSize="10sp"
                              android:textStyle="bold" />

                          <HorizontalScrollView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:scrollbars="none">

                              <LinearLayout
                                  android:id="@+id/layoutQuickSwitchPoints"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal" />
                          </HorizontalScrollView>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/layoutSnapRowContainer"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:id="@+id/tvSnapPositionLabel"
                              android:layout_width="46dp"
                              android:layout_height="wrap_content"
                              android:text="📍 Sama:"
                              android:textColor="#38BDF8"
                              android:textSize="10sp"
                              android:textStyle="bold" />

                          <HorizontalScrollView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:scrollbars="none">

                              <LinearLayout
                                  android:id="@+id/layoutSnapPositionPoints"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:orientation="horizontal" />
                          </HorizontalScrollView>
                      </LinearLayout>
                  </LinearLayout>

                  <!-- BARIS 3: PILIHAN TIPE GERAKAN (2 BARIS TOMBOL GRID RINGKAS) -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="7dp"
                      android:text="Tipe Aksi Titik:"
                      android:textColor="#CBD5E1"
                      android:textSize="11sp"
                      android:textStyle="bold" />

                  <!-- RadioGroup tersembunyi untuk menjaga kompatibilitas penuh state tipe -->
                  <RadioGroup
                      android:id="@+id/rgPointType"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="3dp"
                      android:orientation="vertical">

                      <!-- Baris Grid 1: Tap | Swipe Up | Swipe Down -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">

                          <RadioButton
                              android:id="@+id/rbTypeTap"
                              android:layout_width="0dp"
                              android:layout_height="32dp"
                              android:layout_marginEnd="3dp"
                              android:layout_weight="0.9"
                              android:background="#1E293B"
                              android:button="@null"
                              android:checked="true"
                              android:gravity="center"
                              android:text="🎯 Tap"
                              android:textColor="#F8FAFC"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <RadioButton
                              android:id="@+id/rbTypeSwipeUp"
                              android:layout_width="0dp"
                              android:layout_height="32dp"
                              android:layout_marginEnd="3dp"
                              android:layout_weight="1.15"
                              android:background="#1E293B"
                              android:button="@null"
                              android:gravity="center"
                              android:text="▲ Swipe Atas"
                              android:textColor="#38BDF8"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <RadioButton
                              android:id="@+id/rbTypeSwipeDown"
                              android:layout_width="0dp"
                              android:layout_height="32dp"
                              android:layout_weight="1.2"
                              android:background="#1E293B"
                              android:button="@null"
                              android:gravity="center"
                              android:text="▼ Swipe Bawah"
                              android:textColor="#F59E0B"
                              android:textSize="11sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <!-- Baris Grid 2: Paste (Multi-Teks) | Popup Keyboard -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="3dp"
                          android:orientation="horizontal">

                          <RadioButton
                              android:id="@+id/rbTypePaste"
                              android:layout_width="0dp"
                              android:layout_height="32dp"
                              android:layout_marginEnd="3dp"
                              android:layout_weight="1"
                              android:background="#1E293B"
                              android:button="@null"
                              android:gravity="center"
                              android:text="📋 Paste Teks"
                              android:textColor="#F8FAFC"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <RadioButton
                              android:id="@+id/rbTypePopup"
                              android:layout_width="0dp"
                              android:layout_height="32dp"
                              android:layout_weight="1"
                              android:background="#1E293B"
                              android:button="@null"
                              android:gravity="center"
                              android:text="⌨️ Popup Key"
                              android:textColor="#C084FC"
                              android:textSize="11sp"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </RadioGroup>

                  <!-- PANEL KONTEKSTUAL 1: PENGATURAN SWIPE (1 BARIS RINGKAS) -->
                  <LinearLayout
                      android:id="@+id/layoutSwipeSettings"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="5dp"
                      android:background="#131F33"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:padding="7dp"
                      android:visibility="gone">

                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="📏 Panjang Garis (px) / Tarik ▲#:"
                          android:textColor="#38BDF8"
                          android:textSize="11sp"
                          android:textStyle="bold" />

                      <EditText
                          android:id="@+id/etSwipeDistance"
                          android:layout_width="70dp"
                          android:layout_height="32dp"
                          android:background="#1E293B"
                          android:gravity="center"
                          android:inputType="number"
                          android:text="300"
                          android:textColor="#38BDF8"
                          android:textSize="12.5sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- PANEL KONTEKSTUAL 2: MULTI-PASTE MENGIKUTI SIKLUS (+ TAMBAH TEKS) -->
                  <LinearLayout
                      android:id="@+id/layoutDialogPasteFields"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="5dp"
                      android:background="#131F33"
                      android:orientation="vertical"
                      android:padding="7dp"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="📋 Daftar Teks Paste (Urut Siklus):"
                              android:textColor="#38BDF8"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <Button
                              android:id="@+id/btnAddPasteText"
                              android:layout_width="wrap_content"
                              android:layout_height="27dp"
                              android:backgroundTint="#0284C7"
                              android:minWidth="0dp"
                              android:paddingStart="8dp"
                              android:paddingEnd="8dp"
                              android:paddingTop="0dp"
                              android:paddingBottom="0dp"
                              android:text="➕ Tambah Teks"
                              android:textColor="#FFFFFF"
                              android:textSize="10sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <!-- Container daftar input Teks #1, #2, #3... -->
                      <LinearLayout
                          android:id="@+id/layoutPasteTextsContainer"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:orientation="vertical" />

                      <!-- EditText fallback tersembunyi untuk kompatibilitas ID lama -->
                      <EditText
                          android:id="@+id/etDialogPasteText"
                          android:layout_width="0dp"
                          android:layout_height="0dp"
                          android:visibility="gone" />

                      <CheckBox
                          android:id="@+id/cbDialogAutoTap"
                          android:layout_width="wrap_content"
                          android:layout_height="28dp"
                          android:layout_marginTop="2dp"
                          android:checked="true"
                          android:text="Tap form dulu sebelum Paste"
                          android:textColor="#CBD5E1"
                          android:textSize="10.5sp" />
                  </LinearLayout>

                  <!-- PANEL KONTEKSTUAL 3: POPUP KEYBOARD (1 BARIS RINGKAS) -->
                  <LinearLayout
                      android:id="@+id/layoutDialogPopupFields"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="5dp"
                      android:background="#1E1B4B"
                      android:orientation="vertical"
                      android:padding="7dp"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="⌨️ Jeda Tunggu Keyboard (ms):"
                              android:textColor="#C084FC"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <EditText
                              android:id="@+id/etPopupKeyDelay"
                              android:layout_width="70dp"
                              android:layout_height="32dp"
                              android:background="#0F172A"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="400"
                              android:textColor="#FACC15"
                              android:textSize="12.5sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:text="💡 Geser Pin Ungu (⌨️ KEY) ke atas huruf di Keyboard HP Anda."
                          android:textColor="#CBD5E1"
