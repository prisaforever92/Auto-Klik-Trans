              // Fitur 15: Manajemen Profil Skrip
              private fun setupProfilesManager() {
                  profileAdapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, profileList)
                  spProfiles.adapter = profileAdapter

                  loadProfileListFromPrefs()

                  btnSaveNewProfile.setOnClickListener {
                      val name = etNewProfileName.text.toString().trim()
                      if (name.isEmpty()) {
                          Toast.makeText(this, "Ketikkan nama profil skrip terlebih dahulu!", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      saveProfileToPrefs(name)
                      etNewProfileName.setText("")
                      loadProfileListFromPrefs()
                      Toast.makeText(this, "Profil '$name' berhasil disimpan! ✔", Toast.LENGTH_SHORT).show()
                  }

                  btnLoadProfile.setOnClickListener {
                      val selected = spProfiles.selectedItem?.toString()
                      if (selected != null) {
                          loadProfileFromPrefs(selected)
                          Toast.makeText(this, "Profil '$selected' berhasil dimuat! 📂", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnDeleteProfile.setOnClickListener {
                      val selected = spProfiles.selectedItem?.toString()
                      if (selected != null && profileList.size > 1) {
                          deleteProfileFromPrefs(selected)
                          loadProfileListFromPrefs()
                          Toast.makeText(this, "Profil '$selected' dihapus 🗑️", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "Profil default tidak dapat dihapus", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun loadProfileListFromPrefs() {
                  profileList.clear()
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE)
                  val allKeys = prefs.all.keys
                  if (allKeys.isEmpty()) {
                      saveProfileToPrefs("10 Titik Sub-Loop (10 ➔ 7)")
                      saveProfileToPrefs("Auto-Scroll Feed (Swipe Up)")
                      saveProfileToPrefs("Auto-Paste & Multi-Tap")
                      profileList.addAll(listOf("10 Titik Sub-Loop (10 ➔ 7)", "Auto-Scroll Feed (Swipe Up)", "Auto-Paste & Multi-Tap"))
                  } else {
                      profileList.addAll(allKeys)
                  }
                  profileAdapter.notifyDataSetChanged()
              }

              private fun saveProfileToPrefs(profileName: String) {
                  val profileObj = JSONObject().apply {
                      put("subloop_enabled", cbSubLoop.isChecked)
                      put("subloop_start", etSubLoopStart.text.toString().toIntOrNull() ?: 7)
                      put("subloop_end", etSubLoopEnd.text.toString().toIntOrNull() ?: 10)
                      put("jitter_enabled", cbJitter.isChecked)
                      put("paste_text", etPasteText.text.toString())
                      put("auto_tap_paste", cbAutoTapPaste.isChecked)
                      put("click_interval_ms", etInterval.text.toString().toLongOrNull() ?: 500L)
                      put("click_duration_ms", etDuration.text.toString().toLongOrNull() ?: 50L)
                  }

                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE).edit()
                  prefs.putString(profileName, profileObj.toString())
                  prefs.apply()
              }

              private fun loadProfileFromPrefs(profileName: String) {
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE)
                  val jsonStr = prefs.getString(profileName, null) ?: return
                  try {
                      val obj = JSONObject(jsonStr)
                      cbSubLoop.isChecked = obj.optBoolean("subloop_enabled", true)
                      etSubLoopStart.setText(obj.optInt("subloop_start", 7).toString())
                      etSubLoopEnd.setText(obj.optInt("subloop_end", 10).toString())
                      cbJitter.isChecked = obj.optBoolean("jitter_enabled", true)
                      etPasteText.setText(obj.optString("paste_text", "AutoKlik Trans"))
                      cbAutoTapPaste.isChecked = obj.optBoolean("auto_tap_paste", true)
                      etInterval.setText(obj.optLong("click_interval_ms", 500L).toString())
                      etDuration.setText(obj.optLong("click_duration_ms", 50L).toString())

                      saveCurrentSettings()
                  } catch (e: Exception) {}
              }

              private fun deleteProfileFromPrefs(profileName: String) {
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE).edit()
                  prefs.remove(profileName)
                  prefs.apply()
              }

              private fun loadCurrentSettings() {
                  val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE)
                  cbSubLoop.isChecked = prefs.getBoolean("subloop_enabled", true)
                  etSubLoopStart.setText(prefs.getInt("subloop_start", 7).toString())
                  etSubLoopEnd.setText(prefs.getInt("subloop_end", 10).toString())
                  cbJitter.isChecked = prefs.getBoolean("jitter_enabled", true)
                  etPasteText.setText(prefs.getString("paste_text", "AutoKlik Trans"))
                  cbAutoTapPaste.isChecked = prefs.getBoolean("auto_tap_paste", true)
                  etInterval.setText(prefs.getLong("click_interval_ms", 500L).toString())
                  etDuration.setText(prefs.getLong("click_duration_ms", 50L).toString())
              }

              private fun saveCurrentSettings() {
                  val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE).edit()
                  prefs.putBoolean("subloop_enabled", cbSubLoop.isChecked)
                  prefs.putInt("subloop_start", etSubLoopStart.text.toString().toIntOrNull() ?: 7)
                  prefs.putInt("subloop_end", etSubLoopEnd.text.toString().toIntOrNull() ?: 10)
                  prefs.putBoolean("jitter_enabled", cbJitter.isChecked)
                  prefs.putString("paste_text", etPasteText.text.toString())
                  prefs.putBoolean("auto_tap_paste", cbAutoTapPaste.isChecked)
                  prefs.putLong("click_interval_ms", etInterval.text.toString().toLongOrNull() ?: 500L)
                  prefs.putLong("click_duration_ms", etDuration.text.toString().toLongOrNull() ?: 50L)
                  prefs.apply()
              }

              override fun onResume() {
                  super.onResume()
                  updatePermissionStatus()
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  try {
                      val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                      val enabledServices = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                      for (service in enabledServices) {
                          if (service.resolveInfo.serviceInfo.packageName == packageName) {
                              return true
                          }
                      }
                  } catch (e: Exception) {}
                  return AutoClickAccessibilityService.instance != null
              }

              private fun updatePermissionStatus() {
                  val isA11y = isAccessibilityServiceEnabled()
                  if (isA11y) {
                      txtAccessibilityStatus.text = "Aksesibilitas: 🟢 AKTIF (Siap Klik Otomatis)"
                      txtAccessibilityStatus.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtAccessibilityStatus.text = "Aksesibilitas: 🔴 NONAKTIF (Harap Aktifkan)"
                      txtAccessibilityStatus.setTextColor(Color.parseColor("#EF4444"))
                  }

                  val isOverlay = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else {
                      true
                  }
                  if (isOverlay) {
                      txtOverlayStatus.text = "Jendela Mengapung: 🟢 SUDAH DIIZINKAN"
                      txtOverlayStatus.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtOverlayStatus.text = "Jendela Mengapung: 🔴 BELUM DIIZINKAN (Wajib)"
                      txtOverlayStatus.setTextColor(Color.parseColor("#EF4444"))
                  }
              }
