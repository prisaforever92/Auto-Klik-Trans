name: Build Android AutoKlik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoKlik Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate Android Scaffolding & Fix Resources
        run: |
          # 1. Enable AndroidX in gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoKlik"
          include ':app'
          EOF

          # 3. build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
          }
          EOF

          # 4. Strings & Themes
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AutoKlik Trans</string>
              <string name="accessibility_desc">Layanan Aksesibilitas AutoKlik untuk simulasi sentuhan dan multi-gesture tanpa root.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:windowBackground">#0F172A</item>
              </style>
          </resources>
          EOF

          # 5. Accessibility Service Config XML
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          # 6. Icons & Vector Drawables & Shape Target Point
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#E60F172A" />
              <stroke android:width="3dp" android:color="#10B981" />
          </shape>
          EOF

          # 7. Layouts: layout_target_point.xml, layout_point_dialog.xml, layout_floating_widget.xml & activity_main.xml
          mkdir -p app/src/main/res/layout

          # Bulatan Titik Target dengan Nomor dan Badge Tipe (Fitur 13 & 14)
          cat << 'EOF' > app/src/main/res/layout/layout_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="52dp"
              android:layout_height="52dp"
              android:background="@drawable/bg_target_point">

              <TextView
                  android:id="@+id/tvTargetNumber"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="1"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvTargetType"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom|center_horizontal"
                  android:layout_marginBottom="2dp"
                  android:text="🎯"
                  android:textSize="10sp" />

              <View
                  android:layout_width="4dp"
                  android:layout_height="4dp"
                  android:layout_gravity="center"
                  android:background="#EF4444" />
          </FrameLayout>
          EOF

          # Pop-up Dialog Pengaturan Khusus Per-Titik di Layar (Fitur 14)
          cat << 'EOF' > app/src/main/res/layout/layout_point_dialog.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="290dp"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="#FA0F172A"
              android:padding="16dp">

              <TextView
                  android:id="@+id/tvDialogTitle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Pengaturan Titik #1"
                  android:textColor="#10B981"
                  android:textSize="16sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="Pilih Tipe Gerakan:"
                  android:textColor="#CBD5E1"
                  android:textSize="12sp"
                  android:textStyle="bold" />

              <!-- RadioGroup Tipe: Tap, Swipe Up, Swipe Down, Paste (Fitur 13 & 14) -->
              <RadioGroup
                  android:id="@+id/rgPointType"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp">

                  <RadioButton
                      android:id="@+id/rbTypeTap"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="🎯 Tap (Sentuh Biasa)"
                      android:textColor="#F8FAFC"
                      android:textSize="13sp"
                      android:checked="true" />

                  <RadioButton
                      android:id="@+id/rbTypeSwipeUp"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="👆 Swipe Up (Usap ke Atas)"
                      android:textColor="#F8FAFC"
                      android:textSize="13sp" />

                  <RadioButton
                      android:id="@+id/rbTypeSwipeDown"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="👇 Swipe Down (Usap ke Bawah)"
                      android:textColor="#F8FAFC"
                      android:textSize="13sp" />

                  <RadioButton
                      android:id="@+id/rbTypePaste"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📋 Paste (Tempel Teks)"
                      android:textColor="#F8FAFC"
                      android:textSize="13sp" />
              </RadioGroup>

              <!-- Jeda Titik -->
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Jeda Setelah Titik Ini (ms):"
                  android:textColor="#CBD5E1"
                  android:textSize="12sp" />

              <EditText
                  android:id="@+id/etDialogDelay"
                  android:layout_width="match_parent"
                  android:layout_height="40dp"
                  android:layout_marginTop="2dp"
                  android:background="#1E293B"
                  android:inputType="number"
                  android:padding="6dp"
                  android:text="500"
                  android:textColor="#10B981"
                  android:textSize="13sp" />

              <!-- Teks Paste Khusus Titik Ini -->
              <LinearLayout
                  android:id="@+id/layoutDialogPasteFields"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:visibility="gone">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="Teks Khusus untuk Ditempel:"
                      android:textColor="#CBD5E1"
                      android:textSize="12sp" />

                  <EditText
                      android:id="@+id/etDialogPasteText"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:layout_marginTop="2dp"
                      android:background="#1E293B"
                      android:hint="Ketik teks pesan..."
                      android:padding="6dp"
                      android:textColor="#F8FAFC"
                      android:textColorHint="#64748B"
                      android:textSize="13sp" />

                  <CheckBox
                      android:id="@+id/cbDialogAutoTap"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="Auto-Tap fokus sebelum paste"
                      android:textColor="#CBD5E1"
                      android:textSize="11sp"
                      android:checked="true" />
              </LinearLayout>

              <!-- Tombol Aksi Dialog -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/btnDialogSave"
                      android:layout_width="0dp"
                      android:layout_height="40dp"
                      android:layout_weight="1"
                      android:backgroundTint="#10B981"
                      android:text="Simpan"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />

                  <Button
                      android:id="@+id/btnDialogClose"
                      android:layout_width="0dp"
                      android:layout_height="40dp"
                      android:layout_marginStart="6dp"
                      android:layout_weight="1"
                      android:backgroundTint="#475569"
                      android:text="Batal"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />
              </LinearLayout>

          </LinearLayout>
          EOF

          # Floating Toolbar Widget
          cat << 'EOF' > app/src/main/res/layout/layout_floating_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:background="#F00F172A"
              android:gravity="center_vertical"
              android:padding="6dp">

              <TextView
                  android:id="@+id/tvDragHandle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="⠿"
                  android:textColor="#94A3B8"
                  android:textSize="18sp"
                  android:paddingStart="4dp"
                  android:paddingEnd="6dp" />

              <Button
                  android:id="@+id/btnFloatingPlay"
                  android:layout_width="wrap_content"
                  android:layout_height="38dp"
                  android:text="▶ Mulai"
                  android:textSize="12sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#10B981"
                  android:minWidth="0dp"
                  android:paddingStart="10dp"
                  android:paddingEnd="10dp" />

              <Button
                  android:id="@+id/btnFloatingAdd"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="➕"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#0284C7"
                  android:minWidth="0dp"
                  android:padding="0dp" />

              <Button
                  android:id="@+id/btnFloatingRemove"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="➖"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#D97706"
                  android:minWidth="0dp"
                  android:padding="0dp" />

              <Button
                  android:id="@+id/btnFloatingSettings"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="⚙"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#7C3AED"
                  android:minWidth="0dp"
                  android:padding="0dp" />

              <Button
                  android:id="@+id/btnFloatingClose"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="✕"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#EF4444"
                  android:minWidth="0dp"
                  android:padding="0dp" />

          </LinearLayout>
          EOF

          # Layar Utama activity_main.xml dengan Manajemen Multi-Profil Skrip (Fitur 15)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <!-- Header -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="AutoKlik Trans"
                      android:textColor="#10B981"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:text="Pengontrol Klik Otomatis &amp; Multi-Touch"
                      android:textColor="#94A3B8"
                      android:textSize="13sp" />

                  <!-- FITUR 15: MANAJEMEN MULTI-PROFIL SKRIP (SAVE / LOAD) -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="📁 MANAJEMEN PROFIL SKRIP (Fitur 15)"
                          android:textColor="#38BDF8"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:text="Pilih atau simpan beberapa profil skrip berbeda:"
                          android:textColor="#94A3B8"
                          android:textSize="11sp" />

                      <!-- Dropdown Pilihan Profil -->
                      <Spinner
                          android:id="@+id/spProfiles"
                          android:layout_width="match_parent"
                          android:layout_height="44dp"
                          android:layout_marginTop="8dp"
                          android:background="#0F172A" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnLoadProfile"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_weight="1"
                              android:backgroundTint="#0284C7"
                              android:text="📂 Muat Skrip"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp" />

                          <Button
                              android:id="@+id/btnDeleteProfile"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:backgroundTint="#DC2626"
                              android:text="🗑️ Hapus"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:layout_marginTop="10dp"
                          android:layout_marginBottom="10dp"
                          android:background="#334155" />

                      <!-- Simpan Sebagai Profil Baru -->
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Simpan Sebagai Profil Baru:"
                          android:textColor="#CBD5E1"
                          android:textSize="11sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:orientation="horizontal">

                          <EditText
                              android:id="@+id/etNewProfileName"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_weight="2"
                              android:background="#0F172A"
                              android:hint="Nama Profil (misal: Game A)"
                              android:padding="6dp"
                              android:textColor="#F8FAFC"
                              android:textColorHint="#64748B"
                              android:textSize="12sp" />

                          <Button
                              android:id="@+id/btnSaveNewProfile"
                              android:layout_width="0dp"
                              android:layout_height="40dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:backgroundTint="#10B981"
                              android:text="💾 Simpan"
                              android:textColor="#FFFFFF"
                              android:textSize="12sp" />
                      </LinearLayout>

                  </LinearLayout>

                  <!-- Status Aksesibilitas & Overlay -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Status Perizinan Sistem"
                          android:textColor="#F8FAFC"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtAccessibilityStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Aksesibilitas: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtOverlayStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:text="Jendela Mengapung: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnAccessibility"
                              android:layout_width="0dp"
                              android:layout_height="38dp"
                              android:layout_weight="1"
                              android:backgroundTint="#334155"
                              android:text="⚙️ Aksesibilitas"
                              android:textColor="#F8FAFC"
                              android:textSize="11sp" />

                          <Button
                              android:id="@+id/btnOverlay"
                              android:layout_width="0dp"
                              android:layout_height="38dp"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:backgroundTint="#334155"
                              android:text="🔓 Izin Overlay"
                              android:textColor="#F8FAFC"
                              android:textSize="11sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Tombol Luncurkan Panel Melayang -->
                  <Button
                      android:id="@+id/btnStartFloating"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginTop="14dp"
                      android:backgroundTint="#10B981"
                      android:text="▶ TAMPILKAN PANEL MELAYANG"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <!-- FORM PENGATURAN PARAMETER SKRIP -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="PARAMETER SKRIP &amp; GESTUR"
                      android:textColor="#10B981"
                      android:textSize="13sp"
                      android:textStyle="bold" />

                  <!-- Fitur 7: Sub-Loop Jumpback -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <CheckBox
                          android:id="@+id/cbSubLoop"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Sub-Loop Jumpback (Titik 10 ➔ 7)"
                          android:textColor="#F8FAFC"
                          android:textStyle="bold"
                          android:checked="true" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Dari Titik Akhir: "
                              android:textColor="#CBD5E1"
                              android:textSize="12sp" />

                          <EditText
                              android:id="@+id/etSubLoopEnd"
                              android:layout_width="50dp"
                              android:layout_height="36dp"
                              android:background="#0F172A"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="10"
                              android:textColor="#10B981"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="10dp"
                              android:text="Ke Titik Awal: "
                              android:textColor="#CBD5E1"
                              android:textSize="12sp" />

                          <EditText
                              android:id="@+id/etSubLoopStart"
                              android:layout_width="50dp"
                              android:layout_height="36dp"
                              android:background="#0F172A"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="7"
                              android:textColor="#10B981"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Fitur 8: Anti-Deteksi Jeda Acak -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <CheckBox
                          android:id="@+id/cbJitter"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Anti-Deteksi: Jeda Acak (Jitter +/- 15%)"
                          android:textColor="#F8FAFC"
                          android:textStyle="bold"
                          android:checked="true" />
                  </LinearLayout>

                  <!-- Fitur 9 & 10: Auto-Paste & Auto-Tap -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Teks Default Auto-Paste:"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <EditText
                          android:id="@+id/etPasteText"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:layout_marginTop="4dp"
                          android:background="#0F172A"
                          android:padding="6dp"
                          android:text="AutoKlik Trans"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp" />

                      <CheckBox
                          android:id="@+id/cbAutoTapPaste"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Auto-Tap Fokus sebelum Paste"
                          android:textColor="#CBD5E1"
                          android:checked="true" />
                  </LinearLayout>

                  <!-- Waktu & Durasi Sentuh -->
                  <LinearLayout
