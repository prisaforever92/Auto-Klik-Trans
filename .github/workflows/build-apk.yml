                      setTextColor(Color.WHITE)
                      backgroundTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#059669"))
                      layoutParams = LinearLayout.LayoutParams(0, (38 * density).toInt(), 1f).apply {
                          marginEnd = (6 * density).toInt()
                      }
                      setOnClickListener {
                          showSaveConfigDialog()
                      }
                  }

                  val btnCloseLoad = Button(this).apply {
                      text = "✕ Tutup"
                      textSize = 11.5f
                      setTextColor(Color.WHITE)
                      backgroundTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#475569"))
                      layoutParams = LinearLayout.LayoutParams(0, (38 * density).toInt(), 1f)
                      setOnClickListener {
                          closeConfigDialog()
                      }
                  }

                  bottomRow.addView(btnGoSave)
                  bottomRow.addView(btnCloseLoad)
