              @RequiresApi(Build.VERSION_CODES.TIRAMISU)
              private suspend fun awaitAccessibilityInputConnection(maxWaitMs: Long = 320L): InputMethod.AccessibilityInputConnection? {
                  var elapsed = 0L
                  while (elapsed <= maxWaitMs) {
                      val ic = try {
                          inputMethod?.currentInputConnection
                      } catch (e: Exception) {
                          null
                      }
                      if (ic != null) return ic
                      delay(25L)
                      elapsed += 25L
                  }
                  return null
              }

              @RequiresApi(Build.VERSION_CODES.TIRAMISU)
              private fun sendSingleKeyCode(ic: InputMethod.AccessibilityInputConnection, keyCode: Int) {
                  val now = SystemClock.uptimeMillis()
                  ic.sendKeyEvent(KeyEvent(now, now, KeyEvent.ACTION_DOWN, keyCode, 0))
                  ic.sendKeyEvent(KeyEvent(now, now + 4L, KeyEvent.ACTION_UP, keyCode, 0))
              }

              private fun readNodeOrInputText(node: AccessibilityNodeInfo?): String {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      try {
                          val ic = inputMethod?.currentInputConnection
                          val sur = ic?.getSurroundingText(256, 256, 0)
                          val surTxt = sur?.text?.toString()
                          if (surTxt != null) return surTxt
                      } catch (e: Exception) {}
                  }
                  return try {
                      node?.refresh()
                      node?.text?.toString() ?: ""
                  } catch (e: Exception) {
                      ""
                  }
              }

              private suspend fun clearInputViaKeyboardOrNode(targetNode: AccessibilityNodeInfo?) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      val ic = awaitAccessibilityInputConnection(180L)
                      if (ic != null) {
                          try {
                              // 1. Select All + Backspace asli (memicu keydown/input/change React/Chromium)
                              ic.performContextMenuAction(android.R.id.selectAll)
                              delay(18L)
                              sendSingleKeyCode(ic, KeyEvent.KEYCODE_DEL)
                              delay(25L)

                              var remaining = readNodeOrInputText(targetNode)
                              if (remaining.isNotEmpty()) {
                                  ic.deleteSurroundingText(256, 256)
                                  delay(20L)
                                  remaining = readNodeOrInputText(targetNode)
                              }
                              if (remaining.isNotEmpty()) {
                                  sendSingleKeyCode(ic, KeyEvent.KEYCODE_MOVE_END)
                                  delay(10L)
                                  val maxBackspaces = (remaining.length + 2).coerceIn(1, 64)
                                  repeat(maxBackspaces) {
                                      sendSingleKeyCode(ic, KeyEvent.KEYCODE_DEL)
                                      delay(8L)
                                  }
                              }
                              return
                          } catch (e: Exception) {}
                      }
                  }

                  // Fallback Android <= 12 atau bila InputConnection belum terhubung (TANPA ACTION_CLICK ganda agar tidak memicu Autofill ulang!)
                  if (targetNode != null) {
                      try {
                          targetNode.refresh()
                          val curLen = targetNode.text?.length ?: 0
                          if (curLen > 0) {
                              val selAllArgs = Bundle().apply {
                                  putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_START_INT, 0)
                                  putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_END_INT, curLen)
                              }
                              targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_SELECTION, selAllArgs)
                              delay(20L)
                              val cutOk = targetNode.performAction(AccessibilityNodeInfo.ACTION_CUT)
                              delay(20L)
                              targetNode.refresh()
                              if (!cutOk || !targetNode.text.isNullOrEmpty()) {
                                  val clearArgs = Bundle().apply {
                                      putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, "")
                                  }
                                  targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, clearArgs)
                                  delay(25L)
                              }
                          }
                      } catch (e: Exception) {}
                  }
              }

              private suspend fun typeTextViaKeyboardOrNode(
                  text: String,
                  targetNode: AccessibilityNodeInfo?,
                  charDelayMs: Long = 16L
              ) {
                  if (text.isEmpty()) return

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      val ic = awaitAccessibilityInputConnection(250L)
                      if (ic != null) {
                          try {
                              val kcm = KeyCharacterMap.load(KeyCharacterMap.VIRTUAL_KEYBOARD)
                              for (idx in text.indices) {
                                  val ch = text[idx]
                                  val events = kcm.getEvents(charArrayOf(ch))
                                  if (events != null && events.isNotEmpty()) {
                                      val now = SystemClock.uptimeMillis()
                                      for (ev in events) {
                                          val stamped = KeyEvent(
                                              now,
                                              now,
                                              ev.action,
                                              ev.keyCode,
                                              ev.repeatCount,
                                              ev.metaState
                                          )
                                          ic.sendKeyEvent(stamped)
                                      }
                                  } else {
                                      ic.commitText(ch.toString(), 1, null)
                                  }
                                  if (charDelayMs > 0L && idx < text.length - 1) {
                                      delay(charDelayMs)
                                  }
                              }
                              return
                          } catch (e: Exception) {}
                      }
                  }

                  // Fallback Android <= 12: Paste via Clipboard (tanpa ACTION_CLICK ganda)
                  try {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = ClipData.newPlainText("AutoKlikInput", text)
                      clipboard.setPrimaryClip(clip)

                      val node = targetNode ?: findEditableNodeInRadius(rootInActiveWindow, 0, 0, 80f)
                      if (node != null) {
                          node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                          delay(25L)
                          node.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                          delay(45L)
                          node.refresh()
                          val nowText = node.text?.toString() ?: ""
                          if (nowText != text) {
                              val setArgs = Bundle().apply {
                                  putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                              }
                              node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, setArgs)
                              delay(30L)
                          }
                          val selArgs = Bundle().apply {
                              putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_START_INT, text.length)
                              putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_END_INT, text.length)
                          }
                          node.performAction(AccessibilityNodeInfo.ACTION_SET_SELECTION, selArgs)
                      }
                  } catch (e: Exception) {}
              }

              // FITUR TERPADU: INPUT KETIK + PEMICU AUTOFILL (TANPA TITIK KEYBOARD A-Z + SUPPORT HIDE KEYBOARD ANDROID 13+)
              // Alur:
              // 1. Klik Kolom Form (bila autoTapToFocus)
              // 2. [Bila Pemicu Aktif] Bersihkan isi lama -> Ketik Huruf/Angka Awal (atau pemicu khusus) via KeyEvent asli
              // 3. [Bila Pemicu Aktif] Tunggu saran Autofill muncul -> Raw Tap tepat ke Pin Ungu (✨ AUTO)
              // 4. Tunggu autofill isi kolom lain -> Hapus teks pemicu sampai bersih
              // 5. Ketik Kata Lengkap via KeyEvent asli + Verifikasi Anti-Revert
              @RequiresApi(Build.VERSION_CODES.N)
              fun executeInputWithTrigger(
                  formX: Float,
                  formY: Float,
                  textToType: String,
                  autoTapToFocus: Boolean = true,
                  triggerEnabled: Boolean = false,
                  triggerOverride: String = "",
                  pinX: Float = -1f,
                  pinY: Float = -1f,
                  triggerWaitMs: Long = 450L,
                  autofillWaitMs: Long = 300L,
                  hideKeyboard: Boolean = false,
                  radiusPx: Float = 0f,
                  callback: (() -> Unit)? = null
              ) {
                  if (!LicenseManager.isLicensed(this)) {
                      callback?.invoke()
                      return
                  }
                  val session = activeSessionId.get()
                  val completed = AtomicBoolean(false)
                  val finishOnce = {
                      if (completed.compareAndSet(false, true)) {
                          callback?.invoke()
                      }
                  }

                  activeInputJob?.cancel()
                  activeInputJob = serviceScope.launch {
                      try {
                          if (activeSessionId.get() != session) return@launch
                          setKeyboardHiddenForTyping(hideKeyboard)

                          // Langkah 1: Klik Kolom Form agar fokus & InputConnection aktif
