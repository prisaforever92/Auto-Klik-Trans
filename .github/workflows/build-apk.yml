package com.autoklik.android.service

import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.Service
import android.content.Context
import android.content.Intent
import android.graphics.PixelFormat
import android.os.Build
import android.os.IBinder
import android.view.Gravity
import android.view.LayoutInflater
import android.view.MotionEvent
import android.view.View
import android.view.WindowManager
import android.widget.*
import androidx.core.app.NotificationCompat
import com.autoklik.android.R
import com.autoklik.android.ui.MainActivity
import kotlinx.coroutines.*
import org.json.JSONArray
import org.json.JSONObject
import kotlin.random.Random

class FloatingOverlayService : Service() {

    // Model Titik Lengkap
    data class TargetPoint(
        val order: Int,
        val view: View,
        val params: WindowManager.LayoutParams,
        var type: String = "tap", // "tap", "swipe_up", "swipe_down", "paste"
        var delayValue: Double = 500.0,
        var delayUnit: String = "ms", // "ms" atau "s"
        var delayMs: Long = 500L,
        var durationMs: Long = 50L,
        var swipeDistancePx: Float = 450f, // Panjang garis/panah swipe (px)
        var jumpEnabled: Boolean = false,   // Sub-Loop pada titik
        var jumpToPoint: Int = 7,
        var jumpAfterCycle: Int = 1,
        var pasteText: String = "",
        var autoTapPaste: Boolean = true
    )

    private lateinit var windowManager: WindowManager
    private var floatingContainer: View? = null
    private lateinit var containerParams: WindowManager.LayoutParams
    private val targetPoints = mutableListOf<TargetPoint>()

    // Sub-views toolbar
    private var layoutFullToolbar: View? = null
    private var layoutMiniToolbar: View? = null

    // Dialog Pop-up Per-Titik
    private var currentDialogView: View? = null
    private var currentDialogParams: WindowManager.LayoutParams? = null

    // Dialog Ukuran (0 - 100% / 20dp - 40dp)
    private var currentSizeDialogView: View? = null
    private var currentSizeDialogParams: WindowManager.LayoutParams? = null

    // Status Minimize / Hide Titik
    private var arePointsVisible = true

    // FITUR 2: Ukuran Titik Persentase (0% = 20dp, 100% = 40dp)
    private var currentSizePercent = 50 // default 50% = 30dp

    private var isPlaying = false
    private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
    private var clickJob: Job? = null

    override fun onBind(intent: Intent?): IBinder? = null

    override fun onCreate() {
        super.onCreate()
        windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
        loadSavedSizePercent()
        startForegroundNotification()
        setupFloatingToolbar()
    }

    private fun loadSavedSizePercent() {
        val prefs = getSharedPreferences("autoklik_saved_config", Context.MODE_PRIVATE)
        currentSizePercent = prefs.getInt("size_percent", 50)
    }

    private fun getTargetSizeDp(): Int {
        // Linear: 0% = 20dp, 100% = 40dp
        return 20 + (currentSizePercent * (40 - 20) / 100)
    }

    private fun startForegroundNotification() {
        val channelId = "autoklik_overlay_channel"
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val channel = NotificationChannel(
                channelId,
                "AutoKlik Overlay Service",
                NotificationManager.IMPORTANCE_LOW
            )
            val manager = getSystemService(NotificationManager::class.java)
            manager?.createNotificationChannel(channel)
        }

        val notification: Notification = NotificationCompat.Builder(this, channelId)
            .setContentTitle("AutoKlik Aktif")
            .setContentText("Panel melayang siap digunakan")
            .setSmallIcon(android.R.drawable.ic_dialog_info)
            .build()

        startForeground(1001, notification)
    }

    private fun setupFloatingToolbar() {
        val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
        } else {
            @Suppress("DEPRECATION")
            WindowManager.LayoutParams.TYPE_PHONE
        }

        containerParams = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            layoutType,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.TOP or Gravity.START
            x = 30
            y = 180
        }

        floatingContainer = LayoutInflater.from(this).inflate(R.layout.layout_floating_widget, null)

        layoutFullToolbar = floatingContainer?.findViewById(R.id.layoutFullToolbar)
        layoutMiniToolbar = floatingContainer?.findViewById(R.id.layoutMiniToolbar)

        val btnPlay = floatingContainer?.findViewById<Button>(R.id.btnFloatingPlay)
        val btnAdd = floatingContainer?.findViewById<Button>(R.id.btnFloatingAdd)
        val btnRemove = floatingContainer?.findViewById<Button>(R.id.btnFloatingRemove)
        val btnVisibility = floatingContainer?.findViewById<Button>(R.id.btnFloatingVisibility)
        val btnSize = floatingContainer?.findViewById<Button>(R.id.btnFloatingSize)
        val btnSave = floatingContainer?.findViewById<Button>(R.id.btnFloatingSave)
        val btnSettings = floatingContainer?.findViewById<Button>(R.id.btnFloatingSettings)
        val btnClose = floatingContainer?.findViewById<Button>(R.id.btnFloatingClose)

        val btnMiniStop = floatingContainer?.findViewById<Button>(R.id.btnFloatingMiniStop)

        // ➕ Tambah Titik
        btnAdd?.setOnClickListener {
            addTargetPoint()
        }

        // ➖ Hapus Titik Terakhir
        btnRemove?.setOnClickListener {
            removeLastTargetPoint()
        }

        // 👁️ Minimize / Sembunyikan Titik Target
        btnVisibility?.setOnClickListener {
            arePointsVisible = !arePointsVisible
            for (p in targetPoints) {
                p.view.visibility = if (arePointsVisible) View.VISIBLE else View.GONE
            }
            btnVisibility.text = if (arePointsVisible) "👁️" else "🙈"
            Toast.makeText(this, if (arePointsVisible) "Titik target ditampilkan" else "Titik target disembunyikan (Minimize)", Toast.LENGTH_SHORT).show()
        }

        // 📐 FITUR 2: Dialog Ukuran Persentase 0-100% (20dp-40dp)
        btnSize?.setOnClickListener {
            showSizeDialog()
        }

        // 💾 FITUR 3: Simpan Konfigurasi pada Panel Melayang
        btnSave?.setOnClickListener {
            saveCurrentConfiguration()
        }

        // ⚙️ Pengaturan
        btnSettings?.setOnClickListener {
            val intent = Intent(this, MainActivity::class.java).apply {
                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            }
            startActivity(intent)
        }

        // ▶ Mulai Eksekusi (Panel mengecil otomatis menjadi tombol Stop)
        btnPlay?.setOnClickListener {
            val a11y = AutoClickAccessibilityService.instance
            if (a11y == null) {
                Toast.makeText(this, "Layanan Aksesibilitas belum aktif!", Toast.LENGTH_SHORT).show()
                return@setOnClickListener
            }

            if (targetPoints.isEmpty()) {
                Toast.makeText(this, "Tekan tombol ➕ untuk menambah titik target!", Toast.LENGTH_LONG).show()
                return@setOnClickListener
            }

            isPlaying = true
            layoutFullToolbar?.visibility = View.GONE
            layoutMiniToolbar?.visibility = View.VISIBLE
            windowManager.updateViewLayout(floatingContainer, containerParams)

            startClickExecution(a11y)
        }

        // ⏹ Tombol Stop pada Panel Kecil
        btnMiniStop?.setOnClickListener {
            stopClickExecution()
        }

        // ✕ Tutup Toolbar
        btnClose?.setOnClickListener {
            stopSelf()
        }

        // Drag & Drop Floating Toolbar
        val dragTouchListener = object : View.OnTouchListener {
            private var initialX = 0
            private var initialY = 0
            private var initialTouchX = 0f
            private var initialTouchY = 0f

            override fun onTouch(v: View, event: MotionEvent): Boolean {
                when (event.action) {
                    MotionEvent.ACTION_DOWN -> {
                        initialX = containerParams.x
                        initialY = containerParams.y
                        initialTouchX = event.rawX
                        initialTouchY = event.rawY
                        return true
                    }
                    MotionEvent.ACTION_MOVE -> {
                        containerParams.x = initialX + (event.rawX - initialTouchX).toInt()
                        containerParams.y = initialY + (event.rawY - initialTouchY).toInt()
                        windowManager.updateViewLayout(floatingContainer, containerParams)
                        return true
                    }
                }
                return false
            }
        }

        floatingContainer?.findViewById<View>(R.id.tvDragHandle)?.setOnTouchListener(dragTouchListener)
        floatingContainer?.findViewById<View>(R.id.tvMiniDragHandle)?.setOnTouchListener(dragTouchListener)

        windowManager.addView(floatingContainer, containerParams)
    }

    // FITUR 3: LOGIKA SIMPAN KONFIGURASI DARI PANEL MELAYANG
    private fun saveCurrentConfiguration() {
        if (targetPoints.isEmpty()) {
            Toast.makeText(this, "Tambahkan titik target terlebih dahulu!", Toast.LENGTH_SHORT).show()
            return
        }

        try {
            val configArray = JSONArray()
            for (p in targetPoints) {
                val obj = JSONObject().apply {
                    put("order", p.order)
                    put("x", p.params.x)
                    put("y", p.params.y)
                    put("type", p.type)
                    put("delayValue", p.delayValue)
                    put("delayUnit", p.delayUnit)
                    put("delayMs", p.delayMs)
                    put("swipeDistancePx", p.swipeDistancePx.toDouble())
                    put("jumpEnabled", p.jumpEnabled)
                    put("jumpToPoint", p.jumpToPoint)
                    put("jumpAfterCycle", p.jumpAfterCycle)
                    put("pasteText", p.pasteText)
                    put("autoTapPaste", p.autoTapPaste)
                }
                configArray.put(obj)
            }

            val prefs = getSharedPreferences("autoklik_saved_config", Context.MODE_PRIVATE).edit()
            prefs.putString("saved_points_json", configArray.toString())
            prefs.putInt("size_percent", currentSizePercent)
            prefs.apply()

            Toast.makeText(this, "💾 Konfigurasi (${targetPoints.size} titik) berhasil disimpan!", Toast.LENGTH_LONG).show()
        } catch (e: Exception) {
            Toast.makeText(this, "Gagal menyimpan: ${e.message}", Toast.LENGTH_SHORT).show()
        }
    }

    // FITUR 2: DIALOG UKURAN PERSENTASE 0-100% (20dp - 40dp)
    private fun showSizeDialog() {
        closeSizeDialog()

        val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
        } else {
            @Suppress("DEPRECATION")
            WindowManager.LayoutParams.TYPE_PHONE
        }

        currentSizeDialogParams = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            layoutType,
            WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.CENTER
        }

        val dialogView = LayoutInflater.from(this).inflate(R.layout.layout_size_dialog, null)
        val tvTitle = dialogView.findViewById<TextView>(R.id.tvSizeDialogTitle)
        val sbPercent = dialogView.findViewById<SeekBar>(R.id.sbSizePercent)

        val btn0 = dialogView.findViewById<Button>(R.id.btnSize0)
        val btn25 = dialogView.findViewById<Button>(R.id.btnSize25)
        val btn50 = dialogView.findViewById<Button>(R.id.btnSize50)
        val btn75 = dialogView.findViewById<Button>(R.id.btnSize75)
        val btn100 = dialogView.findViewById<Button>(R.id.btnSize100)
        val btnClose = dialogView.findViewById<Button>(R.id.btnSizeClose)

        sbPercent.progress = currentSizePercent
        tvTitle.text = "Ukuran Titik: $currentSizePercent% (${getTargetSizeDp()}dp)"

        fun applySize(percent: Int) {
            currentSizePercent = percent.coerceIn(0, 100)
            sbPercent.progress = currentSizePercent
            tvTitle.text = "Ukuran Titik: $currentSizePercent% (${getTargetSizeDp()}dp)"
            updateAllPointsVisuals()

            // Simpan preferensi
            val prefs = getSharedPreferences("autoklik_saved_config", Context.MODE_PRIVATE).edit()
            prefs.putInt("size_percent", currentSizePercent)
            prefs.apply()
        }

        sbPercent.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
            override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                if (fromUser) {
                    applySize(progress)
                }
            }
            override fun onStartTrackingTouch(seekBar: SeekBar?) {}
            override fun onStopTrackingTouch(seekBar: SeekBar?) {}
        })

        btn0?.setOnClickListener { applySize(0) }
        btn25?.setOnClickListener { applySize(25) }
        btn50?.setOnClickListener { applySize(50) }
        btn75?.setOnClickListener { applySize(75) }
        btn100?.setOnClickListener { applySize(100) }

        btnClose?.setOnClickListener {
            closeSizeDialog()
        }

        windowManager.addView(dialogView, currentSizeDialogParams)
        currentSizeDialogView = dialogView
    }

    private fun closeSizeDialog() {
        if (currentSizeDialogView != null) {
            try {
                windowManager.removeView(currentSizeDialogView)
            } catch (e: Exception) {}
            currentSizeDialogView = null
            currentSizeDialogParams = null
        }
    }

    // MENAMBAH TITIK TARGET DENGAN GARIS PANAH SWIPE
    private fun addTargetPoint() {
        val nextOrder = targetPoints.size + 1
        val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
        } else {
            @Suppress("DEPRECATION")
            WindowManager.LayoutParams.TYPE_PHONE
        }

        val pointParams = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            layoutType,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.TOP or Gravity.START
            x = 120 + ((nextOrder - 1) % 4) * 110
            y = 350 + ((nextOrder - 1) / 4) * 120
        }

        val pointView = LayoutInflater.from(this).inflate(R.layout.layout_target_point, null)
        val tvNumber = pointView.findViewById<TextView>(R.id.tvTargetNumber)
        val tvType = pointView.findViewById<TextView>(R.id.tvTargetType)
        tvNumber.text = nextOrder.toString()
        tvType.text = "🎯"

        val isTen = nextOrder == 10
        val targetPoint = TargetPoint(
            order = nextOrder,
            view = pointView,
            params = pointParams,
            jumpEnabled = isTen,
            jumpToPoint = 7,
            jumpAfterCycle = 1
        )

        if (isTen) {
            tvType.text = "🔁7"
        }

        // Drag & Drop dan Klik untuk Dialog Pengaturan
        pointView.setOnTouchListener(object : View.OnTouchListener {
            private var initialX = 0
            private var initialY = 0
            private var initialTouchX = 0f
            private var initialTouchY = 0f
            private var touchStartTime = 0L

            override fun onTouch(v: View, event: MotionEvent): Boolean {
                when (event.action) {
                    MotionEvent.ACTION_DOWN -> {
                        initialX = pointParams.x
                        initialY = pointParams.y
                        initialTouchX = event.rawX
                        initialTouchY = event.rawY
                        touchStartTime = System.currentTimeMillis()
                        return true
                    }
                    MotionEvent.ACTION_MOVE -> {
                        val deltaX = (event.rawX - initialTouchX).toInt()
                        val deltaY = (event.rawY - initialTouchY).toInt()
                        pointParams.x = initialX + deltaX
                        pointParams.y = initialY + deltaY
                        windowManager.updateViewLayout(pointView, pointParams)
                        return true
                    }
                    MotionEvent.ACTION_UP -> {
                        val diffTime = System.currentTimeMillis() - touchStartTime
                        val moved = Math.abs(event.rawX - initialTouchX) > 12 || Math.abs(event.rawY - initialTouchY) > 12
                        if (!moved && diffTime < 350) {
                            showPointSettingsDialog(targetPoint)
                        }
                        return true
                    }
                }
                return false
            }
        })

        windowManager.addView(pointView, pointParams)
        targetPoints.add(targetPoint)
        updatePointVisual(targetPoint)
        Toast.makeText(this, "Titik $nextOrder ditambah! (Ketuk untuk opsi Swipe Panah & Jeda)", Toast.LENGTH_SHORT).show()
    }

    // MEMPERBARUI TAMPILAN VISUAL TITIK (UKURAN & GARIS PANAH SWIPE)
    private fun updatePointVisual(point: TargetPoint) {
        val density = resources.displayMetrics.density
        val sizeDp = getTargetSizeDp()
        val sizePx = (sizeDp * density).toInt()

        val pointRoot = point.view.findViewById<View>(R.id.pointRoot)
        val tvNumber = point.view.findViewById<TextView>(R.id.tvTargetNumber)
        val tvType = point.view.findViewById<TextView>(R.id.tvTargetType)

        val layoutArrowUp = point.view.findViewById<View>(R.id.layoutArrowUp)
        val viewLineUp = point.view.findViewById<View>(R.id.viewLineUp)
        val tvSwipeDistUp = point.view.findViewById<TextView>(R.id.tvSwipeDistUp)

        val layoutArrowDown = point.view.findViewById<View>(R.id.layoutArrowDown)
        val viewLineDown = point.view.findViewById<View>(R.id.viewLineDown)
        val tvSwipeDistDown = point.view.findViewById<TextView>(R.id.tvSwipeDistDown)

        // Atur ukuran bulatan lingkaran target (Bulat Sempurna 1:1)
        pointRoot.layoutParams.width = sizePx
        pointRoot.layoutParams.height = sizePx
        pointRoot.requestLayout()

        // Sesuaikan ukuran font nomor dengan ukuran bulatan
        tvNumber.textSize = (sizeDp * 0.45f).coerceIn(9f, 17f)

        // FITUR 1: PANJANG GARIS PANAH SWIPE SESUAI DISTANCE
        val arrowLineHeightDp = (point.swipeDistancePx / 4.0f).coerceIn(30f, 220f)
        val arrowLineHeightPx = (arrowLineHeightDp * density).toInt()

        when (point.type) {
            "swipe_up" -> {
                layoutArrowUp.visibility = View.VISIBLE
                layoutArrowDown.visibility = View.GONE
                viewLineUp.layoutParams.height = arrowLineHeightPx
                viewLineUp.requestLayout()
                tvSwipeDistUp.text = "▲ ${point.swipeDistancePx.toInt()}px"
                tvType.text = "▲"
            }
            "swipe_down" -> {
                layoutArrowUp.visibility = View.GONE
                layoutArrowDown.visibility = View.VISIBLE
                viewLineDown.layoutParams.height = arrowLineHeightPx
                viewLineDown.requestLayout()
                tvSwipeDistDown.text = "▼ ${point.swipeDistancePx.toInt()}px"
                tvType.text = "▼"
            }
            "paste" -> {
                layoutArrowUp.visibility = View.GONE
                layoutArrowDown.visibility = View.GONE
                tvType.text = "📋"
            }
            else -> {
                layoutArrowUp.visibility = View.GONE
                layoutArrowDown.visibility = View.GONE
                tvType.text = if (point.jumpEnabled) "🔁${point.jumpToPoint}" else "🎯"
            }
        }

        if (point.jumpEnabled) {
            tvType.text = "🔁${point.jumpToPoint}"
        }

        try {
            windowManager.updateViewLayout(point.view, point.params)
        } catch (e: Exception) {}
    }

    private fun updateAllPointsVisuals() {
        for (p in targetPoints) {
            updatePointVisual(p)
        }
    }

    // DIALOG PENGATURAN PER-TITIK (KEYBOARD AKTIF, JEDA MS/S, GARIS SWIPE, SUB-LOOP)
    private fun showPointSettingsDialog(point: TargetPoint) {
        closePointSettingsDialog()

        val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
        } else {
            @Suppress("DEPRECATION")
            WindowManager.LayoutParams.TYPE_PHONE
        }

        val dialogParams = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            layoutType,
            WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.CENTER
            softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_PAN or WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE
        }

        val dialogView = LayoutInflater.from(this).inflate(R.layout.layout_point_dialog, null)
        val tvTitle = dialogView.findViewById<TextView>(R.id.tvDialogTitle)
        val rgType = dialogView.findViewById<RadioGroup>(R.id.rgPointType)
        val rbTap = dialogView.findViewById<RadioButton>(R.id.rbTypeTap)
        val rbSwipeUp = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeUp)
        val rbSwipeDown = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeDown)
        val rbPaste = dialogView.findViewById<RadioButton>(R.id.rbTypePaste)

        val layoutSwipe = dialogView.findViewById<LinearLayout>(R.id.layoutSwipeSettings)
        val etSwipeDistance = dialogView.findViewById<EditText>(R.id.etSwipeDistance)

        // FITUR 4: Jeda & Pilihan Unit ms / s
        val etDelay = dialogView.findViewById<EditText>(R.id.etDialogDelay)
        val rgDelayUnit = dialogView.findViewById<RadioGroup>(R.id.rgDelayUnit)
        val rbUnitMs = dialogView.findViewById<RadioButton>(R.id.rbUnitMs)
        val rbUnitSec = dialogView.findViewById<RadioButton>(R.id.rbUnitSec)

        val cbSubLoop = dialogView.findViewById<CheckBox>(R.id.cbPointSubLoop)
        val layoutSubLoop = dialogView.findViewById<LinearLayout>(R.id.layoutPointSubLoopFields)
        val etJumpTo = dialogView.findViewById<EditText>(R.id.etPointJumpTo)
        val etJumpCycle = dialogView.findViewById<EditText>(R.id.etPointJumpCycle)

        val layoutPaste = dialogView.findViewById<LinearLayout>(R.id.layoutDialogPasteFields)
        val etPasteText = dialogView.findViewById<EditText>(R.id.etDialogPasteText)
        val cbAutoTap = dialogView.findViewById<CheckBox>(R.id.cbDialogAutoTap)
        val btnSave = dialogView.findViewById<Button>(R.id.btnDialogSave)
        val btnClose = dialogView.findViewById<Button>(R.id.btnDialogClose)

        tvTitle.text = "Pengaturan Titik #${point.order}"

        // Set Jeda dan Unit (Fitur 4)
        if (point.delayUnit == "s") {
            rbUnitSec.isChecked = true
            etDelay.setText(point.delayValue.toString())
        } else {
            rbUnitMs.isChecked = true
            etDelay.setText(point.delayValue.toLong().toString())
        }

        etSwipeDistance.setText(point.swipeDistancePx.toInt().toString())

        // Sub-Loop state
        cbSubLoop.isChecked = point.jumpEnabled
        layoutSubLoop.visibility = if (point.jumpEnabled) View.VISIBLE else View.GONE
        etJumpTo.setText(point.jumpToPoint.toString())
        etJumpCycle.setText(point.jumpAfterCycle.toString())

        cbSubLoop.setOnCheckedChangeListener { _, isChecked ->
            layoutSubLoop.visibility = if (isChecked) View.VISIBLE else View.GONE
        }

        // Paste state
        etPasteText.setText(point.pasteText)
        cbAutoTap.isChecked = point.autoTapPaste

        // Type state
        when (point.type) {
            "swipe_up" -> {
                rbSwipeUp.isChecked = true
                layoutSwipe.visibility = View.VISIBLE
                layoutPaste.visibility = View.GONE
            }
            "swipe_down" -> {
                rbSwipeDown.isChecked = true
                layoutSwipe.visibility = View.VISIBLE
                layoutPaste.visibility = View.GONE
            }
            "paste" -> {
                rbPaste.isChecked = true
                layoutSwipe.visibility = View.GONE
                layoutPaste.visibility = View.VISIBLE
            }
            else -> {
                rbTap.isChecked = true
                layoutSwipe.visibility = View.GONE
                layoutPaste.visibility = View.GONE
            }
        }

        rgType.setOnCheckedChangeListener { _, checkedId ->
            layoutSwipe.visibility = if (checkedId == R.id.rbTypeSwipeUp || checkedId == R.id.rbTypeSwipeDown) View.VISIBLE else View.GONE
            layoutPaste.visibility = if (checkedId == R.id.rbTypePaste) View.VISIBLE else View.GONE
        }

        btnSave.setOnClickListener {
            point.type = when (rgType.checkedRadioButtonId) {
                R.id.rbTypeSwipeUp -> "swipe_up"
                R.id.rbTypeSwipeDown -> "swipe_down"
                R.id.rbTypePaste -> "paste"
                else -> "tap"
            }

            // Hitung Jeda sesuai unit (Fitur 4)
            val isSec = rgDelayUnit.checkedRadioButtonId == R.id.rbUnitSec
            val delayInputVal = etDelay.text.toString().toDoubleOrNull() ?: 500.0
            point.delayValue = delayInputVal
            point.delayUnit = if (isSec) "s" else "ms"
            point.delayMs = if (isSec) (delayInputVal * 1000.0).toLong().coerceAtLeast(50L) else delayInputVal.toLong().coerceAtLeast(50L)

            point.swipeDistancePx = etSwipeDistance.text.toString().toFloatOrNull() ?: 450f

            point.jumpEnabled = cbSubLoop.isChecked
            point.jumpToPoint = etJumpTo.text.toString().toIntOrNull() ?: 7
            point.jumpAfterCycle = etJumpCycle.text.toString().toIntOrNull() ?: 1

            point.pasteText = etPasteText.text.toString()
            point.autoTapPaste = cbAutoTap.isChecked

            updatePointVisual(point)
            closePointSettingsDialog()
            Toast.makeText(this, "Titik #${point.order} berhasil disimpan! ✔", Toast.LENGTH_SHORT).show()
        }

        btnClose.setOnClickListener {
            closePointSettingsDialog()
        }

        windowManager.addView(dialogView, dialogParams)
        currentDialogView = dialogView
        currentDialogParams = dialogParams
    }

    private fun closePointSettingsDialog() {
        if (currentDialogView != null) {
            try {
                windowManager.removeView(currentDialogView)
            } catch (e: Exception) {}
            currentDialogView = null
            currentDialogParams = null
        }
    }

    private fun removeLastTargetPoint() {
        if (targetPoints.isNotEmpty()) {
            val last = targetPoints.removeAt(targetPoints.size - 1)
            try {
                windowManager.removeView(last.view)
                Toast.makeText(this, "Titik ${last.order} dihapus", Toast.LENGTH_SHORT).show()
            } catch (e: Exception) {}
        } else {
            Toast.makeText(this, "Tidak ada titik untuk dihapus", Toast.LENGTH_SHORT).show()
        }
    }

    // EKSEKUSI DENGAN LOGIKA SWIPE JARAK PANAH & JEDA MS/DETIK
    private fun startClickExecution(service: AutoClickAccessibilityService) {
        clickJob?.cancel()
        clickJob = serviceScope.launch {
            val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE)
            val jitterEnabled = prefs.getBoolean("jitter_enabled", true)
            val defaultPaste = prefs.getString("paste_text", "AutoKlik Trans") ?: ""

            Toast.makeText(applicationContext, "AutoKlik Berjalan!", Toast.LENGTH_SHORT).show()

            var currentOrder = 1
            var cycle = 1

            while (isActive && isPlaying && targetPoints.isNotEmpty()) {
                val point = targetPoints.find { it.order == currentOrder } ?: targetPoints.firstOrNull()
                if (point != null) {
                    val density = resources.displayMetrics.density
                    val radiusPx = (getTargetSizeDp() * density) / 2f
                    val tapX = point.params.x + radiusPx
                    val tapY = point.params.y + radiusPx

                    // Eksekusi Gestur Sesuai Garis Panah Swipe
                    when (point.type) {
                        "swipe_up" -> {
                            val endY = (tapY - point.swipeDistancePx).coerceAtLeast(80f)
                            service.executeSwipe(tapX, tapY, tapX, endY, 350L)
                        }
                        "swipe_down" -> {
                            val endY = tapY + point.swipeDistancePx
                            service.executeSwipe(tapX, tapY, tapX, endY, 350L)
                        }
                        "paste" -> {
                            val text = if (point.pasteText.isNotBlank()) point.pasteText else defaultPaste
                            service.executePaste(tapX, tapY, text, point.autoTapPaste)
                        }
                        else -> {
                            service.executeTap(tapX, tapY, point.durationMs)
                        }
                    }

                    // Jeda acak (Anti-Deteksi) berdasarkan delayMs terhitung
                    var waitTime = point.delayMs
                    if (jitterEnabled) {
                        val jitterFactor = Random.nextInt(-15, 16) / 100f
                        waitTime = (waitTime * (1f + jitterFactor)).toLong().coerceAtLeast(50L)
                    }
                    delay(waitTime)

                    // LOGIKA SUB-LOOP PADA TITIK
                    if (point.jumpEnabled && cycle >= point.jumpAfterCycle && point.jumpToPoint <= targetPoints.size) {
                        currentOrder = point.jumpToPoint
                    } else if (currentOrder >= targetPoints.size) {
                        currentOrder = 1
                        cycle++
                    } else {
                        currentOrder++
                    }
                } else {
                    currentOrder = 1
                }
            }
        }
    }

    private fun stopClickExecution() {
        isPlaying = false
        clickJob?.cancel()
        clickJob = null

        layoutMiniToolbar?.visibility = View.GONE
        layoutFullToolbar?.visibility = View.VISIBLE
        if (floatingContainer != null) {
            try {
                windowManager.updateViewLayout(floatingContainer, containerParams)
            } catch (e: Exception) {}
        }

        Toast.makeText(applicationContext, "AutoKlik Dihentikan ⏹", Toast.LENGTH_SHORT).show()
    }

    override fun onDestroy() {
        super.onDestroy()
        stopClickExecution()
        serviceScope.cancel()
        closePointSettingsDialog()
        closeSizeDialog()

        for (point in targetPoints) {
            try {
                windowManager.removeView(point.view)
            } catch (e: Exception) {}
        }
        targetPoints.clear()

        if (floatingContainer != null) {
            try {
                windowManager.removeView(floatingContainer)
            } catch (e: Exception) {}
        }
    }
}
