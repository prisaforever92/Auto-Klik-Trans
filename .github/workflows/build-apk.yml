          package com.autoklik.android.security

          import android.content.Context
          import android.provider.Settings
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.ceil

          object LicenseManager {
              const val LOCK_ENABLED = true
              // SHA-256("AK_FIX_V1|DWI PRIO PURNOMO")
              private const val FIXED_CODE_HASH = "d02b98f2823de769b1dbffd68bcb22524b09e8b98b5bb4fd510fa1472c0736ed"
              const val FIXED_DURATION_DAYS = 30

              private const val PREFS_NAME = "autoklik_license_prefs"
              private const val KEY_DEVICE_BIND = "bound_device_id"
              private const val KEY_LICENSE_TOKEN = "bound_license_code"
              private const val KEY_FIXED_EXPIRES_AT = "fixed_expires_at_ms"
              private const val KEY_LAST_SEEN_MS = "last_seen_epoch_ms"
              private const val KEY_FAIL_COUNT = "failed_attempt_count"
              private const val KEY_LOCKOUT_UNTIL = "failed_lockout_until_ms"
              private const val KEY_FAIL_SIG = "failed_state_sig"

              private const val MAX_FAILED_ATTEMPTS = 5
              private const val LOCKOUT_DURATION_MS = 300_000L
              private const val DAY_MS = 86_400_000L
              private const val CLOCK_ROLLBACK_TOLERANCE_MS = 3_600_000L

              private fun getInternalHardwareBind(context: Context): String {
                  val androidId = try {
                      Settings.Secure.getString(context.contentResolver, Settings.Secure.ANDROID_ID) ?: "UNKNOWN"
                  } catch (e: Exception) {
                      "UNKNOWN"
                  }
                  return sha256Hex("AK_HW_BIND_V1:$androidId").substring(0, 16).uppercase(Locale.ROOT)
              }

              private fun sha256Hex(input: String): String {
                  val md = MessageDigest.getInstance("SHA-256")
                  val bytes = md.digest(input.toByteArray(Charsets.UTF_8))
                  val sb = StringBuilder(bytes.size * 2)
                  for (b in bytes) {
                      sb.append(String.format(Locale.ROOT, "%02x", b))
                  }
                  return sb.toString()
              }

              private fun computeFixedHash(normalizedCode: String): String {
                  return sha256Hex("AK_FIX_V1|$normalizedCode")
              }

              private fun computeFixedBindSig(hwBind: String, expiresAt: Long): String {
                  return sha256Hex("AK_FIX_BIND_V1|$FIXED_CODE_HASH|$hwBind|$expiresAt")
              }

              private fun computeFailSig(hwBind: String, count: Int, lockoutUntil: Long): String {
                  return sha256Hex("AK_FAIL_V1|$FIXED_CODE_HASH|$hwBind|$count|$lockoutUntil")
              }

              private fun constantTimeEquals(a: String, b: String): Boolean {
                  if (a.length != b.length) return false
                  var diff = 0
                  for (i in a.indices) {
                      diff = diff or (a[i].code xor b[i].code)
                  }
                  return diff == 0
              }

              fun activate(context: Context, inputCode: String): Pair<Boolean, String> {
                  if (!LOCK_ENABLED) return true to "Lisensi Terbuka"
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val hwBind = getInternalHardwareBind(context)
                  val now = System.currentTimeMillis()

                  val savedFailCount = prefs.getInt(KEY_FAIL_COUNT, 0)
                  val savedLockUntil = prefs.getLong(KEY_LOCKOUT_UNTIL, 0L)
                  val savedFailSig = prefs.getString(KEY_FAIL_SIG, null) ?: ""
                  val validFailState = constantTimeEquals(
                      savedFailSig,
                      computeFailSig(hwBind, savedFailCount, savedLockUntil)
                  )
                  val activeFailCount = if (validFailState) savedFailCount else 0
                  val activeLockUntil = if (validFailState) savedLockUntil else 0L

                  if (activeLockUntil > now) {
                      val sisaDetik = ceil((activeLockUntil - now) / 1000.0).toInt().coerceAtLeast(1)
                      return false to "Terlalu banyak salah kode! Coba lagi dalam $sisaDetik detik."
                  }

                  val normalizedExact = inputCode.trim().replace(Regex("\\s+"), " ")
                  val normalizedUpper = normalizedExact.uppercase(Locale.ROOT)
                  val isMatch = constantTimeEquals(computeFixedHash(normalizedExact), FIXED_CODE_HASH) ||
                      constantTimeEquals(computeFixedHash(normalizedUpper), FIXED_CODE_HASH)

                  if (!isMatch) {
                      val nextCount = if (activeLockUntil in 1L..now) 1 else activeFailCount + 1
                      return if (nextCount >= MAX_FAILED_ATTEMPTS) {
                          val lockUntil = now + LOCKOUT_DURATION_MS
                          val sig = computeFailSig(hwBind, 0, lockUntil)
                          prefs.edit()
                              .putInt(KEY_FAIL_COUNT, 0)
                              .putLong(KEY_LOCKOUT_UNTIL, lockUntil)
                              .putString(KEY_FAIL_SIG, sig)
                              .apply()
                          false to "Kode salah $MAX_FAILED_ATTEMPTS×! Input dikunci sementara 5 menit."
                      } else {
                          val sig = computeFailSig(hwBind, nextCount, 0L)
                          prefs.edit()
                              .putInt(KEY_FAIL_COUNT, nextCount)
                              .putLong(KEY_LOCKOUT_UNTIL, 0L)
                              .putString(KEY_FAIL_SIG, sig)
                              .apply()
                          val sisa = MAX_FAILED_ATTEMPTS - nextCount
                          false to "Kode aktivasi salah! Sisa percobaan: ${sisa}×"
                      }
                  }

                  val expiresAt = if (FIXED_DURATION_DAYS > 0) {
                      now + FIXED_DURATION_DAYS.toLong() * DAY_MS
                  } else {
                      Long.MAX_VALUE
                  }
                  val bindSig = computeFixedBindSig(hwBind, expiresAt)
                  prefs.edit()
                      .putString(KEY_DEVICE_BIND, hwBind)
                      .putString(KEY_LICENSE_TOKEN, "FIXED:$bindSig")
                      .putLong(KEY_FIXED_EXPIRES_AT, expiresAt)
                      .putLong(KEY_LAST_SEEN_MS, now)
                      .remove(KEY_FAIL_COUNT)
                      .remove(KEY_LOCKOUT_UNTIL)
                      .remove(KEY_FAIL_SIG)
                      .apply()
                  return true to getLicenseStatusLabel(context)
              }

              fun isLicensed(context: Context): Boolean {
                  if (!LOCK_ENABLED) return true
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val savedHw = prefs.getString(KEY_DEVICE_BIND, null) ?: return false
                  val savedToken = prefs.getString(KEY_LICENSE_TOKEN, null) ?: return false
                  val currentHw = getInternalHardwareBind(context)
                  if (savedHw != currentHw) return false

                  val expiresAt = prefs.getLong(KEY_FIXED_EXPIRES_AT, 0L)
                  if (expiresAt <= 0L) return false
                  val expectedToken = "FIXED:${computeFixedBindSig(currentHw, expiresAt)}"
                  if (!constantTimeEquals(savedToken, expectedToken)) return false

                  val now = System.currentTimeMillis()
                  val lastSeen = prefs.getLong(KEY_LAST_SEEN_MS, 0L)

                  if (FIXED_DURATION_DAYS > 0) {
                      if (lastSeen > 0L && now + CLOCK_ROLLBACK_TOLERANCE_MS < lastSeen) {
                          return false
                      }
                      if (now >= expiresAt) {
                          return false
                      }
                  }
                  if (now > lastSeen + 60_000L) {
                      prefs.edit().putLong(KEY_LAST_SEEN_MS, now).apply()
                  }
                  return true
              }

              fun getLockedReason(context: Context): String {
                  if (!LOCK_ENABLED) return "Mode Bebas Kunci"
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val savedHw = prefs.getString(KEY_DEVICE_BIND, null)
                  val savedToken = prefs.getString(KEY_LICENSE_TOKEN, null) ?: ""
                  val currentHw = getInternalHardwareBind(context)
                  if (savedHw == currentHw && savedToken.startsWith("FIXED:")) {
                      val expiresAt = prefs.getLong(KEY_FIXED_EXPIRES_AT, 0L)
                      val lastSeen = prefs.getLong(KEY_LAST_SEEN_MS, 0L)
                      val now = System.currentTimeMillis()
                      if (FIXED_DURATION_DAYS > 0 && lastSeen > 0L && now + CLOCK_ROLLBACK_TOLERANCE_MS < lastSeen) {
                          return "⚠️ Jam HP dimundurkan! Pemilik wajib input ulang kode aktivasi."
                      }
                      if (FIXED_DURATION_DAYS > 0 && expiresAt > 0L && now >= expiresAt) {
                          return "⏰ Masa pakai $FIXED_DURATION_DAYS hari habis — pemilik silakan input kode yang sama lagi."
                      }
                  }
                  return if (FIXED_DURATION_DAYS > 0) {
                      "Masukkan Kode Aktivasi Pemilik (masa pakai $FIXED_DURATION_DAYS hari):"
                  } else {
                      "Masukkan Kode Aktivasi Pemilik untuk membuka aplikasi:"
                  }
              }

              fun getLicenseStatusLabel(context: Context): String {
                  if (!LOCK_ENABLED) return "Mode Bebas Kunci"
                  if (FIXED_DURATION_DAYS <= 0) {
                      return "Aktif Permanen"
                  }
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val expiresAt = prefs.getLong(KEY_FIXED_EXPIRES_AT, 0L)
                  if (expiresAt <= 0L) return "Belum Aktif"
                  val now = System.currentTimeMillis()
                  val remDays = ceil((expiresAt - now).coerceAtLeast(0L).toDouble() / DAY_MS.toDouble()).toInt()
                  val sdf = SimpleDateFormat("dd/MM/yyyy", Locale.US)
                  return "Aktif s/d ${sdf.format(Date(expiresAt))} (Sisa $remDays hari)"
              }

              fun clearLicense(context: Context) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit()
                      .remove(KEY_DEVICE_BIND)
                      .remove(KEY_LICENSE_TOKEN)
                      .remove(KEY_FIXED_EXPIRES_AT)
                      .apply()
              }
          }
          EOF

