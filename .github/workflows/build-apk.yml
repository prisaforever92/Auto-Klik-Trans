name: Build Android AutoKlik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoKlik Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate Android Scaffolding & Project Files
        run: |
          mkdir -p app
          echo "" | base64 -d > app/build.gradle
          mkdir -p app/src/main
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/java/com/autoklik/android/service
          echo "" | base64 -d > app/src/main/java/com/autoklik/android/service/AutoClickAccessibilityService.kt
          mkdir -p app/src/main/java/com/autoklik/android/service
          echo "" | base64 -d > app/src/main/java/com/autoklik/android/service/FloatingOverlayService.kt
          mkdir -p app/src/main/java/com/autoklik/android/ui
          echo "" | base64 -d > app/src/main/java/com/autoklik/android/ui/MainActivity.kt
          mkdir -p app/src/main/res/drawable
          echo "" | base64 -d > app/src/main/res/drawable/bg_panel_pill.xml
          mkdir -p app/src/main/res/drawable
          echo "" | base64 -d > app/src/main/res/drawable/bg_target_point.xml
          mkdir -p app/src/main/res/drawable
          echo "" | base64 -d > app/src/main/res/drawable/ic_launcher_foreground.xml
          mkdir -p app/src/main/res/layout
          echo "" | base64 -d > app/src/main/res/layout/activity_main.xml
          mkdir -p app/src/main/res/layout
          echo "" | base64 -d > app/src/main/res/layout/layout_floating_widget.xml
          mkdir -p app/src/main/res/layout
          echo "" | base64 -d > app/src/main/res/layout/layout_point_dialog.xml
          mkdir -p app/src/main/res/layout
          echo "" | base64 -d > app/src/main/res/layout/layout_size_dialog.xml
          mkdir -p app/src/main/res/layout
          echo "-" | base64 -d > app/src/main/res/layout/layout_target_point.xml
          mkdir -p app/src/main/res/values
          echo "" | base64 -d > app/src/main/res/values/strings.xml
          mkdir -p app/src/main/res/values
          echo "" | base64 -d > app/src/main/res/values/themes.xml
          mkdir -p app/src/main/res/xml
          echo "" | base64 -d > app/src/main/res/xml/accessibility_service_config.xml
          echo "" | base64 -d > build.gradle
          echo "YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCiAgICAgICAgICBhbmRyb2lkLmVuYWJsZUpldGlmaWVyPXRydWUKICAgICAgICAgIG9yZy5ncmFkbGUuanZtYXJncz0tWG14MjA0OG0gLURmaWxlLmVuY29kaW5nPVVURi04Cg==" | base64 -d > gradle.properties
          echo "" | base64 -d > settings.gradle

      - name: Validate Generated Android Project Files
        run: |
          echo "=== Struktur Project Android yang Dibuat Otomatis ==="
          ls -la app/src/main/
          ls -la app/src/main/res/layout/
          echo "Semua file Android berhasil digenerate!"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoKlik-Android-APK
          path: app/build/outputs/apk/debug/*.apk
