                              android:textColor="#38BDF8"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <RadioButton
                              android:id="@+id/rbUnitMs"
                              android:layout_width="0dp"
                              android:layout_height="30dp"
                              android:layout_weight="1"
                              android:text="ms"
                              android:textColor="#F8FAFC"
                              android:textSize="11sp"
                              android:textStyle="bold" />
                      </RadioGroup>
                  </LinearLayout>

                  <!-- BARIS 5: SUB-LOOP (LOMPAT BALIK + BATAS JUMLAH LOOP LALU LANJUT) -->
                  <CheckBox
                      android:id="@+id/cbPointSubLoop"
                      android:layout_width="wrap_content"
                      android:layout_height="30dp"
                      android:layout_marginTop="4dp"
                      android:text="🔁 Lompat Balik (Sub-Loop) Setelah Titik Ini"
                      android:textColor="#38BDF8"
                      android:textSize="11.5sp"
                      android:textStyle="bold" />

                  <LinearLayout
                      android:id="@+id/layoutPointSubLoopFields"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="2dp"
                      android:background="#131F33"
                      android:orientation="vertical"
                      android:padding="7dp"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center_vertical"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Ke Titik #:"
                              android:textColor="#E2E8F0"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <EditText
                              android:id="@+id/etPointJumpTo"
                              android:layout_width="48dp"
                              android:layout_height="32dp"
                              android:layout_marginStart="5dp"
                              android:background="#1E293B"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="2"
                              android:textColor="#38BDF8"
                              android:textSize="13sp"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="10dp"
                              android:text="Batas Loop:"
                              android:textColor="#E2E8F0"
                              android:textSize="11sp"
                              android:textStyle="bold" />

                          <EditText
                              android:id="@+id/etPointJumpCycle"
                              android:layout_width="52dp"
                              android:layout_height="32dp"
                              android:layout_marginStart="5dp"
                              android:background="#1E293B"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="8"
                              android:textColor="#10B981"
                              android:textSize="13sp"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="4dp"
                              android:text="x (0=∞)"
                              android:textColor="#94A3B8"
                              android:textSize="10sp" />
                      </LinearLayout>

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="3dp"
                          android:text="💡 Setelah selesai N kali loop, titik ini tetap melakukan aksi lalu lanjut ke urutan berikutnya."
                          android:textColor="#94A3B8"
                          android:textSize="9.5sp" />
                  </LinearLayout>

                  <!-- BARIS 6: TOMBOL SIMPAN & BATAL -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:orientation="horizontal">

                      <Button
                          android:id="@+id/btnDialogSave"
                          android:layout_width="0dp"
