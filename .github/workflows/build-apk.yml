              // Indikator Warna Kuning Emas Menyala Saat Titik Sedang Mengeksekusi Klik/Swipe
              // Jika titik bertumpuk dengan titik lain, lingkaran paling atas di lokasi tersebut juga menyala menampilkan nomor yang sedang aktif
              private fun setPointActiveHighlight(point: TargetPoint, active: Boolean) {
                  val density = resources.displayMetrics.density
                  val stackThresholdPx = (18 * density).toInt()

                  val stackedGroup = targetPoints.filter {
                      abs(it.params.x - point.params.x) <= stackThresholdPx &&
                          abs(it.params.y - point.params.y) <= stackThresholdPx
                  }

                  for (item in stackedGroup) {
                      val root = item.view.findViewById<View>(R.id.pointRoot) ?: continue
                      val tvNum = item.view.findViewById<TextView>(R.id.tvTargetNumber)
                      val tvTyp = item.view.findViewById<TextView>(R.id.tvTargetType)

                      if (active) {
                          root.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(Color.parseColor("#EAB308")) // Kuning Emas Terang
                              setStroke((2.5f * density).toInt(), Color.WHITE)
                          }
                          // Tampilkan nomor & simbol titik yang sedang bekerja pada semua lingkaran yang bertumpuk di titik itu
                          tvNum?.text = point.order.toString()
                          tvTyp?.text = getPointTypeSymbol(point)
                      } else {
                          root.setBackgroundResource(R.drawable.bg_target_point)
                      }
                  }

                  if (!active) {
                      refreshAllStackBadges()
                  }
              }

              private fun resetAllPointHighlights() {
                  for (p in targetPoints) {
                      val root = p.view.findViewById<View>(R.id.pointRoot) ?: continue
                      root.setBackgroundResource(R.drawable.bg_target_point)
                  }
                  refreshAllStackBadges()
              }

              // Ambil koordinat presisi titik (tetap akurat 100% meskipun titik bertumpuk atau sedang disembunyikan 🙈)
              private fun getExactPointCenter(point: TargetPoint): Pair<Float, Float> {
                  val sizePx = getTargetSizePx()
                  val fallbackX = point.params.x + (sizePx / 2f)
                  val fallbackY = point.params.y + (sizePx / 2f)

                  if (!arePointsVisible || point.view.visibility != View.VISIBLE) {
                      return fallbackX to fallbackY
                  }

                  val pointRoot = point.view.findViewById<View>(R.id.pointRoot) ?: return fallbackX to fallbackY
                  val loc = IntArray(2)
                  pointRoot.getLocationOnScreen(loc)
                  if (loc[0] <= 0 && loc[1] <= 0) {
                      return fallbackX to fallbackY
                  }
                  val w = if (pointRoot.width > 0) pointRoot.width else sizePx
                  val h = if (pointRoot.height > 0) pointRoot.height else sizePx
                  return (loc[0] + w / 2f) to (loc[1] + h / 2f)
              }

              private fun getExactKeyPinCenter(point: TargetPoint): Pair<Float, Float> {
                  val sizePx = getTargetSizePx()
                  val kParams = point.keyParams
                  val fallbackX = (kParams?.x ?: point.savedKeyX.coerceAtLeast(100)) + (sizePx / 2f)
                  val fallbackY = (kParams?.y ?: point.savedKeyY.coerceAtLeast(500)) + (sizePx / 2f)

                  val kView = point.keyView ?: return fallbackX to fallbackY
                  if (!arePointsVisible || kView.visibility != View.VISIBLE) {
                      return fallbackX to fallbackY
                  }

                  val kLoc = IntArray(2)
                  kView.getLocationOnScreen(kLoc)
                  if (kLoc[0] <= 0 && kLoc[1] <= 0) {
                      return fallbackX to fallbackY
                  }
                  val w = if (kView.width > 0) kView.width else sizePx
                  val h = if (kView.height > 0) kView.height else sizePx
                  return (kLoc[0] + w / 2f) to (kLoc[1] + h / 2f)
              }

              // EKSEKUSI BERURUTAN SESUAI NO. URUT (1 -> 2 -> 3 ... -> N) UNTUK SEMUA FITUR (TAP, 2+ SWIPE, PASTE, POPUP & TITIK BERTUMPUK)
              private fun startClickExecution(service: AutoClickAccessibilityService) {
                  clickJob?.cancel()
                  clickJob = serviceScope.launch {
                      val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE)
                      val jitterEnabled = prefs.getBoolean("jitter_enabled", true)
                      val defaultPaste = prefs.getString("paste_text", "AutoKlik Trans") ?: ""

                      // Pastikan nomor urut tersusun rapi 1..N dan seluruh overlay tembus sentuhan sebelum gestur pertama dimulai
                      reindexTargetPoints()
                      setTargetPointsTouchable(false)
                      delay(150)

                      Toast.makeText(applicationContext, "AutoKlik Berjalan (Urutan #1 s/d #${targetPoints.size})!", Toast.LENGTH_SHORT).show()

                      var currentOrder = 1
                      var cycle = 1

                      while (isActive && isPlaying && targetPoints.isNotEmpty()) {
                          val totalPoints = targetPoints.size
                          if (currentOrder < 1 || currentOrder > totalPoints) {
                              currentOrder = 1
                          }

                          val point = targetPoints.find { it.order == currentOrder } ?: targetPoints.getOrNull(currentOrder - 1)
                          if (point != null) {
                              // Tampilkan status No. Urut aktif pada Mini Toolbar & nyalakan indikator Kuning Emas
                              tvMiniStatus?.text = "⚡ #${point.order}/$totalPoints ${getPointTypeSymbol(point)}"
                              resetAllPointHighlights()
                              setPointActiveHighlight(point, true)

                              val (tapX, tapY) = getExactPointCenter(point)
                              val screenH = resources.displayMetrics.heightPixels.toFloat()

                              // Tunggu aksi (Tap / Swipe Up / Swipe Down / Paste / Popup) selesai sepenuhnya sebelum lanjut ke jeda & titik berikutnya
                              withTimeoutOrNull(4000L) {
                                  suspendCancellableCoroutine<Unit> { cont ->
                                      val done = {
                                          if (cont.isActive) cont.resume(Unit)
                                      }
                                      when (point.type) {
                                          "swipe_up" -> {
                                              val endY = (tapY - point.swipeDistancePx).coerceAtLeast(30f)
                                              service.executeSwipe(tapX, tapY, tapX, endY, 350L, done)
                                          }
                                          "swipe_down" -> {
                                              val maxScreenY = (screenH - 35f).coerceAtLeast(200f)
                                              val endY = (tapY + point.swipeDistancePx).coerceAtMost(maxScreenY)
                                              service.executeSwipe(tapX, tapY, tapX, endY, 350L, done)
                                          }
                                          "paste" -> {
                                              val text = if (point.pasteText.isNotBlank()) point.pasteText else defaultPaste
                                              service.executePaste(tapX, tapY, text, point.autoTapPaste, done)
                                          }
                                          "popup" -> {
                                              if (point.keyView != null || point.savedKeyX >= 0) {
                                                  val (keyTapX, keyTapY) = getExactKeyPinCenter(point)
                                                  service.executePopup(tapX, tapY, keyTapX, keyTapY, point.keyDelayMs, done)
                                              } else {
                                                  service.executeTap(tapX, tapY, point.durationMs, done)
                                              }
                                          }
                                          else -> {
                                              service.executeTap(tapX, tapY, point.durationMs, done)
                                          }
                                      }
                                  }
                              }

                              // Jeda setelah titik ini selesai beroperasi (ms atau detik)
                              var waitTime = point.delayMs.coerceAtLeast(50L)
                              if (jitterEnabled) {
                                  // Jitter ringan (±10% maksimal ±120ms) agar urutan tetap responsif dan tidak melenceng
                                  val maxJitter = (waitTime * 0.10f).toLong().coerceAtMost(120L)
                                  if (maxJitter > 5L) {
                                      val delta = Random.nextLong(-maxJitter, maxJitter + 1)
                                      waitTime = (waitTime + delta).coerceAtLeast(50L)
                                  }
                              }
                              delay(waitTime)
                              setPointActiveHighlight(point, false)

                              // Lanjut ke No. Urut berikutnya (atau lompat Sub-Loop jika diaktifkan pengguna)
                              if (point.jumpEnabled && cycle >= point.jumpAfterCycle && point.jumpToPoint in 1..totalPoints) {
                                  currentOrder = point.jumpToPoint
                              } else if (currentOrder >= totalPoints) {
                                  currentOrder = 1
                                  cycle++
                              } else {
                                  currentOrder++
                              }
                          } else {
                              currentOrder = 1
                          }
                      }
                  }
              }

              private fun stopClickExecution() {
                  isPlaying = false
                  clickJob?.cancel()
                  clickJob = null

                  resetAllPointHighlights()
                  setTargetPointsTouchable(!isPointsLocked)

                  layoutMiniToolbar?.visibility = View.GONE
                  layoutFullToolbar?.visibility = View.VISIBLE
                  if (floatingContainer != null) {
                      try {
                          windowManager.updateViewLayout(floatingContainer, containerParams)
                      } catch (e: Exception) {}
                  }

                  Toast.makeText(applicationContext, "AutoKlik Dihentikan ⏹", Toast.LENGTH_SHORT).show()
              }

