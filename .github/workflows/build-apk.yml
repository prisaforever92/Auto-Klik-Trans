          package com.autoklik.android.service

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Path
          import android.os.Build
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import androidx.annotation.RequiresApi
          import kotlinx.coroutines.*
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.math.abs

          class AutoClickAccessibilityService : AccessibilityService() {

              private val serviceScope = CoroutineScope(Dispatchers.Default + SupervisorJob())

              companion object {
                  var instance: AutoClickAccessibilityService? = null
                      private set
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  instance = null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  serviceScope.cancel()
              }

              private fun clampX(x: Float): Float {
                  val w = resources.displayMetrics.widthPixels.toFloat().coerceAtLeast(200f)
                  return x.coerceIn(10f, w - 10f)
              }

              private fun clampY(y: Float): Float {
                  val h = resources.displayMetrics.heightPixels.toFloat().coerceAtLeast(400f)
                  return y.coerceIn(25f, h - 25f)
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executeTap(x: Float, y: Float, durationMs: Long = 55L, callback: (() -> Unit)? = null) {
                  val completed = AtomicBoolean(false)
                  val finishOnce = {
                      if (completed.compareAndSet(false, true)) {
                          callback?.invoke()
                      }
                  }

                  val safeX = clampX(x)
                  val safeY = clampY(y)
                  val safeDur = durationMs.coerceIn(35L, 500L)

                  fun dispatchAttempt(isRetry: Boolean) {
                      try {
                          val path = Path().apply { moveTo(safeX, safeY) }
                          val stroke = GestureDescription.StrokeDescription(path, 0L, safeDur)
                          val gesture = GestureDescription.Builder().addStroke(stroke).build()

                          val dispatched = dispatchGesture(gesture, object : GestureResultCallback() {
                              override fun onCompleted(gestureDescription: GestureDescription?) {
                                  finishOnce()
                              }

                              override fun onCancelled(gestureDescription: GestureDescription?) {
                                  if (!isRetry) {
                                      serviceScope.launch {
                                          delay(65)
                                          dispatchAttempt(true)
                                      }
                                  } else {
                                      finishOnce()
                                  }
                              }
                          }, null)

                          if (!dispatched) {
                              if (!isRetry) {
                                  serviceScope.launch {
                                      delay(65)
                                      dispatchAttempt(true)
                                  }
                              } else {
                                  finishOnce()
                              }
                          }
                      } catch (e: Exception) {
                          finishOnce()
                      }
                  }

                  dispatchAttempt(false)
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executeSwipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  durationMs: Long = 350L,
                  callback: (() -> Unit)? = null
              ) {
                  val completed = AtomicBoolean(false)
                  val finishOnce = {
                      if (completed.compareAndSet(false, true)) {
                          callback?.invoke()
                      }
                  }

                  val safeStartX = clampX(startX)
                  val safeEndX = clampX(endX)
                  val safeStartY = clampY(startY)
                  var safeEndY = clampY(endY)

                  // Pastikan jarak swipe minimal 25px agar Path valid di semua perangkat
                  if (abs(safeEndY - safeStartY) < 25f && abs(safeEndX - safeStartX) < 25f) {
                      val h = resources.displayMetrics.heightPixels.toFloat().coerceAtLeast(400f)
                      safeEndY = if (endY <= startY) {
                          (safeStartY - 120f).coerceAtLeast(25f)
                      } else {
                          (safeStartY + 120f).coerceAtMost(h - 25f)
                      }
                  }

                  val safeDur = durationMs.coerceIn(180L, 1200L)

                  fun buildSwipeGesture(useAntiFlingHold: Boolean): GestureDescription {
                      if (useAntiFlingHold && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          try {
                              val holdY = clampY(if (safeEndY > safeStartY) safeEndY + 1f else safeEndY - 1f)
                              val mainPath = Path().apply {
                                  moveTo(safeStartX, safeStartY)
                                  lineTo(safeEndX, safeEndY)
                              }
                              val holdPath = Path().apply {
                                  moveTo(safeEndX, safeEndY)
                                  lineTo(safeEndX, holdY)
                              }
                              // Tahap 1: Geser jari sepanjang garis panah (safeDur ms)
                              // Tahap 2: Tahan 65ms di ujung panah agar scroll berhenti presisi 1:1 (tanpa fling liar)
                              val stroke1 = GestureDescription.StrokeDescription(mainPath, 0L, safeDur, true)
                              val stroke2 = stroke1.continueStroke(holdPath, safeDur, 65L, false)
                              return GestureDescription.Builder().addStroke(stroke2).build()
                          } catch (e: Exception) {
                              // Fallback ke single stroke jika ROM membatasi continueStroke
                          }
                      }
                      val singlePath = Path().apply {
                          moveTo(safeStartX, safeStartY)
                          lineTo(safeEndX, safeEndY)
                      }
                      val stroke = GestureDescription.StrokeDescription(singlePath, 0L, safeDur)
                      return GestureDescription.Builder().addStroke(stroke).build()
                  }

                  fun dispatchSwipeAttempt(isRetry: Boolean) {
                      try {
                          // Percobaan 1 gunakan anti-fling hold; jika retry gunakan single stroke murni
                          val gesture = buildSwipeGesture(useAntiFlingHold = !isRetry)
                          val dispatched = dispatchGesture(gesture, object : GestureResultCallback() {
                              override fun onCompleted(gestureDescription: GestureDescription?) {
                                  finishOnce()
                              }

                              override fun onCancelled(gestureDescription: GestureDescription?) {
                                  if (!isRetry) {
                                      serviceScope.launch {
                                          delay(85)
                                          dispatchSwipeAttempt(true)
                                      }
                                  } else {
                                      finishOnce()
                                  }
                              }
                          }, null)

                          if (!dispatched) {
                              if (!isRetry) {
                                  serviceScope.launch {
                                      delay(85)
                                      dispatchSwipeAttempt(true)
                                  }
                              } else {
                                  finishOnce()
                              }
                          }
                      } catch (e: Exception) {
                          if (!isRetry) {
                              serviceScope.launch {
                                  delay(85)
                                  dispatchSwipeAttempt(true)
                              }
                          } else {
                              finishOnce()
                          }
                      }
                  }

                  dispatchSwipeAttempt(false)
              }

              private fun findEditableNode(root: AccessibilityNodeInfo?, targetX: Int, targetY: Int): AccessibilityNodeInfo? {
                  if (root == null) return null

                  // 1. Cek node yang sedang memiliki fokus input aktif
                  val focused = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  if (focused != null && (focused.isEditable || focused.className?.contains("EditText", true) == true)) {
                      return focused
                  }

                  // 2. Jika di Chrome/WebView fokus belum terdeteksi, cari node editable yang mencakup koordinat (targetX, targetY)
                  val rect = android.graphics.Rect()
                  val queue = ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)

                  var bestMatch: AccessibilityNodeInfo? = null
                  while (queue.isNotEmpty()) {
                      val current = queue.removeFirst()
                      current.getBoundsInScreen(rect)
                      val isInput = current.isEditable ||
                          current.className?.contains("EditText", true) == true ||
                          current.className?.contains("Input", true) == true

                      if (isInput && rect.contains(targetX, targetY)) {
                          bestMatch = current
                          break
                      }

                      for (i in 0 until current.childCount) {
                          current.getChild(i)?.let { queue.add(it) }
                      }
                  }
                  return bestMatch ?: focused
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executePaste(
                  x: Float,
                  y: Float,
                  textToPaste: String,
                  autoTapToFocus: Boolean = true,
                  callback: (() -> Unit)? = null
              ) {
                  val completed = AtomicBoolean(false)
                  val finishOnce = {
                      if (completed.compareAndSet(false, true)) {
                          callback?.invoke()
                      }
                  }

                  val performTypeAndSuggest = {
                      serviceScope.launch {
                          try {
                              val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              val clip = ClipData.newPlainText("AutoKlikPaste", textToPaste)
                              clipboard.setPrimaryClip(clip)

                              val rootNode = rootInActiveWindow
                              val targetNode = findEditableNode(rootNode, x.toInt(), y.toInt())

                              if (targetNode != null) {
                                  targetNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                                  targetNode.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                  delay(80)

                                  val pasted = targetNode.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                                  if (!pasted) {
                                      val setArgs = Bundle().apply {
                                          putCharSequence(
                                              AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                                              textToPaste
                                          )
                                      }
                                      targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, setArgs)
                                  }

                                  val selArgs = Bundle().apply {
                                      putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_START_INT, textToPaste.length)
                                      putInt(AccessibilityNodeInfo.ACTION_ARGUMENT_SELECTION_END_INT, textToPaste.length)
                                  }
                                  targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_SELECTION, selArgs)
                              }
                          } catch (e: Exception) {
                              // Abaikan jika node sudah tertutup
                          } finally {
                              finishOnce()
                          }
                      }
                  }

                  if (autoTapToFocus) {
                      executeTap(x, y, 65L) {
                          serviceScope.launch {
                              delay(300)
                              performTypeAndSuggest()
                          }
                      }
                  } else {
                      performTypeAndSuggest()
                  }
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executePopup(
                  formX: Float,
                  formY: Float,
                  keyX: Float,
                  keyY: Float,
                  keyDelayMs: Long = 400L,
                  callback: (() -> Unit)? = null
              ) {
                  val completed = AtomicBoolean(false)
                  val finishOnce = {
                      if (completed.compareAndSet(false, true)) {
                          callback?.invoke()
                      }
                  }

                  // Tahap 1: Ketuk Kotak Form (Titik Utama) untuk mengaktifkan kursor & memunculkan Keyboard HP
                  executeTap(formX, formY, 60L) {
                      serviceScope.launch {
                          // Tahap 2: Tunggu hingga Keyboard HP naik sepenuhnya (default 400ms)
                          delay(keyDelayMs.coerceAtLeast(150L))
                          // Tahap 3: Ketuk Pin Huruf Keyboard (⌨️) secara fisik agar Popup Sugesti keluar
                          executeTap(keyX, keyY, 60L) {
                              finishOnce()
                          }
                      }
                  }
              }
          }
