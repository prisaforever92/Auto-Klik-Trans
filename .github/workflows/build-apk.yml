          cat << 'EOF' > app/src/main/java/com/autoklik/android/service/FloatingOverlayService.kt
          package com.autoklik.android.service

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import androidx.core.app.NotificationCompat
          import com.autoklik.android.R
          import com.autoklik.android.ui.MainActivity
          import kotlinx.coroutines.*
          import kotlin.random.Random

          class FloatingOverlayService : Service() {

              // Model Titik dengan Tipe Gerakan & Pengaturan Per-Titik (Fitur 13 & 14)
              data class TargetPoint(
                  val order: Int,
                  val view: View,
                  val params: WindowManager.LayoutParams,
                  var type: String = "tap", // "tap", "swipe_up", "swipe_down", "paste"
                  var delayMs: Long = 500L,
                  var durationMs: Long = 50L,
                  var pasteText: String = "",
                  var autoTapPaste: Boolean = true
              )

              private lateinit var windowManager: WindowManager
              private var floatingToolbar: View? = null
              private lateinit var toolbarParams: WindowManager.LayoutParams
              private val targetPoints = mutableListOf<TargetPoint>()

              // Dialog Pop-up Per-Titik
              private var currentDialogView: View? = null
              private var currentDialogParams: WindowManager.LayoutParams? = null

              private var isPlaying = false
              private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var clickJob: Job? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  startForegroundNotification()
                  setupFloatingToolbar()
              }

              private fun startForegroundNotification() {
                  val channelId = "autoklik_overlay_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "AutoKlik Overlay Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("AutoKlik Aktif")
                      .setContentText("Panel melayang siap digunakan")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()

                  startForeground(1001, notification)
              }

              private fun setupFloatingToolbar() {
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  toolbarParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 200
                  }

                  floatingToolbar = LayoutInflater.from(this).inflate(R.layout.layout_floating_widget, null)

                  val btnPlay = floatingToolbar?.findViewById<Button>(R.id.btnFloatingPlay)
                  val btnAdd = floatingToolbar?.findViewById<Button>(R.id.btnFloatingAdd)
                  val btnRemove = floatingToolbar?.findViewById<Button>(R.id.btnFloatingRemove)
                  val btnSettings = floatingToolbar?.findViewById<Button>(R.id.btnFloatingSettings)
                  val btnClose = floatingToolbar?.findViewById<Button>(R.id.btnFloatingClose)

                  // Tambah Titik Target (+)
                  btnAdd?.setOnClickListener {
                      addTargetPoint()
                  }

                  // Hapus Titik Target Terakhir (-)
                  btnRemove?.setOnClickListener {
                      removeLastTargetPoint()
                  }

                  // Buka Pengaturan Fitur (⚙)
                  btnSettings?.setOnClickListener {
                      val intent = Intent(this, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                  }

                  // Mulai / Jeda (▶ / ⏸)
                  btnPlay?.setOnClickListener {
                      val a11y = AutoClickAccessibilityService.instance
                      if (a11y == null) {
                          Toast.makeText(this, "Layanan Aksesibilitas belum aktif!", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      if (targetPoints.isEmpty()) {
                          Toast.makeText(this, "Tekan tombol ➕ untuk menambah titik target!", Toast.LENGTH_LONG).show()
                          return@setOnClickListener
                      }

                      isPlaying = !isPlaying
                      if (isPlaying) {
                          btnPlay.text = "⏸ Jeda"
                          startClickExecution(a11y)
                      } else {
                          btnPlay.text = "▶ Mulai"
                          stopClickExecution()
                      }
                  }

                  // Tutup Toolbar (✕)
                  btnClose?.setOnClickListener {
                      stopSelf()
                  }

                  // Drag & Drop Toolbar
                  floatingToolbar?.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = toolbarParams.x
                                  initialY = toolbarParams.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  toolbarParams.x = initialX + (event.rawX - initialTouchX).toInt()
                                  toolbarParams.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(floatingToolbar, toolbarParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager.addView(floatingToolbar, toolbarParams)
              }

              // MENAMBAH BULATAN TITIK TARGET DI LAYAR
              private fun addTargetPoint() {
                  val nextOrder = targetPoints.size + 1
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val pointParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 120 + ((nextOrder - 1) % 4) * 130
                      y = 350 + ((nextOrder - 1) / 4) * 140
                  }

                  val pointView = LayoutInflater.from(this).inflate(R.layout.layout_target_point, null)
                  val tvNumber = pointView.findViewById<TextView>(R.id.tvTargetNumber)
                  val tvType = pointView.findViewById<TextView>(R.id.tvTargetType)
                  tvNumber.text = nextOrder.toString()
                  tvType.text = "🎯"

                  val targetPoint = TargetPoint(nextOrder, pointView, pointParams)

                  // Drag & Drop serta Deteksi Klik untuk Pop-up Setting Per-Titik (Fitur 14)
                  pointView.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var touchStartTime = 0L

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = pointParams.x
                                  initialY = pointParams.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  touchStartTime = System.currentTimeMillis()
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val deltaX = (event.rawX - initialTouchX).toInt()
                                  val deltaY = (event.rawY - initialTouchY).toInt()
                                  pointParams.x = initialX + deltaX
                                  pointParams.y = initialY + deltaY
                                  windowManager.updateViewLayout(pointView, pointParams)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  val diffTime = System.currentTimeMillis() - touchStartTime
                                  val moved = Math.abs(event.rawX - initialTouchX) > 10 || Math.abs(event.rawY - initialTouchY) > 10
                                  // Jika hanya diklik (bukan digeser), buka pop-up setting titik (Fitur 14)
                                  if (!moved && diffTime < 300) {
                                      showPointSettingsDialog(targetPoint)
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager.addView(pointView, pointParams)
                  targetPoints.add(targetPoint)
                  Toast.makeText(this, "Titik $nextOrder ditambah! (Ketuk bulatan untuk opsi Swipe/Paste)", Toast.LENGTH_SHORT).show()
              }

              // FITUR 14: POP-UP DIALOG SETTING PER-TITIK
              private fun showPointSettingsDialog(point: TargetPoint) {
                  closePointSettingsDialog()

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val dialogParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  val dialogView = LayoutInflater.from(this).inflate(R.layout.layout_point_dialog, null)
                  val tvTitle = dialogView.findViewById<TextView>(R.id.tvDialogTitle)
                  val rgType = dialogView.findViewById<RadioGroup>(R.id.rgPointType)
                  val rbTap = dialogView.findViewById<RadioButton>(R.id.rbTypeTap)
                  val rbSwipeUp = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeUp)
                  val rbSwipeDown = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeDown)
                  val rbPaste = dialogView.findViewById<RadioButton>(R.id.rbTypePaste)
                  val etDelay = dialogView.findViewById<EditText>(R.id.etDialogDelay)
                  val layoutPaste = dialogView.findViewById<LinearLayout>(R.id.layoutDialogPasteFields)
                  val etPasteText = dialogView.findViewById<EditText>(R.id.etDialogPasteText)
                  val cbAutoTap = dialogView.findViewById<CheckBox>(R.id.cbDialogAutoTap)
                  val btnSave = dialogView.findViewById<Button>(R.id.btnDialogSave)
                  val btnClose = dialogView.findViewById<Button>(R.id.btnDialogClose)

                  tvTitle.text = "Pengaturan Titik #${point.order}"
                  etDelay.setText(point.delayMs.toString())
                  etPasteText.setText(point.pasteText)
                  cbAutoTap.isChecked = point.autoTapPaste

                  when (point.type) {
                      "swipe_up" -> rbSwipeUp.isChecked = true
                      "swipe_down" -> rbSwipeDown.isChecked = true
                      "paste" -> {
                          rbPaste.isChecked = true
                          layoutPaste.visibility = View.VISIBLE
                      }
                      else -> rbTap.isChecked = true
                  }

                  rgType.setOnCheckedChangeListener { _, checkedId ->
                      layoutPaste.visibility = if (checkedId == R.id.rbTypePaste) View.VISIBLE else View.GONE
                  }

                  btnSave.setOnClickListener {
                      point.type = when (rgType.checkedRadioButtonId) {
                          R.id.rbTypeSwipeUp -> "swipe_up"
                          R.id.rbTypeSwipeDown -> "swipe_down"
                          R.id.rbTypePaste -> "paste"
                          else -> "tap"
                      }
                      point.delayMs = etDelay.text.toString().toLongOrNull() ?: 500L
                      point.pasteText = etPasteText.text.toString()
                      point.autoTapPaste = cbAutoTap.isChecked

                      // Update badge icon di bulatan target (Fitur 13 & 14)
                      val tvType = point.view.findViewById<TextView>(R.id.tvTargetType)
                      tvType.text = when (point.type) {
                          "swipe_up" -> "👆"
                          "swipe_down" -> "👇"
                          "paste" -> "📋"
                          else -> "🎯"
                      }

                      closePointSettingsDialog()
                      Toast.makeText(this, "Titik #${point.order} disetel ke ${point.type.uppercase()} ✔", Toast.LENGTH_SHORT).show()
                  }

                  btnClose.setOnClickListener {
                      closePointSettingsDialog()
                  }

                  windowManager.addView(dialogView, dialogParams)
                  currentDialogView = dialogView
                  currentDialogParams = dialogParams
              }

              private fun closePointSettingsDialog() {
                  if (currentDialogView != null) {
                      try {
                          windowManager.removeView(currentDialogView)
                      } catch (e: Exception) {}
                      currentDialogView = null
                      currentDialogParams = null
                  }
              }

              // MENGHAPUS TITIK TARGET TERAKHIR
              private fun removeLastTargetPoint() {
                  if (targetPoints.isNotEmpty()) {
                      val last = targetPoints.removeAt(targetPoints.size - 1)
                      try {
                          windowManager.removeView(last.view)
                          Toast.makeText(this, "Titik ${last.order} dihapus", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {}
                  } else {
                      Toast.makeText(this, "Tidak ada titik untuk dihapus", Toast.LENGTH_SHORT).show()
                  }
              }

              // MENJALANKAN EKSEKUSI KLIK, SWIPE (FITUR 13), & PASTE OTOMATIS
              private fun startClickExecution(service: AutoClickAccessibilityService) {
                  clickJob?.cancel()
                  clickJob = serviceScope.launch {
                      val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE)
                      val subloopEnabled = prefs.getBoolean("subloop_enabled", true)
                      val subloopStart = prefs.getInt("subloop_start", 7)
                      val subloopEnd = prefs.getInt("subloop_end", 10)
                      val jitterEnabled = prefs.getBoolean("jitter_enabled", true)
                      val defaultPaste = prefs.getString("paste_text", "AutoKlik Trans") ?: ""

                      Toast.makeText(applicationContext, "AutoKlik Berjalan!", Toast.LENGTH_SHORT).show()

                      var currentOrder = 1
                      var cycle = 1

                      while (isActive && isPlaying && targetPoints.isNotEmpty()) {
                          val point = targetPoints.find { it.order == currentOrder } ?: targetPoints.firstOrNull()
                          if (point != null) {
                              val density = resources.displayMetrics.density
                              val tapX = point.params.x + 26f * density
                              val tapY = point.params.y + 26f * density

                              // EKSEKUSI BERDASARKAN TIPE TITIK (FITUR 13 & 14)
                              when (point.type) {
                                  "swipe_up" -> {
                                      // Usap 450px ke atas
                                      service.executeSwipe(tapX, tapY, tapX, (tapY - 450f).coerceAtLeast(100f), 350L)
                                  }
                                  "swipe_down" -> {
                                      // Usap 450px ke bawah
                                      service.executeSwipe(tapX, tapY, tapX, tapY + 450f, 350L)
                                  }
                                  "paste" -> {
                                      val text = if (point.pasteText.isNotBlank()) point.pasteText else defaultPaste
                                      service.executePaste(tapX, tapY, text, point.autoTapPaste)
                                  }
                                  else -> {
                                      service.executeTap(tapX, tapY, point.durationMs)
                                  }
                              }

                              // Hitung jeda dengan Jitter Anti-Deteksi
                              var waitTime = point.delayMs
                              if (jitterEnabled) {
                                  val jitterFactor = Random.nextInt(-15, 16) / 100f
                                  waitTime = (waitTime * (1f + jitterFactor)).toLong().coerceAtLeast(50L)
                              }
                              delay(waitTime)

                              // LOGIKA SUB-LOOP: Titik 10 loop kembali ke Titik 7
                              if (subloopEnabled && currentOrder == subloopEnd && currentOrder <= targetPoints.size && subloopStart <= targetPoints.size && cycle >= 1) {
                                  currentOrder = subloopStart // Lompat kembali ke titik 7!
                              } else if (currentOrder >= targetPoints.size) {
                                  currentOrder = 1
                                  cycle++
                              } else {
                                  currentOrder++
                              }
                          } else {
                              currentOrder = 1
                          }
                      }
                  }
              }

              private fun stopClickExecution() {
                  clickJob?.cancel()
                  clickJob = null
                  Toast.makeText(applicationContext, "AutoKlik Dijeda", Toast.LENGTH_SHORT).show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopClickExecution()
                  serviceScope.cancel()
                  closePointSettingsDialog()

                  for (point in targetPoints) {
                      try {
                          windowManager.removeView(point.view)
                      } catch (e: Exception) {}
                  }
                  targetPoints.clear()

                  if (floatingToolbar != null) {
                      try {
                          windowManager.removeView(floatingToolbar)
                      } catch (e: Exception) {}
                  }
              }
          }
          EOF

          # 11. AndroidManifest.xml
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.autoklik.android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.FloatingOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />

                  <service
                      android:name=".service.AutoClickAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>

          </manifest>
          EOF

          # 12. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'kotlin-kapt'
          }

          android {
              namespace 'com.autoklik.android'
              compileSdk 34

              defaultConfig {
                  applicationId "com.autoklik.android"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoKlik-Android-APK
          path: app/build/outputs/apk/debug/*.apk
