name: Build Android AutoKlik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoKlik Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate Android Scaffolding & Fix Resources
        run: |
          # 1. Enable AndroidX in gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoKlik"
          include ':app'
          EOF

          # 3. build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
          }
          EOF

          # 4. Strings & Themes
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AutoKlik Trans</string>
              <string name="accessibility_desc">Layanan Aksesibilitas AutoKlik untuk simulasi sentuhan dan multi-gesture tanpa root.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:windowBackground">#0F172A</item>
              </style>
          </resources>
          EOF

          # 5. Accessibility Service Config XML
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          # 6. Icons & Vector Drawables
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          # 7. Layouts: activity_main.xml & layout_floating_widget.xml
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > app/src/main/res/layout/layout_floating_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:background="#E60F172A"
              android:gravity="center_vertical"
              android:padding="8dp">

              <TextView
                  android:id="@+id/tvDragHandle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="⠿ AutoKlik"
                  android:textColor="#10B981"
                  android:textStyle="bold"
                  android:textSize="14sp"
                  android:paddingEnd="12dp" />

              <Button
                  android:id="@+id/btnFloatingPlay"
                  android:layout_width="wrap_content"
                  android:layout_height="38dp"
                  android:text="▶ Mulai"
                  android:textSize="12sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#10B981"
                  android:minWidth="0dp"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp" />

              <Button
                  android:id="@+id/btnFloatingClose"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="8dp"
                  android:text="✕"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#EF4444"
                  android:minWidth="0dp"
                  android:padding="0dp" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <!-- Header -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="AutoKlik Trans"
                      android:textColor="#10B981"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="Pengontrol Klik Otomatis &amp; Multi-Touch"
                      android:textColor="#94A3B8"
                      android:textSize="14sp" />

                  <!-- Card Izin 1: Aksesibilitas -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="1. Layanan Aksesibilitas (Wajib)"
                          android:textColor="#F8FAFC"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtAccessibilityStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="Status: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Diperlukan agar aplikasi bisa mengetuk &amp; mengusap layar otomatis."
                          android:textColor="#94A3B8"
                          android:textSize="12sp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="💡 Tips Redmi/HyperOS: Buka Pengaturan Tambahan > Aksesibilitas > Aplikasi Terunduh > Aktifkan AutoKlik"
                          android:textColor="#38BDF8"
                          android:textSize="11sp" />

                      <Button
                          android:id="@+id/btnAccessibility"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:backgroundTint="#334155"
                          android:text="⚙️ Buka Pengaturan Aksesibilitas"
                          android:textColor="#F8FAFC" />
                  </LinearLayout>

                  <!-- Card Izin 2: Jendela Mengapung / Overlay -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="2. Izin Jendela Mengapung (Overlay)"
                          android:textColor="#F8FAFC"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtOverlayStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="Status: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Diperlukan agar panel tombol Play/Pause melayang di atas aplikasi lain."
                          android:textColor="#94A3B8"
                          android:textSize="12sp" />

                      <Button
                          android:id="@+id/btnOverlay"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:backgroundTint="#334155"
                          android:text="🔓 Izinkan Jendela Mengapung"
                          android:textColor="#F8FAFC" />
                  </LinearLayout>

                  <!-- Tombol Aksi Utama -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:orientation="vertical">

                      <Button
                          android:id="@+id/btnStartFloating"
                          android:layout_width="match_parent"
                          android:layout_height="52dp"
                          android:backgroundTint="#10B981"
                          android:text="▶ TAMPILKAN PANEL MELAYANG"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/btnStopFloating"
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:layout_marginTop="8dp"
                          android:backgroundTint="#EF4444"
                          android:text="⏹ TUTUP PANEL MELAYANG"
                          android:textColor="#FFFFFF"
                          android:textSize="14sp" />
                  </LinearLayout>

                  <!-- Ringkasan Fitur Aktif -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Fitur AutoKlik Aktif:"
                          android:textColor="#10B981"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="✔ Multi-Touch Gestures (Tap, Swipe Up, Swipe Down, Paste)"
                          android:textColor="#CBD5E1"
                          android:textSize="12sp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="3dp"
                          android:text="✔ Jeda Acak Anti-Deteksi (Interval Jitter +/- 15%)"
                          android:textColor="#CBD5E1"
                          android:textSize="12sp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="3dp"
                          android:text="✔ Auto-Tap Fokus sebelum Paste Teks"
                          android:textColor="#CBD5E1"
                          android:textSize="12sp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="3dp"
                          android:text="✔ Sub-Loop Khusus: Titik 10 loop kembali ke Titik 7"
                          android:textColor="#CBD5E1"
                          android:textSize="12sp" />
