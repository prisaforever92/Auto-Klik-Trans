              private fun saveNamedConfiguration(configName: String) {
                  try {
                      reindexTargetPoints()
                      val pointsArray = JSONArray()
                      for (p in targetPoints) {
                          val obj = JSONObject().apply {
                              put("order", p.order)
                              put("x", p.params.x)
                              put("y", p.params.y)
                              put("type", p.type)
                              put("delayValue", p.delayValue)
                              put("delayUnit", p.delayUnit)
                              put("delayMs", p.delayMs)
                              put("swipeDistancePx", p.swipeDistancePx.toDouble())
                              put("jumpEnabled", p.jumpEnabled)
                              put("jumpToPoint", p.jumpToPoint)
                              put("jumpAfterCycle", p.jumpAfterCycle)
                              put("pasteText", p.pasteText)
                              put("autoTapPaste", p.autoTapPaste)
                              put("keyDelayMs", p.keyDelayMs)
                              put("keyX", p.keyParams?.x ?: p.savedKeyX)
                              put("keyY", p.keyParams?.y ?: p.savedKeyY)
                          }
                          pointsArray.put(obj)
                      }

                      val profileObj = JSONObject().apply {
                          put("name", configName)
                          put("size_percent", currentSizePercent)
                          put("points", pointsArray)
                          put("saved_at", System.currentTimeMillis())
                      }

                      val profilePrefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE).edit()
                      profilePrefs.putString(configName, profileObj.toString())
                      profilePrefs.apply()

                      val configPrefs = getSharedPreferences("autoklik_saved_config", Context.MODE_PRIVATE).edit()
                      configPrefs.putString("last_saved_name", configName)
                      configPrefs.putInt("size_percent", currentSizePercent)
                      configPrefs.apply()

                      currentLoadedConfigName = configName
                      Toast.makeText(this, "💾 Konfigurasi '$configName' (${targetPoints.size} titik) berhasil disimpan!", Toast.LENGTH_LONG).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Gagal menyimpan: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

