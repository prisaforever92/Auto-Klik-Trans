                              textSize = 11f
                              setTextColor(Color.WHITE)
                              backgroundTintList = android.content.res.ColorStateList.valueOf(Color.parseColor("#DC2626"))
                              minWidth = 0
                              setPadding(0, 0, 0, 0)
                              layoutParams = LinearLayout.LayoutParams(
                                  (34 * density).toInt(),
                                  (34 * density).toInt()
                              )
                              setOnClickListener {
                                  prefs.edit().remove(name).apply()
                                  Toast.makeText(this@FloatingOverlayService, "Konfigurasi '$name' dihapus", Toast.LENGTH_SHORT).show()
                                  showLoadConfigDialog()
