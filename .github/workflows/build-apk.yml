name: Build Android AutoKlik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoKlik Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate Android Scaffolding & Fix Resources
        run: |
          cat << 'EOF' > gradle.properties
android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoKlik"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
          }
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
<resources>
              <string name="app_name">AutoKlik Trans</string>
              <string name="accessibility_desc">Layanan Aksesibilitas AutoKlik untuk simulasi sentuhan dan multi-gesture tanpa root.</string>
          </resources>
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
<resources>
              <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:windowBackground">#0F172A</item>
              </style>
          </resources>
          EOF

          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/bg_target_point.xml
<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#E60F172A" />
              <stroke android:width="2.5dp" android:color="#10B981" />
          </shape>
          EOF

          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/bg_panel_pill.xml
<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F20F172A" />
              <corners android:radius="24dp" />
              <stroke android:width="1.5dp" android:color="#334155" />
          </shape>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_target_point.xml
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="wrap_content"
    android:layout_height="wrap_content"
    android:orientation="vertical"
    android:gravity="center_horizontal">

    <!-- Garis Panah Atas (Swipe Up) -->
    <LinearLayout
        android:id="@+id/layoutArrowUp"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:gravity="center_horizontal"
        android:visibility="gone">

        <TextView
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="▲"
            android:textColor="#38BDF8"
            android:textSize="14sp"
            android:textStyle="bold" />

        <View
            android:id="@+id/viewLineUp"
            android:layout_width="3dp"
            android:layout_height="60dp"
            android:background="#38BDF8" />

        <TextView
            android:id="@+id/tvSwipeDistUp"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="▲ 450px"
            android:textColor="#38BDF8"
            android:textSize="10sp"
            android:background="#D90F172A"
            android:paddingStart="4dp"
            android:paddingEnd="4dp" />
    </LinearLayout>

    <!-- Lingkaran Titik Target Utama (Bulat Sempurna 1:1) -->
    <FrameLayout
        android:id="@+id/pointRoot"
        android:layout_width="30dp"
        android:layout_height="30dp"
        android:background="@drawable/bg_target_point">

        <TextView
            android:id="@+id/tvTargetNumber"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:layout_gravity="center"
            android:includeFontPadding="false"
            android:text="1"
            android:textColor="#FFFFFF"
            android:textSize="14sp"
            android:textStyle="bold" />

        <TextView
            android:id="@+id/tvTargetType"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:layout_gravity="bottom|center_horizontal"
            android:layout_marginBottom="1dp"
            android:includeFontPadding="false"
            android:text="🎯"
            android:textSize="8sp" />
    </FrameLayout>

    <!-- Garis Panah Bawah (Swipe Down) -->
    <LinearLayout
        android:id="@+id/layoutArrowDown"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:gravity="center_horizontal"
        android:visibility="gone">

        <TextView
            android:id="@+id/tvSwipeDistDown"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="▼ 450px"
            android:textColor="#F59E0B"
            android:textSize="10sp"
            android:background="#D90F172A"
            android:paddingStart="4dp"
            android:paddingEnd="4dp" />

        <View
            android:id="@+id/viewLineDown"
            android:layout_width="3dp"
            android:layout_height="60dp"
            android:background="#F59E0B" />

        <TextView
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="▼"
            android:textColor="#F59E0B"
            android:textSize="14sp"
            android:textStyle="bold" />
    </LinearLayout>
</LinearLayout>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_point_dialog.xml
<?xml version="1.0" encoding="utf-8"?>
<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="320dp"
    android:layout_height="wrap_content"
    android:background="@drawable/bg_panel_pill"
    android:padding="16dp">

    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical">

        <TextView
            android:id="@+id/tvDialogTitle"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="Pengaturan Titik #1"
            android:textColor="#10B981"
            android:textSize="16sp"
            android:textStyle="bold" />

        <!-- PILIHAN TIPE GERAKAN (FITUR 1 & 13) -->
        <TextView
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:layout_marginTop="8dp"
            android:text="Pilih Tipe Gerakan:"
            android:textColor="#CBD5E1"
            android:textSize="12sp"
            android:textStyle="bold" />

        <RadioGroup
            android:id="@+id/rgPointType"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:layout_marginTop="2dp">

            <RadioButton
                android:id="@+id/rbTypeTap"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="🎯 Tap (Sentuh Titik)"
                android:textColor="#F8FAFC"
                android:textSize="12sp"
                android:checked="true" />

            <RadioButton
                android:id="@+id/rbTypeSwipeUp"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="▲ Swipe Up (Garis Panah ke Atas)"
                android:textColor="#38BDF8"
                android:textSize="12sp" />

            <RadioButton
                android:id="@+id/rbTypeSwipeDown"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="▼ Swipe Down (Garis Panah ke Bawah)"
                android:textColor="#F59E0B"
                android:textSize="12sp" />

            <RadioButton
                android:id="@+id/rbTypePaste"
                android:layout_width="wrap_content"
                android:layout_height="32dp"
                android:text="📋 Paste (Tempel Teks)"
                android:textColor="#F8FAFC"
                android:textSize="12sp" />
        </RadioGroup>

        <!-- FITUR 1: PENGATURAN PANJANG GARIS SWIPE -->
        <LinearLayout
            android:id="@+id/layoutSwipeSettings"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:layout_marginTop="4dp"
            android:visibility="gone">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Panjang Garis / Jarak Usap (Piksel):"
                android:textColor="#CBD5E1"
                android:textSize="11sp" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical"
                android:layout_marginTop="3dp">

                <EditText
                    android:id="@+id/etSwipeDistance"
                    android:layout_width="80dp"
                    android:layout_height="36dp"
                    android:background="#1E293B"
                    android:gravity="center"
                    android:inputType="number"
                    android:text="450"
                    android:textColor="#38BDF8"
                    android:textSize="12sp" />

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginStart="8dp"
                    android:text="(Contoh: 200 = Pendek, 450 = Sedang, 800 = Panjang)"
                    android:textColor="#94A3B8"
                    android:textSize="10sp" />
            </LinearLayout>
        </LinearLayout>

        <!-- FITUR 4: PILIHAN JEDA (MILISEKON / DETIK) -->
        <View
            android:layout_width="match_parent"
            android:layout_height="1dp"
            android:layout_marginTop="8dp"
            android:layout_marginBottom="6dp"
            android:background="#334155" />

        <TextView
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="Jeda Setelah Titik Ini:"
            android:textColor="#CBD5E1"
            android:textSize="11sp"
            android:textStyle="bold" />

        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:layout_marginTop="3dp"
            android:orientation="horizontal"
            android:gravity="center_vertical">

            <EditText
                android:id="@+id/etDialogDelay"
                android:layout_width="90dp"
                android:layout_height="36dp"
                android:background="#1E293B"
                android:gravity="center"
                android:inputType="numberDecimal"
                android:text="500"
                android:textColor="#10B981"
                android:textSize="13sp" />

            <!-- Pilihan Unit Jeda (ms / s) -->
            <RadioGroup
                android:id="@+id/rgDelayUnit"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginStart="8dp"
                android:orientation="horizontal">

                <RadioButton
                    android:id="@+id/rbUnitMs"
                    android:layout_width="wrap_content"
                    android:layout_height="32dp"
                    android:text="ms (Milisekon)"
                    android:textColor="#F8FAFC"
                    android:textSize="11sp"
                    android:checked="true" />

                <RadioButton
                    android:id="@+id/rbUnitSec"
                    android:layout_width="wrap_content"
                    android:layout_height="32dp"
                    android:layout_marginStart="4dp"
                    android:text="detik (s)"
                    android:textColor="#F8FAFC"
                    android:textSize="11sp" />
            </RadioGroup>
        </LinearLayout>

        <!-- FITUR 2: SUB-LOOP PADA TITIK -->
        <View
            android:layout_width="match_parent"
            android:layout_height="1dp"
            android:layout_marginTop="8dp"
            android:layout_marginBottom="6dp"
            android:background="#334155" />

        <CheckBox
            android:id="@+id/cbPointSubLoop"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="Lompat Balik (Sub-Loop) di Titik Ini"
            android:textColor="#38BDF8"
            android:textSize="12sp"
            android:textStyle="bold" />

        <LinearLayout
            android:id="@+id/layoutPointSubLoopFields"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="horizontal"
            android:gravity="center_vertical"
            android:layout_marginTop="2dp"
            android:visibility="gone">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Lompat ke Titik: "
                android:textColor="#CBD5E1"
                android:textSize="11sp" />

            <EditText
                android:id="@+id/etPointJumpTo"
                android:layout_width="48dp"
                android:layout_height="34dp"
                android:background="#1E293B"
                android:gravity="center"
                android:inputType="number"
                android:text="7"
                android:textColor="#10B981"
                android:textSize="12sp" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginStart="8dp"
                android:text="Setelah Siklus: "
                android:textColor="#CBD5E1"
                android:textSize="11sp" />

            <EditText
                android:id="@+id/etPointJumpCycle"
                android:layout_width="40dp"
                android:layout_height="34dp"
                android:background="#1E293B"
                android:gravity="center"
                android:inputType="number"
                android:text="1"
                android:textColor="#10B981"
                android:textSize="12sp" />
        </LinearLayout>

        <!-- FIELD TEKS PASTE -->
        <LinearLayout
            android:id="@+id/layoutDialogPasteFields"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:visibility="gone">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="6dp"
                android:text="Teks untuk Ditempel (Ketik via Keyboard):"
                android:textColor="#CBD5E1"
                android:textSize="11sp" />

            <EditText
                android:id="@+id/etDialogPasteText"
                android:layout_width="match_parent"
                android:layout_height="38dp"
                android:layout_marginTop="2dp"
                android:background="#1E293B"
                android:hint="Ketik teks pesan..."
                android:padding="6dp"
                android:textColor="#F8FAFC"
                android:textColorHint="#64748B"
                android:textSize="12sp" />

            <CheckBox
                android:id="@+id/cbDialogAutoTap"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Auto-Tap fokus sebelum paste"
                android:textColor="#CBD5E1"
                android:textSize="11sp"
                android:checked="true" />
        </LinearLayout>

        <!-- TOMBOL SIMPAN & TUTUP -->
        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:layout_marginTop="14dp"
            android:orientation="horizontal">

            <Button
                android:id="@+id/btnDialogSave"
                android:layout_width="0dp"
                android:layout_height="38dp"
                android:layout_weight="1"
                android:backgroundTint="#10B981"
                android:text="Simpan"
                android:textColor="#FFFFFF"
                android:textSize="12sp" />

            <Button
                android:id="@+id/btnDialogClose"
                android:layout_width="0dp"
                android:layout_height="38dp"
                android:layout_marginStart="6dp"
                android:layout_weight="1"
                android:backgroundTint="#475569"
                android:text="Batal"
                android:textColor="#FFFFFF"
                android:textSize="12sp" />
        </LinearLayout>

    </LinearLayout>
</ScrollView>
          EOF

          mkdir -p app/src/main/res/layout
          cat << 'EOF' > app/src/main/res/layout/layout_floating_widget.xml
<?xml version="1.0" encoding="utf-8"?>
<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="wrap_content"
    android:layout_height="wrap_content">

    <!-- TOOLBAR LENGKAP SAAT IDLE -->
    <LinearLayout
        android:id="@+id/layoutFullToolbar"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:background="@drawable/bg_panel_pill"
        android:gravity="center_vertical"
        android:padding="5dp">

        <TextView
            android:id="@+id/tvDragHandle"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="⠿"
            android:textColor="#94A3B8"
            android:textSize="17sp"
            android:paddingStart="4dp"
            android:paddingEnd="4dp" />

        <!-- Tombol Play / Mulai -->
        <Button
            android:id="@+id/btnFloatingPlay"
            android:layout_width="wrap_content"
            android:layout_height="36dp"
            android:text="▶ Mulai"
            android:textSize="12sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#10B981"
            android:minWidth="0dp"
            android:paddingStart="8dp"
            android:paddingEnd="8dp" />

        <!-- Tombol Tambah Titik (+) -->
        <Button
            android:id="@+id/btnFloatingAdd"
            android:layout_width="36dp"
            android:layout_height="36dp"
            android:layout_marginStart="4dp"
            android:text="➕"
            android:textSize="13sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#0284C7"
            android:minWidth="0dp"
            android:padding="0dp" />

        <!-- Tombol Kurangi Titik (-) -->
        <Button
            android:id="@+id/btnFloatingRemove"
            android:layout_width="36dp"
            android:layout_height="36dp"
            android:layout_marginStart="3dp"
            android:text="➖"
            android:textSize="13sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#D97706"
            android:minWidth="0dp"
            android:padding="0dp" />

        <!-- Tombol Minimize / Sembunyikan Titik (👁️) -->
        <Button
            android:id="@+id/btnFloatingVisibility"
            android:layout_width="36dp"
            android:layout_height="36dp"
            android:layout_marginStart="3dp"
            android:text="👁️"
            android:textSize="13sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#475569"
            android:minWidth="0dp"
            android:padding="0dp" />

        <!-- FITUR 2: PENGATUR UKURAN PERSENTASE 0-100% (20dp-40dp) (📐) -->
        <Button
            android:id="@+id/btnFloatingSize"
            android:layout_width="36dp"
            android:layout_height="36dp"
            android:layout_marginStart="3dp"
            android:text="📐"
            android:textSize="13sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#0D9488"
            android:minWidth="0dp"
            android:padding="0dp" />

        <!-- FITUR 3: TOMBOL SAVE KONFIGURASI PADA PANEL MELAYANG (💾) -->
        <Button
            android:id="@+id/btnFloatingSave"
            android:layout_width="36dp"
            android:layout_height="36dp"
            android:layout_marginStart="3dp"
            android:text="💾"
            android:textSize="13sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#059669"
            android:minWidth="0dp"
            android:padding="0dp" />

        <!-- Tombol Pengaturan (⚙) -->
        <Button
            android:id="@+id/btnFloatingSettings"
            android:layout_width="36dp"
            android:layout_height="36dp"
            android:layout_marginStart="3dp"
            android:text="⚙"
            android:textSize="13sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#7C3AED"
            android:minWidth="0dp"
            android:padding="0dp" />

        <!-- Tombol Tutup (✕) -->
        <Button
            android:id="@+id/btnFloatingClose"
            android:layout_width="36dp"
            android:layout_height="36dp"
            android:layout_marginStart="3dp"
            android:text="✕"
            android:textSize="13sp"
            android:textColor="#FFFFFF"
            android:backgroundTint="#EF4444"
            android:minWidth="0dp"
            android:padding="0dp" />

    </LinearLayout>

    <!-- PANEL MELAYANG MENGECIL SAAT PLAY (HANYA TOMBOL STOP) -->
    <LinearLayout
        android:id="@+id/layoutMiniToolbar"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:background="@drawable/bg_panel_pill"
        android:gravity="center_vertical"
        android:padding="5dp"
        android:visibility="gone">

        <TextView
            android:id="@+id/tvMiniDragHandle"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="⠿"
            android:textColor="#94A3B8"
            android:textSize="17sp"
            android:paddingStart="4dp"
            android:paddingEnd="4dp" />

        <!-- Tombol STOP Tunggal Saat Berjalan -->
        <Button
            android:id="@+id/btnFloatingMiniStop"
            android:layout_width="wrap_content"
            android:layout_height="36dp"
            android:text="⏹ STOP"
            android:textSize="12sp"
            android:textStyle="bold"
            android:textColor="#FFFFFF"
            android:backgroundTint="#EF4444"
            android:minWidth="0dp"
            android:paddingStart="12dp"
            android:paddingEnd="12dp" />

    </LinearLayout>

</FrameLayout>
