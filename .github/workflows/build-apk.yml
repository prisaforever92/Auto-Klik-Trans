name: Build Android AutoKlik APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoKlik Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-generate Android Scaffolding & Fix Resources
        run: |
          # 1. Enable AndroidX in gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoKlik"
          include ':app'
          EOF

          # 3. build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
          }
          EOF

          # 4. Strings & Themes
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AutoKlik Trans</string>
              <string name="accessibility_desc">Layanan Aksesibilitas AutoKlik untuk simulasi sentuhan dan multi-gesture tanpa root.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Material3.DayNight.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:windowBackground">#0F172A</item>
              </style>
          </resources>
          EOF

          # 5. Accessibility Service Config XML
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          # 6. Icons & Vector Drawables & Shape Target Point
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M30,30h48v48h-48z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#CC0F172A" />
              <stroke android:width="3dp" android:color="#10B981" />
          </shape>
          EOF

          # 7. Layouts: layout_target_point.xml, layout_floating_widget.xml & activity_main.xml
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > app/src/main/res/layout/layout_target_point.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="48dp"
              android:layout_height="48dp"
              android:background="@drawable/bg_target_point">

              <TextView
                  android:id="@+id/tvTargetNumber"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="1"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold" />

              <View
                  android:layout_width="4dp"
                  android:layout_height="4dp"
                  android:layout_gravity="center"
                  android:background="#EF4444" />
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/layout_floating_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:background="#F00F172A"
              android:gravity="center_vertical"
              android:padding="6dp">

              <!-- Handle Geser Widget -->
              <TextView
                  android:id="@+id/tvDragHandle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="⠿"
                  android:textColor="#94A3B8"
                  android:textSize="18sp"
                  android:paddingStart="4dp"
                  android:paddingEnd="6dp" />

              <!-- Tombol Play / Pause -->
              <Button
                  android:id="@+id/btnFloatingPlay"
                  android:layout_width="wrap_content"
                  android:layout_height="38dp"
                  android:text="▶ Mulai"
                  android:textSize="12sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#10B981"
                  android:minWidth="0dp"
                  android:paddingStart="10dp"
                  android:paddingEnd="10dp" />

              <!-- Tombol Tambah Titik (+) -->
              <Button
                  android:id="@+id/btnFloatingAdd"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="➕"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#0284C7"
                  android:minWidth="0dp"
                  android:padding="0dp" />

              <!-- Tombol Kurangi Titik (-) -->
              <Button
                  android:id="@+id/btnFloatingRemove"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="➖"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#D97706"
                  android:minWidth="0dp"
                  android:padding="0dp" />

              <!-- Tombol Pengaturan (⚙) -->
              <Button
                  android:id="@+id/btnFloatingSettings"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="⚙"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#7C3AED"
                  android:minWidth="0dp"
                  android:padding="0dp" />

              <!-- Tombol Tutup (✕) -->
              <Button
                  android:id="@+id/btnFloatingClose"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:layout_marginStart="4dp"
                  android:text="✕"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:backgroundTint="#EF4444"
                  android:minWidth="0dp"
                  android:padding="0dp" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F172A"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <!-- Header -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="AutoKlik Trans"
                      android:textColor="#10B981"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:text="Konfigurasi Fitur &amp; Panel Kontrol"
                      android:textColor="#94A3B8"
                      android:textSize="14sp" />

                  <!-- Card Izin 1: Aksesibilitas -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="1. Layanan Aksesibilitas (Wajib)"
                          android:textColor="#F8FAFC"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtAccessibilityStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Status: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/btnAccessibility"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:backgroundTint="#334155"
                          android:text="⚙️ Buka Pengaturan Aksesibilitas"
                          android:textColor="#F8FAFC" />
                  </LinearLayout>

                  <!-- Card Izin 2: Jendela Mengapung / Overlay -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="2. Izin Jendela Mengapung (Overlay)"
                          android:textColor="#F8FAFC"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/txtOverlayStatus"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:text="Status: Memeriksa..."
                          android:textColor="#EF4444"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <Button
                          android:id="@+id/btnOverlay"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:backgroundTint="#334155"
                          android:text="🔓 Izinkan Jendela Mengapung"
                          android:textColor="#F8FAFC" />
                  </LinearLayout>

                  <!-- Tombol Luncurkan Panel Melayang -->
                  <Button
                      android:id="@+id/btnStartFloating"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:layout_marginTop="14dp"
                      android:backgroundTint="#10B981"
                      android:text="▶ TAMPILKAN PANEL MELAYANG"
                      android:textColor="#FFFFFF"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <!-- FORM PENGATURAN FITUR AUTOKLIK -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="PENGATURAN SKRIP &amp; FITUR"
                      android:textColor="#10B981"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <!-- Fitur 1: Sub-Loop Jumpback -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <CheckBox
                          android:id="@+id/cbSubLoop"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Aktifkan Sub-Loop Siklus (Loop Balik)"
                          android:textColor="#F8FAFC"
                          android:textStyle="bold"
                          android:checked="true" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Contoh: Titik 10 loop kembali ke Titik 7 setelah Siklus 1"
                          android:textColor="#94A3B8"
                          android:textSize="12sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Dari Titik Akhir: "
                              android:textColor="#CBD5E1"
                              android:textSize="12sp" />

                          <EditText
                              android:id="@+id/etSubLoopEnd"
                              android:layout_width="60dp"
                              android:layout_height="40dp"
                              android:background="#0F172A"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="10"
                              android:textColor="#10B981"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="10dp"
                              android:text="Ke Titik Awal: "
                              android:textColor="#CBD5E1"
                              android:textSize="12sp" />

                          <EditText
                              android:id="@+id/etSubLoopStart"
                              android:layout_width="60dp"
                              android:layout_height="40dp"
                              android:background="#0F172A"
                              android:gravity="center"
                              android:inputType="number"
                              android:text="7"
                              android:textColor="#10B981"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Fitur 2: Anti-Deteksi Jeda Acak -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <CheckBox
                          android:id="@+id/cbJitter"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Anti-Deteksi: Jeda Acak (Jitter +/- 15%)"
                          android:textColor="#F8FAFC"
                          android:textStyle="bold"
                          android:checked="true" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Membuat pola sentuhan natural seperti jari manusia asli agar tidak terbaca bot."
                          android:textColor="#94A3B8"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <!-- Fitur 3: Custom Paste & Auto-Tap -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:background="#1E293B"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Fitur Auto-Paste Teks:"
                          android:textColor="#F8FAFC"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <EditText
                          android:id="@+id/etPasteText"
                          android:layout_width="match_parent"
                          android:layout_height="44dp"
                          android:layout_marginTop="6dp"
                          android:background="#0F172A"
                          android:hint="Teks untuk ditempel otomatis"
                          android:padding="8dp"
                          android:text="AutoKlik Trans"
                          android:textColor="#F8FAFC"
                          android:textColorHint="#64748B"
                          android:textSize="13sp" />

                      <CheckBox
                          android:id="@+id/cbAutoTapPaste"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="Auto-Tap Kolom Sebelum Paste (Fokus Kursor)"
                          android:textColor="#CBD5E1"
                          android:checked="true" />
                  </LinearLayout>

                  <!-- Fitur 4: Jeda & Durasi Sentuh -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:background="#1E293B"
                      android:orientation="horizontal"
                      android:padding="14dp">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Jeda Antar Klik (ms)"
                              android:textColor="#CBD5E1"
                              android:textSize="12sp" />

                          <EditText
                              android:id="@+id/etInterval"
                              android:layout_width="match_parent"
                              android:layout_height="40dp"
                              android:layout_marginTop="4dp"
                              android:background="#0F172A"
                              android:inputType="number"
                              android:padding="6dp"
                              android:text="500"
                              android:textColor="#10B981"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="10dp"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Durasi Tekan (ms)"
                              android:textColor="#CBD5E1"
                              android:textSize="12sp" />

                          <EditText
                              android:id="@+id/etDuration"
                              android:layout_width="match_parent"
                              android:layout_height="40dp"
                              android:layout_marginTop="4dp"
                              android:background="#0F172A"
                              android:inputType="number"
                              android:padding="6dp"
                              android:text="50"
                              android:textColor="#10B981"
                              android:textStyle="bold" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Tombol Simpan Pengaturan -->
                  <Button
                      android:id="@+id/btnSaveSettings"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_marginTop="14dp"
                      android:backgroundTint="#3B82F6"
                      android:text="💾 SIMPAN PENGATURAN SKRIP"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <!-- Tombol Tutup Panel Melayang -->
                  <Button
                      android:id="@+id/btnStopFloating"
                      android:layout_width="match_parent"
                      android:layout_height="44dp"
                      android:layout_marginTop="10dp"
                      android:backgroundTint="#EF4444"
                      android:text="⏹ TUTUP PANEL MELAYANG"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp" />

              </LinearLayout>
          </ScrollView>
          EOF

          # 8. Source Code: MainActivity.kt
          mkdir -p app/src/main/java/com/autoklik/android/ui
          cat << 'EOF' > app/src/main/java/com/autoklik/android/ui/MainActivity.kt
          package com.autoklik.android.ui

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.autoklik.android.R
          import com.autoklik.android.service.AutoClickAccessibilityService
          import com.autoklik.android.service.FloatingOverlayService

          class MainActivity : AppCompatActivity() {

              private lateinit var txtAccessibilityStatus: TextView
              private lateinit var txtOverlayStatus: TextView
              private lateinit var btnAccessibility: Button
              private lateinit var btnOverlay: Button
              private lateinit var btnStartFloating: Button
              private lateinit var btnStopFloating: Button

              private lateinit var cbSubLoop: CheckBox
              private lateinit var etSubLoopStart: EditText
              private lateinit var etSubLoopEnd: EditText
              private lateinit var cbJitter: CheckBox
              private lateinit var etPasteText: EditText
              private lateinit var cbAutoTapPaste: CheckBox
              private lateinit var etInterval: EditText
              private lateinit var etDuration: EditText
              private lateinit var btnSaveSettings: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  txtAccessibilityStatus = findViewById(R.id.txtAccessibilityStatus)
                  txtOverlayStatus = findViewById(R.id.txtOverlayStatus)
                  btnAccessibility = findViewById(R.id.btnAccessibility)
                  btnOverlay = findViewById(R.id.btnOverlay)
                  btnStartFloating = findViewById(R.id.btnStartFloating)
                  btnStopFloating = findViewById(R.id.btnStopFloating)

                  cbSubLoop = findViewById(R.id.cbSubLoop)
                  etSubLoopStart = findViewById(R.id.etSubLoopStart)
                  etSubLoopEnd = findViewById(R.id.etSubLoopEnd)
                  cbJitter = findViewById(R.id.cbJitter)
                  etPasteText = findViewById(R.id.etPasteText)
                  cbAutoTapPaste = findViewById(R.id.cbAutoTapPaste)
                  etInterval = findViewById(R.id.etInterval)
                  etDuration = findViewById(R.id.etDuration)
                  btnSaveSettings = findViewById(R.id.btnSaveSettings)

                  loadSettings()

                  btnSaveSettings.setOnClickListener {
                      saveSettings()
                      Toast.makeText(this, "Pengaturan Fitur Berhasil Disimpan! ✔", Toast.LENGTH_SHORT).show()
                  }

                  btnAccessibility.setOnClickListener {
                      try {
                          val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          startActivity(intent)
                          Toast.makeText(this, "Buka Aplikasi Terunduh > Aktifkan AutoKlik", Toast.LENGTH_LONG).show()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Buka Pengaturan Aksesibilitas di HP Anda", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnOverlay.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          try {
                              val intent = Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                              startActivity(intent)
                          } catch (e: Exception) {
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION)
                              startActivity(intent)
                          }
                      } else {
                          Toast.makeText(this, "Izin overlay otomatis aktif pada versi ini", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnStartFloating.setOnClickListener {
                      saveSettings()

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Harap izinkan Jendela Mengapung terlebih dahulu", Toast.LENGTH_LONG).show()
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          startActivity(intent)
                          return@setOnClickListener
                      }

                      if (!isAccessibilityServiceEnabled()) {
                          Toast.makeText(this, "Harap aktifkan Layanan Aksesibilitas AutoKlik!", Toast.LENGTH_LONG).show()
                          val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          startActivity(intent)
                          return@setOnClickListener
                      }

                      val intent = Intent(this, FloatingOverlayService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      Toast.makeText(this, "Panel Melayang Aktif! Tekan ➕ untuk tambah titik target.", Toast.LENGTH_LONG).show()
                      moveTaskToBack(true)
                  }

                  btnStopFloating.setOnClickListener {
                      val intent = Intent(this, FloatingOverlayService::class.java)
                      stopService(intent)
                      Toast.makeText(this, "Panel Melayang Ditutup", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun loadSettings() {
                  val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE)
                  cbSubLoop.isChecked = prefs.getBoolean("subloop_enabled", true)
                  etSubLoopStart.setText(prefs.getInt("subloop_start", 7).toString())
                  etSubLoopEnd.setText(prefs.getInt("subloop_end", 10).toString())
                  cbJitter.isChecked = prefs.getBoolean("jitter_enabled", true)
                  etPasteText.setText(prefs.getString("paste_text", "AutoKlik Trans"))
                  cbAutoTapPaste.isChecked = prefs.getBoolean("auto_tap_paste", true)
                  etInterval.setText(prefs.getLong("click_interval_ms", 500L).toString())
                  etDuration.setText(prefs.getLong("click_duration_ms", 50L).toString())
              }

              private fun saveSettings() {
                  val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE).edit()
                  prefs.putBoolean("subloop_enabled", cbSubLoop.isChecked)
                  prefs.putInt("subloop_start", etSubLoopStart.text.toString().toIntOrNull() ?: 7)
                  prefs.putInt("subloop_end", etSubLoopEnd.text.toString().toIntOrNull() ?: 10)
                  prefs.putBoolean("jitter_enabled", cbJitter.isChecked)
                  prefs.putString("paste_text", etPasteText.text.toString())
                  prefs.putBoolean("auto_tap_paste", cbAutoTapPaste.isChecked)
                  prefs.putLong("click_interval_ms", etInterval.text.toString().toLongOrNull() ?: 500L)
                  prefs.putLong("click_duration_ms", etDuration.text.toString().toLongOrNull() ?: 50L)
                  prefs.apply()
              }

              override fun onResume() {
                  super.onResume()
                  updatePermissionStatus()
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  try {
                      val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as AccessibilityManager
                      val enabledServices = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                      for (service in enabledServices) {
                          if (service.resolveInfo.serviceInfo.packageName == packageName) {
                              return true
                          }
                      }
                  } catch (e: Exception) {}
                  return AutoClickAccessibilityService.instance != null
              }

              private fun updatePermissionStatus() {
                  val isA11y = isAccessibilityServiceEnabled()
                  if (isA11y) {
                      txtAccessibilityStatus.text = "Status: 🟢 AKTIF (Siap Klik Otomatis)"
                      txtAccessibilityStatus.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtAccessibilityStatus.text = "Status: 🔴 NONAKTIF (Harap Aktifkan)"
                      txtAccessibilityStatus.setTextColor(Color.parseColor("#EF4444"))
                  }

                  val isOverlay = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else {
                      true
                  }
                  if (isOverlay) {
                      txtOverlayStatus.text = "Status: 🟢 SUDAH DIIZINKAN"
                      txtOverlayStatus.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtOverlayStatus.text = "Status: 🔴 BELUM DIIZINKAN (Wajib)"
                      txtOverlayStatus.setTextColor(Color.parseColor("#EF4444"))
                  }
              }
          }
          EOF

          # 9. Source Code: AutoClickAccessibilityService.kt
          mkdir -p app/src/main/java/com/autoklik/android/service
          cat << 'EOF' > app/src/main/java/com/autoklik/android/service/AutoClickAccessibilityService.kt
          package com.autoklik.android.service

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Path
          import android.os.Build
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import androidx.annotation.RequiresApi
          import kotlinx.coroutines.*

          class AutoClickAccessibilityService : AccessibilityService() {

              private val serviceScope = CoroutineScope(Dispatchers.Default + SupervisorJob())

              companion object {
                  var instance: AutoClickAccessibilityService? = null
                      private set
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  instance = null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  serviceScope.cancel()
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executeTap(x: Float, y: Float, durationMs: Long = 50L, callback: (() -> Unit)? = null) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()

                  dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          callback?.invoke()
                      }
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          callback?.invoke()
                      }
                  }, null)
              }

              @RequiresApi(Build.VERSION_CODES.N)
              fun executeSwipe(
                  startX: Float,
                  startY: Float,
                  endX: Float,
                  endY: Float,
                  durationMs: Long = 300L,
                  callback: (() -> Unit)? = null
              ) {
                  val path = Path().apply {
                      moveTo(startX, startY)
                      lineTo(endX, endY)
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()

                  dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          callback?.invoke()
                      }
                  }, null)
              }

              fun executePaste(
                  x: Float,
                  y: Float,
                  textToPaste: String,
                  autoTapToFocus: Boolean = true,
                  callback: (() -> Unit)? = null
              ) {
                  val performPaste = {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = ClipData.newPlainText("AutoKlikPaste", textToPaste)
                      clipboard.setPrimaryClip(clip)

                      val rootNode = rootInActiveWindow
                      val focusedNode = rootNode?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)

                      if (focusedNode != null && focusedNode.isEditable) {
                          val arguments = Bundle().apply {
                              putCharSequence(
                                  AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                                  textToPaste
                              )
                          }
                          focusedNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, arguments)
                          focusedNode.recycle()
                      }
                      rootNode?.recycle()
                      callback?.invoke()
                  }

                  if (autoTapToFocus) {
                      executeTap(x, y, 50L) {
                          serviceScope.launch {
                              delay(80)
                              performPaste()
                          }
                      }
                  } else {
                      performPaste()
                  }
              }
          }
