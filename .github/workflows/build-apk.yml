              // Saat menggeser 1 titik, titik lainnya otomatis dibuat tembus sentuhan agar tidak saling klik
              private fun setOtherPointsTouchable(activeOrder: Int, touchable: Boolean) {
                  if (isPlaying || isPointsLocked) return
                  val flags = if (touchable) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  for (p in targetPoints) {
                      if (p.order == activeOrder) continue
                      p.params.flags = flags
                      try {
                          windowManager.updateViewLayout(p.view, p.params)
                      } catch (e: Exception) {}

                      val hView = p.swipeHandleView
                      val hParams = p.swipeHandleParams
                      if (hView != null && hParams != null) {
                          hParams.flags = flags
                          try {
                              windowManager.updateViewLayout(hView, hParams)
                          } catch (e: Exception) {}
                      }

                      val kView = p.keyView
                      val kParams = p.keyParams
                      if (kView != null && kParams != null) {
                          kParams.flags = flags
                          try {
                              windowManager.updateViewLayout(kView, kParams)
                          } catch (e: Exception) {}
                      }
                  }
              }

              // Mengatur apakah bulatan titik, Handle Swipe & Pin Keyboard menembus sentuhan ke layar di bawahnya saat Play berjalan atau Dikunci
              private fun setTargetPointsTouchable(touchable: Boolean) {
                  val flags = if (touchable) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  val passThroughFlags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE

                  for (p in targetPoints) {
                      p.params.flags = flags
                      try {
                          windowManager.updateViewLayout(p.view, p.params)
                      } catch (e: Exception) {}

                      // Garis batang swipe selalu 100% tembus sentuhan
                      val lView = p.swipeLineView
                      val lParams = p.swipeLineParams
                      if (lView != null && lParams != null) {
                          lParams.flags = passThroughFlags
                          try {
                              windowManager.updateViewLayout(lView, lParams)
                          } catch (e: Exception) {}
                      }

                      val hView = p.swipeHandleView
                      val hParams = p.swipeHandleParams
                      if (hView != null && hParams != null) {
                          hParams.flags = flags
                          try {
                              windowManager.updateViewLayout(hView, hParams)
                          } catch (e: Exception) {}
                      }

                      val kView = p.keyView
                      val kParams = p.keyParams
                      if (kView != null && kParams != null) {
                          kParams.flags = flags
                          try {
                              windowManager.updateViewLayout(kView, kParams)
                          } catch (e: Exception) {}
                      }
                  }
              }

              // Indikator Warna Kuning Emas Menyala Saat Titik Sedang Mengeksekusi Klik/Swipe
              // Jika titik bertumpuk dengan titik lain, lingkaran paling atas di lokasi tersebut juga menyala menampilkan nomor yang sedang aktif
              private fun setPointActiveHighlight(point: TargetPoint, active: Boolean) {
                  val density = resources.displayMetrics.density
                  val stackThresholdPx = (18 * density).toInt()

                  val stackedGroup = targetPoints.filter {
                      abs(it.params.x - point.params.x) <= stackThresholdPx &&
                          abs(it.params.y - point.params.y) <= stackThresholdPx
                  }

                  for (item in stackedGroup) {
                      val root = item.view.findViewById<View>(R.id.pointRoot) ?: continue
                      val tvNum = item.view.findViewById<TextView>(R.id.tvTargetNumber)
                      val tvTyp = item.view.findViewById<TextView>(R.id.tvTargetType)

                      if (active) {
                          root.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(Color.parseColor("#EAB308")) // Kuning Emas Terang
                              setStroke((2.5f * density).toInt(), Color.WHITE)
                          }
                          // Tampilkan nomor & simbol titik yang sedang bekerja pada semua lingkaran yang bertumpuk di titik itu
                          tvNum?.text = point.order.toString()
                          tvTyp?.text = getPointTypeSymbol(point)
                      } else {
                          root.setBackgroundResource(R.drawable.bg_target_point)
                      }
                  }

                  if (!active) {
                      refreshAllStackBadges()
                  }
              }

              private fun resetAllPointHighlights() {
                  for (p in targetPoints) {
                      val root = p.view.findViewById<View>(R.id.pointRoot) ?: continue
                      root.setBackgroundResource(R.drawable.bg_target_point)
                  }
                  refreshAllStackBadges()
              }

              // Ambil koordinat presisi titik tengah ikon sesuai ukuran ikon saat ini (20dp - 40dp)
              // Tetap akurat 100% baik saat ikon terlihat (👁️), bertumpuk, maupun sedang disembunyikan (🙈)
              private fun getExactPointCenter(point: TargetPoint): Pair<Float, Float> {
                  val sizePx = getTargetSizePx()
                  val exactRadius = sizePx / 2f

                  if (arePointsVisible && point.view.visibility == View.VISIBLE) {
                      val loc = IntArray(2)
                      point.view.getLocationOnScreen(loc)
                      if (loc[0] > 0 || loc[1] > 0) {
                          // Simpan selisih inset layar (status bar / camera cutout) agar saat disembunyikan 🙈 tetap 100% akurat
                          lastKnownInsetX = loc[0] - point.params.x
                          lastKnownInsetY = loc[1] - point.params.y
                          return (loc[0] + exactRadius) to (loc[1] + exactRadius)
                      }
                  }

                  val fallbackX = point.params.x + lastKnownInsetX + exactRadius
                  val fallbackY = point.params.y + lastKnownInsetY + exactRadius
                  return fallbackX to fallbackY
              }

              private fun getExactKeyPinCenter(point: TargetPoint): Pair<Float, Float> {
                  val sizePx = getTargetSizePx()
                  val exactRadius = sizePx / 2f
                  val kParams = point.keyParams

                  val kView = point.keyView
                  if (kView != null && arePointsVisible && kView.visibility == View.VISIBLE) {
                      val kLoc = IntArray(2)
                      kView.getLocationOnScreen(kLoc)
                      if (kLoc[0] > 0 || kLoc[1] > 0) {
                          if (kParams != null) {
                              lastKnownInsetX = kLoc[0] - kParams.x
                              lastKnownInsetY = kLoc[1] - kParams.y
                          }
                          return (kLoc[0] + exactRadius) to (kLoc[1] + exactRadius)
                      }
                  }

                  val baseX = kParams?.x ?: point.savedKeyX.coerceAtLeast(100)
                  val baseY = kParams?.y ?: point.savedKeyY.coerceAtLeast(500)
                  return (baseX + lastKnownInsetX + exactRadius) to (baseY + lastKnownInsetY + exactRadius)
              }

              // Kunci koordinat layar fisik presisi setiap titik sebelum Play, lalu sembunyikan sementara semua overlay titik & panah
              // agar tidak ada satu pun overlay titik/ujung panah yang saling kontak saat gestur berjalan
              private fun lockCoordinatesAndSetPlayVisibility(hideForPlay: Boolean) {
                  if (hideForPlay) {
                      for (p in targetPoints) {
                          val (cx, cy) = getExactPointCenter(p)
                          p.cachedScreenX = cx
                          p.cachedScreenY = cy
                          val (kx, ky) = getExactKeyPinCenter(p)
                          p.cachedKeyScreenX = kx
                          p.cachedKeyScreenY = ky
                      }
                      for (p in targetPoints) {
                          p.view.visibility = View.GONE
                          p.swipeLineView?.visibility = View.GONE
                          p.swipeHandleView?.visibility = View.GONE
                          p.keyView?.visibility = View.GONE
                      }
                  } else {
                      val vis = if (arePointsVisible) View.VISIBLE else View.GONE
                      for (p in targetPoints) {
                          p.view.visibility = vis
                          p.swipeLineView?.visibility = vis
                          p.swipeHandleView?.visibility = vis
                          p.keyView?.visibility = vis
                      }
                  }
              }

              // EKSEKUSI BERURUTAN SESUAI NO. URUT (1 -> 2 -> 3 ... -> N) UNTUK SEMUA FITUR (TAP, 2+ SWIPE, MULTI-PASTE SIKLUS, POPUP & SUB-LOOP BERBATAS)
              private fun startClickExecution(service: AutoClickAccessibilityService) {
                  clickJob?.cancel()
                  clickJob = serviceScope.launch {
                      val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE)
                      val jitterEnabled = prefs.getBoolean("jitter_enabled", true)
                      val defaultPaste = prefs.getString("paste_text", "AutoKlik Trans") ?: ""

                      // Reset counter Multi-Paste & Sub-Loop saat sesi Play baru dimulai
                      for (p in targetPoints) {
                          p.currentPasteIndex = 0
                          p.currentJumpCount = 0
                      }

                      // Pastikan seluruh overlay titik sudah disembunyikan dari layar sebelum gestur pertama dimulai
                      delay(140)

                      Toast.makeText(applicationContext, "AutoKlik Berjalan (Urutan #1 s/d #${targetPoints.size})!", Toast.LENGTH_SHORT).show()

                      var currentOrder = 1
                      var cycle = 1

                      while (isActive && isPlaying && targetPoints.isNotEmpty()) {
                          val totalPoints = targetPoints.size
                          if (currentOrder < 1 || currentOrder > totalPoints) {
                              currentOrder = 1
                          }

                          val point = targetPoints.find { it.order == currentOrder } ?: targetPoints.getOrNull(currentOrder - 1)
                          if (point != null) {
                              // Tampilkan status No. Urut aktif pada Mini Toolbar
                              tvMiniStatus?.text = "⚡ #${point.order}/$totalPoints ${getPointTypeSymbol(point)}"

                              val (fallbackX, fallbackY) = getExactPointCenter(point)
                              val tapX = if (point.cachedScreenX > 0f) point.cachedScreenX else fallbackX
                              val tapY = if (point.cachedScreenY > 0f) point.cachedScreenY else fallbackY
                              val screenH = resources.displayMetrics.heightPixels.toFloat()

                              // 1. EKSEKUSI AKSI TITIK SAAT INI TERLEBIH DAHULU (Termasuk titik yang disetting Sub-Loop)
                              withTimeoutOrNull(4000L) {
                                  suspendCancellableCoroutine<Unit> { cont ->
                                      val done = {
                                          if (cont.isActive) cont.resume(Unit)
                                      }
                                      when (point.type) {
                                          "swipe_up" -> {
                                              val endY = (tapY - point.swipeDistancePx).coerceAtLeast(15f)
                                              service.executeSwipe(tapX, tapY, tapX, endY, 220L, done)
                                          }
                                          "swipe_down" -> {
                                              val maxScreenY = (screenH - 15f).coerceAtLeast(200f)
                                              val endY = (tapY + point.swipeDistancePx).coerceAtMost(maxScreenY)
                                              service.executeSwipe(tapX, tapY, tapX, endY, 220L, done)
                                          }
                                          "paste" -> {
                                              // Multi-Paste Mengikuti Siklus: Teks #1 -> #2 -> #3 -> kembali mengulang ke #1
                                              val validList = point.pasteTexts.map { it.trim() }.filter { it.isNotEmpty() }
                                              val textToPaste = if (validList.isNotEmpty()) {
                                                  val idx = point.currentPasteIndex % validList.size
                                                  point.currentPasteIndex = (point.currentPasteIndex + 1) % validList.size
                                                  validList[idx]
                                              } else if (point.pasteText.isNotBlank()) {
                                                  point.pasteText
                                              } else {
                                                  defaultPaste
                                              }
                                              service.executePaste(tapX, tapY, textToPaste, point.autoTapPaste, done)
                                          }
                                          "popup" -> {
                                              if (point.keyView != null || point.savedKeyX >= 0) {
                                                  val (fkX, fkY) = getExactKeyPinCenter(point)
                                                  val keyTapX = if (point.cachedKeyScreenX > 0f) point.cachedKeyScreenX else fkX
                                                  val keyTapY = if (point.cachedKeyScreenY > 0f) point.cachedKeyScreenY else fkY
                                                  service.executePopup(tapX, tapY, keyTapX, keyTapY, point.keyDelayMs, done)
                                              } else {
                                                  service.executeTap(tapX, tapY, point.durationMs, done)
                                              }
                                          }
                                          else -> {
                                              service.executeTap(tapX, tapY, point.durationMs, done)
                                          }
                                      }
                                  }
                              }

                              // 2. JEDA SETELAH TITIK INI SELESAI MELAKUKAN AKSI (ms atau detik)
                              var waitTime = point.delayMs.coerceAtLeast(50L)
                              if (jitterEnabled) {
                                  val maxJitter = (waitTime * 0.10f).toLong().coerceAtMost(120L)
                                  if (maxJitter > 5L) {
                                      val delta = Random.nextLong(-maxJitter, maxJitter + 1)
                                      waitTime = (waitTime + delta).coerceAtLeast(50L)
                                  }
                              }
                              delay(waitTime)

                              // 3. PENENTUAN URUTAN BERIKUTNYA (SUB-LOOP BERBATAS LALU LANJUT KE TITIK SELANJUTNYA)
                              if (point.jumpEnabled && point.jumpToPoint in 1..totalPoints) {
                                  val maxLoops = point.jumpAfterCycle // 0 = Tanpa Batas (∞), >0 = Batas jumlah lompatan Sub-Loop
                                  if (maxLoops <= 0 || point.currentJumpCount < maxLoops) {
                                      // Selama belum mencapai batas loop (misal < 8x), lompat balik ke titik target (misal #2)
                                      point.currentJumpCount++
                                      currentOrder = point.jumpToPoint
                                  } else {
                                      // Setelah batas loop selesai (misal sudah 8x), titik ini SUDAH melakukan aksinya di atas,
                                      // sekarang reset counter Sub-Loop titik ini dan lanjutkan ke urutan berikutnya (#8 -> #9 -> #10)
                                      point.currentJumpCount = 0
                                      if (currentOrder >= totalPoints) {
                                          currentOrder = 1
                                          cycle++
                                      } else {
                                          currentOrder++
                                      }
                                  }
                              } else if (currentOrder >= totalPoints) {
                                  currentOrder = 1
                                  cycle++
                                  for (p in targetPoints) {
                                      p.currentJumpCount = 0
                                  }
                              } else {
                                  currentOrder++
                              }
                          } else {
                              currentOrder = 1
                          }
                      }
                  }
              }

              private fun stopClickExecution() {
                  isPlaying = false
                  clickJob?.cancel()
                  clickJob = null

                  resetAllPointHighlights()
                  lockCoordinatesAndSetPlayVisibility(hideForPlay = false)
                  setTargetPointsTouchable(!isPointsLocked)

                  layoutMiniToolbar?.visibility = View.GONE
                  layoutFullToolbar?.visibility = View.VISIBLE
                  if (floatingContainer != null) {
                      try {
                          windowManager.updateViewLayout(floatingContainer, containerParams)
                      } catch (e: Exception) {}
                  }

                  Toast.makeText(applicationContext, "AutoKlik Dihentikan ⏹ (Titik Ditampilkan Kembali)", Toast.LENGTH_SHORT).show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopClickExecution()
                  serviceScope.cancel()
                  closePointSettingsDialog()
                  closeSizeDialog()
                  closeConfigDialog()

                  for (point in targetPoints) {
                      r9yMnTm4NSzvG9rrwjM2ec8xZgh1cafXH8(point)
                  }
                  targetPoints.clear()

                  if (floatingContainer != null) {
                      try {
                          windowManager.removeView(floatingContainer)
                      } catch (e: Exception) {}
                  }
              }
