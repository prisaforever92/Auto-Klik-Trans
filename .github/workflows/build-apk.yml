              // MENAMBAH TITIK TARGET (BULATAN MURNI 1:1 AGAR TIDAK PERNAH BERGESER ATAU MENUTUPI TITIK LAIN)
              private fun addTargetPoint(savedObj: JSONObject? = null) {
                  val nextOrder = targetPoints.size + 1
                  val sizePx = getTargetSizePx()

                  val defaultX = 120 + ((nextOrder - 1) % 4) * 110
                  val defaultY = 350 + ((nextOrder - 1) / 4) * 120

                  val pointParams = WindowManager.LayoutParams(
                      sizePx,
                      sizePx,
                      getOverlayLayoutType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = savedObj?.optInt("x", defaultX) ?: defaultX
                      y = savedObj?.optInt("y", defaultY) ?: defaultY
                  }

                  val pointView = LayoutInflater.from(this).inflate(R.layout.layout_target_point, null)
                  val pointRoot = pointView.findViewById<View>(R.id.pointRoot)
                  val tvNumber = pointView.findViewById<TextView>(R.id.tvTargetNumber)
                  val tvType = pointView.findViewById<TextView>(R.id.tvTargetType)

                  // Pastikan layoutArrowUp & layoutArrowDown di dalam pointView selalu GONE
                  // karena garis & handle swipe kini menggunakan companion window mandiri (syncSwipeOverlay)
                  pointView.findViewById<View>(R.id.layoutArrowUp)?.visibility = View.GONE
                  pointView.findViewById<View>(R.id.layoutArrowDown)?.visibility = View.GONE

                  tvNumber.text = nextOrder.toString()
                  tvType.text = "🎯"

                  val targetPoint = TargetPoint(
                      order = nextOrder,
                      view = pointView,
                      params = pointParams,
                      type = savedObj?.optString("type", "tap") ?: "tap",
                      delayValue = savedObj?.optDouble("delayValue", 500.0) ?: 500.0,
                      delayUnit = savedObj?.optString("delayUnit", "ms") ?: "ms",
                      delayMs = savedObj?.optLong("delayMs", 500L) ?: 500L,
                      swipeDistancePx = savedObj?.optDouble("swipeDistancePx", 300.0)?.toFloat() ?: 300f,
                      // Penting: Default jumpEnabled = false agar urutan titik selalu berjalan normal 1..N
                      jumpEnabled = savedObj?.optBoolean("jumpEnabled", false) ?: false,
                      jumpToPoint = savedObj?.optInt("jumpToPoint", 1) ?: 1,
                      jumpAfterCycle = savedObj?.optInt("jumpAfterCycle", 1) ?: 1,
                      pasteText = savedObj?.optString("pasteText", "") ?: "",
                      autoTapPaste = savedObj?.optBoolean("autoTapPaste", true) ?: true,
                      keyDelayMs = savedObj?.optLong("keyDelayMs", 400L) ?: 400L,
                      savedKeyX = savedObj?.optInt("keyX", -1) ?: -1,
                      savedKeyY = savedObj?.optInt("keyY", -1) ?: -1
                  )

                  // Sentuh & Seret Bulatan Nomor (pointRoot) untuk memindahkan posisi titik atau ketuk untuk buka Dialog
                  pointRoot.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var touchStartTime = 0L

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          if (isPlaying || isPointsLocked) return false

                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = pointParams.x
                                  initialY = pointParams.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  touchStartTime = System.currentTimeMillis()
                                  setOtherPointsTouchable(targetPoint.order, false)
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val deltaX = (event.rawX - initialTouchX).toInt()
                                  val deltaY = (event.rawY - initialTouchY).toInt()
                                  pointParams.x = initialX + deltaX
                                  pointParams.y = initialY + deltaY
                                  try {
                                      windowManager.updateViewLayout(pointView, pointParams)
                                  } catch (e: Exception) {}
                                  // Ikut gerakkan garis & ujung panah swipe secara real-time saat bulatan digeser
                                  if (targetPoint.type == "swipe_up" || targetPoint.type == "swipe_down") {
                                      syncSwipeOverlay(targetPoint)
                                  }
                                  return true
                              }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  setOtherPointsTouchable(targetPoint.order, true)
                                  refreshAllStackBadges()
                                  if (targetPoint.type == "swipe_up" || targetPoint.type == "swipe_down") {
                                      syncAllSwipeOverlays()
                                  }
                                  val diffTime = System.currentTimeMillis() - touchStartTime
                                  val moved = abs(event.rawX - initialTouchX) > 12 || abs(event.rawY - initialTouchY) > 12
                                  if (event.action == MotionEvent.ACTION_UP && !moved && diffTime < 350 && !isPlaying && !isPointsLocked) {
                                      showPointSettingsDialog(targetPoint)
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  if (isPlaying || isPointsLocked) {
                      pointParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  windowManager.addView(pointView, pointParams)
                  targetPoints.add(targetPoint)
                  updatePointVisual(targetPoint)
                  refreshAllStackBadges()
                  if (savedObj == null) {
                      Toast.makeText(this, "Titik #$nextOrder ditambah! (Ketuk angka untuk opsi Swipe, Popup & Jeda)", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun getPointTypeSymbol(point: TargetPoint): String {
                  val base = when (point.type) {
                      "swipe_up" -> "▲"
                      "swipe_down" -> "▼"
                      "paste" -> "📋"
                      "popup" -> "⌨️"
                      else -> "🎯"
                  }
                  return if (point.jumpEnabled) "$base🔁" else base
              }

              // Perbarui label pada titik yang bertumpuk (lokasi sama) agar pengguna tahu nomor titik apa saja di posisi tersebut
              private fun refreshAllStackBadges() {
                  val density = resources.displayMetrics.density
                  val stackThresholdPx = (16 * density).toInt()

                  for (p in targetPoints) {
                      val tvNumber = p.view.findViewById<TextView>(R.id.tvTargetNumber)
                      val tvType = p.view.findViewById<TextView>(R.id.tvTargetType)
                      tvNumber?.text = p.order.toString()

                      val overlappingOrders = targetPoints
                          .filter { abs(it.params.x - p.params.x) <= stackThresholdPx && abs(it.params.y - p.params.y) <= stackThresholdPx }
                          .map { it.order }
                          .sorted()

                      val symbol = getPointTypeSymbol(p)
                      if (overlappingOrders.size > 1) {
                          // Tampilkan daftar singkat nomor yang bertumpuk (contoh: 🎯1,3)
                          tvType?.text = "$symbol${overlappingOrders.joinToString(",")}"
                      } else {
                          tvType?.text = symbol
                      }
                  }
              }

              // MEMPERBARUI TAMPILAN VISUAL TITIK, GARIS SWIPE MANDIRI & PIN KEYBOARD POPUP
              private fun updatePointVisual(point: TargetPoint) {
                  val density = resources.displayMetrics.density
                  val sizeDp = getTargetSizeDp()
                  val sizePx = (sizeDp * density).toInt()

                  val pointRoot = point.view.findViewById<View>(R.id.pointRoot)
                  val tvNumber = point.view.findViewById<TextView>(R.id.tvTargetNumber)

                  // Pastikan bulatan nomor selalu berukuran 1:1 (sizePx x sizePx) tanpa tergeser oleh garis swipe
                  pointRoot.layoutParams.width = sizePx
                  pointRoot.layoutParams.height = sizePx
                  pointRoot.requestLayout()

                  point.params.width = sizePx
                  point.params.height = sizePx

                  tvNumber.text = point.order.toString()
                  tvNumber.textSize = (sizeDp * 0.44f).coerceIn(9f, 17f)

                  val minPx = (50f * density).toInt()
                  val maxPx = (resources.displayMetrics.heightPixels * 0.78f).toInt().coerceAtLeast(300)
                  point.swipeDistancePx = point.swipeDistancePx.toInt().coerceIn(minPx, maxPx).toFloat()

                  try {
                      windowManager.updateViewLayout(point.view, point.params)
                  } catch (e: Exception) {}

                  // Sinkronisasi Garis & Handle Swipe Mandiri (100% tidak menggeser titik & tidak menutupi titik lain)
                  syncSwipeOverlay(point)

                  // Sinkronisasi Pin Keyboard (⌨️) untuk fitur "Popup"
                  syncPopupKeyPin(point)

                  refreshAllStackBadges()
              }

              private fun syncAllSwipeOverlays() {
                  for (p in targetPoints) {
                      if (p.type == "swipe_up" || p.type == "swipe_down") {
                          syncSwipeOverlay(p)
                      }
                  }
              }

              // GARIS & HANDLE SWIPE MANDIRI:
              // 1. swipeLineView selalu FLAG_NOT_TOUCHABLE (tembus sentuhan) agar titik lain yang lewat/bertumpuk di jalur swipe bebas diklik
              // 2. swipeHandleView menampilkan nomor urut (contoh: ▲#1 300px / ▼#2 300px) dan jika ada 2 swipe bertumpuk, posisi tombolnya digeser sedikit ke samping agar keduanya bisa ditarik masing-masing
              private fun syncSwipeOverlay(point: TargetPoint) {
                  val isSwipeUp = point.type == "swipe_up"
                  val isSwipeDown = point.type == "swipe_down"

                  if (!isSwipeUp && !isSwipeDown) {
                      if (point.swipeLineView != null) {
                          try {
                              windowManager.removeView(point.swipeLineView)
                          } catch (e: Exception) {}
                          point.swipeLineView = null
                          point.swipeLineParams = null
                      }
                      if (point.swipeHandleView != null) {
                          try {
                              windowManager.removeView(point.swipeHandleView)
                          } catch (e: Exception) {}
                          point.swipeHandleView = null
                          point.swipeHandleParams = null
                      }
                      return
                  }

                  val density = resources.displayMetrics.density
                  val sizePx = getTargetSizePx()
                  val screenH = resources.displayMetrics.heightPixels
                  val screenW = resources.displayMetrics.widthPixels

                  val minPx = 50f * density
                  val maxPx = (screenH * 0.78f).coerceAtLeast(300f)
                  val distPx = point.swipeDistancePx.coerceIn(minPx, maxPx).toInt()
                  point.swipeDistancePx = distPx.toFloat()

                  val circleCenterX = point.params.x + sizePx / 2
                  val circleCenterY = point.params.y + sizePx / 2

                  val tipY = if (isSwipeUp) {
                      (circleCenterY - distPx).coerceAtLeast((28 * density).toInt())
                  } else {
                      (circleCenterY + distPx).coerceAtMost(screenH - (42 * density).toInt())
                  }

                  val lineTopY = if (isSwipeUp) tipY else circleCenterY
                  val lineBottomY = if (isSwipeUp) circleCenterY else tipY
                  val lineHeightPx = (lineBottomY - lineTopY).coerceAtLeast((20 * density).toInt())
                  val lineWidthPx = (5 * density).toInt().coerceAtLeast(4)

                  val accentColor = Color.parseColor(if (isSwipeUp) "#38BDF8" else "#F59E0B")
                  val arrowChar = if (isSwipeUp) "▲" else "▼"
                  val vis = if (arePointsVisible) View.VISIBLE else View.GONE

                  // 1. Buat atau Perbarui Batang Garis Panah (Selalu FLAG_NOT_TOUCHABLE agar tidak mengganggu titik lain)
                  if (point.swipeLineView == null) {
                      val lParams = WindowManager.LayoutParams(
                          lineWidthPx,
                          lineHeightPx,
                          getOverlayLayoutType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = circleCenterX - lineWidthPx / 2
                          y = lineTopY
                      }

                      val lView = View(this).apply {
                          background = GradientDrawable().apply {
                              setColor(accentColor)
                              cornerRadius = 3f * density
                              setStroke((1 * density).toInt(), Color.parseColor("#0F172A"))
                          }
                          visibility = vis
                      }

                      windowManager.addView(lView, lParams)
                      point.swipeLineView = lView
                      point.swipeLineParams = lParams
                  } else {
                      val lView = point.swipeLineView!!
                      val lParams = point.swipeLineParams!!
                      lParams.width = lineWidthPx
                      lParams.height = lineHeightPx
                      lParams.x = circleCenterX - lineWidthPx / 2
                      lParams.y = lineTopY
                      lParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                      lView.background = GradientDrawable().apply {
                          setColor(accentColor)
                          cornerRadius = 3f * density
                          setStroke((1 * density).toInt(), Color.parseColor("#0F172A"))
                      }
                      lView.visibility = vis
                      try {
                          windowManager.updateViewLayout(lView, lParams)
                      } catch (e: Exception) {}
                  }

                  // Hitung offset horizontal handle jika ada 2 titik Swipe yang bertumpuk pada posisi & panjang yang sama
                  val overlapThreshold = (28 * density).toInt()
                  val sameSpotSwipes = targetPoints.filter {
                      (it.type == "swipe_up" || it.type == "swipe_down") &&
                          abs((it.params.x + sizePx / 2) - circleCenterX) <= overlapThreshold &&
                          abs(it.swipeDistancePx - point.swipeDistancePx) <= overlapThreshold &&
                          it.type == point.type
                  }.sortedBy { it.order }

                  val myStackIndex = sameSpotSwipes.indexOfFirst { it.order == point.order }.coerceAtLeast(0)
                  val handleWidthPx = (86 * density).toInt()
                  val handleHeightPx = (24 * density).toInt()
                  val staggerOffsetX = if (sameSpotSwipes.size > 1) {
                      ((myStackIndex - (sameSpotSwipes.size - 1) / 2f) * (handleWidthPx + (6 * density))).toInt()
                  } else {
                      0
                  }

                  val handleX = (circleCenterX - handleWidthPx / 2 + staggerOffsetX)
                      .coerceIn(4, (screenW - handleWidthPx - 4).coerceAtLeast(10))
                  val handleY = if (isSwipeUp) {
                      (tipY - handleHeightPx / 2).coerceIn(10, (screenH - handleHeightPx - 10).coerceAtLeast(20))
                  } else {
                      (tipY - handleHeightPx / 2).coerceIn(10, (screenH - handleHeightPx - 10).coerceAtLeast(20))
                  }

                  // 2. Buat atau Perbarui Tombol Ujung Panah (▲#1 300px / ▼#2 300px) yang Bisa Ditarik
                  if (point.swipeHandleView == null) {
                      val hParams = WindowManager.LayoutParams(
                          handleWidthPx,
                          handleHeightPx,
                          getOverlayLayoutType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = handleX
                          y = handleY
                      }

                      val tvHandle = TextView(this).apply {
                          text = "$arrowChar#${point.order} ${distPx}px"
                          textSize = 10f
                          setTextColor(accentColor)
                          setTypeface(typeface, android.graphics.Typeface.BOLD)
                          gravity = Gravity.CENTER
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#EB0F172A"))
                              cornerRadius = 12f * density
                              setStroke((1.5f * density).toInt(), accentColor)
                          }
                          visibility = vis
                      }

                      tvHandle.setOnTouchListener(object : View.OnTouchListener {
                          private var initialTouchY = 0f
                          private var initialDistPx = 300f

                          override fun onTouch(v: View, event: MotionEvent): Boolean {
                              if (isPlaying || isPointsLocked) return false

                              when (event.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      initialTouchY = event.rawY
                                      initialDistPx = point.swipeDistancePx
                                      setOtherPointsTouchable(point.order, false)
                                      return true
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      val delta = if (point.type == "swipe_up") {
                                          initialTouchY - event.rawY
                                      } else {
                                          event.rawY - initialTouchY
                                      }
                                      point.swipeDistancePx = (initialDistPx + delta).coerceIn(minPx, maxPx)
                                      syncSwipeOverlay(point)
                                      return true
                                  }
                                  MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                      setOtherPointsTouchable(point.order, true)
                                      syncAllSwipeOverlays()
                                      return true
                                  }
                              }
                              return false
                          }
                      })

                      if (isPlaying || isPointsLocked) {
                          hParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                      }
                      windowManager.addView(tvHandle, hParams)
                      point.swipeHandleView = tvHandle
                      point.swipeHandleParams = hParams
                  } else {
                      val tvHandle = point.swipeHandleView as? TextView
                      val hParams = point.swipeHandleParams
                      if (tvHandle != null && hParams != null) {
                          hParams.width = handleWidthPx
                          hParams.height = handleHeightPx
                          hParams.x = handleX
                          hParams.y = handleY
                          hParams.flags = if (isPlaying || isPointsLocked) {
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                          } else {
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          }
                          tvHandle.text = "$arrowChar#${point.order} ${distPx}px"
                          tvHandle.setTextColor(accentColor)
                          tvHandle.background = GradientDrawable().apply {
                              setColor(Color.parseColor("#EB0F172A"))
                              cornerRadius = 12f * density
                              setStroke((1.5f * density).toInt(), accentColor)
                          }
                          tvHandle.visibility = vis
                          try {
                              windowManager.updateViewLayout(tvHandle, hParams)
                          } catch (e: Exception) {}
                      }
                  }
              }

              // MEMBUAT / MEMPERBARUI / MENGHAPUS PIN HURUF KEYBOARD (⌨️) KHUSUS FITUR "POPUP"
              private fun syncPopupKeyPin(point: TargetPoint) {
                  if (point.type != "popup") {
                      if (point.keyView != null) {
                          try {
                              windowManager.removeView(point.keyView)
                          } catch (e: Exception) {}
                          point.keyView = null
                          point.keyParams = null
                      }
                      return
                  }

                  val density = resources.displayMetrics.density
                  val sizeDp = getTargetSizeDp()
                  val sizePx = (sizeDp * density).toInt()

                  if (point.keyView == null) {
                      val defaultKeyX = if (point.savedKeyX >= 0) point.savedKeyX else (70 + ((point.order - 1) % 5) * 90)
                      val defaultKeyY = if (point.savedKeyY >= 0) point.savedKeyY else (resources.displayMetrics.heightPixels * 0.73f).toInt()

                      val kParams = WindowManager.LayoutParams(
                          sizePx,
                          sizePx,
                          getOverlayLayoutType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = defaultKeyX
                          y = defaultKeyY
                      }

                      val pinContainer = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(Color.parseColor("#6D28D9"))
                              setStroke((2.2f * density).toInt(), Color.parseColor("#FACC15"))
                          }
                      }

                      val tvKeyNum = TextView(this).apply {
                          tag = "tvKeyNum"
                          text = "⌨️${point.order}"
                          setTextColor(Color.WHITE)
                          textSize = (sizeDp * 0.34f).coerceIn(8f, 13f)
                          setTypeface(typeface, android.graphics.Typeface.BOLD)
                          gravity = Gravity.CENTER
                      }

                      val tvKeySub = TextView(this).apply {
                          tag = "tvKeySub"
                          text = "KEY"
                          setTextColor(Color.parseColor("#FACC15"))
                          textSize = (sizeDp * 0.24f).coerceIn(6f, 9f)
                          setTypeface(typeface, android.graphics.Typeface.BOLD)
                          gravity = Gravity.CENTER
                      }

                      pinContainer.addView(tvKeyNum)
                      pinContainer.addView(tvKeySub)

                      pinContainer.setOnTouchListener(object : View.OnTouchListener {
                          private var initialX = 0
                          private var initialY = 0
                          private var initialTouchX = 0f
                          private var initialTouchY = 0f
                          private var touchStartTime = 0L

                          override fun onTouch(v: View, event: MotionEvent): Boolean {
                              if (isPlaying || isPointsLocked) return false

                              when (event.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      initialX = kParams.x
                                      initialY = kParams.y
                                      initialTouchX = event.rawX
                                      initialTouchY = event.rawY
                                      touchStartTime = System.currentTimeMillis()
                                      setOtherPointsTouchable(point.order, false)
                                      return true
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      kParams.x = initialX + (event.rawX - initialTouchX).toInt()
                                      kParams.y = initialY + (event.rawY - initialTouchY).toInt()
                                      point.savedKeyX = kParams.x
                                      point.savedKeyY = kParams.y
                                      try {
                                          windowManager.updateViewLayout(pinContainer, kParams)
                                      } catch (e: Exception) {}
                                      return true
                                  }
                                  MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                      setOtherPointsTouchable(point.order, true)
                                      val diff = System.currentTimeMillis() - touchStartTime
                                      val moved = abs(event.rawX - initialTouchX) > 12 || abs(event.rawY - initialTouchY) > 12
                                      if (event.action == MotionEvent.ACTION_UP && !moved && diff < 350) {
                                          Toast.makeText(
                                              this@FloatingOverlayService,
                                              "⌨️ Pin Keyboard Titik #${point.order}: Geser pin ini tepat ke atas huruf pada Keyboard HP Anda!",
                                              Toast.LENGTH_SHORT
                                          ).show()
                                      }
                                      return true
                                  }
                              }
                              return false
                          }
                      })

                      if (isPlaying || isPointsLocked) {
                          kParams.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                      }
                      pinContainer.visibility = if (arePointsVisible) View.VISIBLE else View.GONE
                      windowManager.addView(pinContainer, kParams)
                      point.keyView = pinContainer
                      point.keyParams = kParams
                      point.savedKeyX = kParams.x
                      point.savedKeyY = kParams.y
                  } else {
                      val kView = point.keyView as? LinearLayout
                      val kParams = point.keyParams
                      if (kView != null && kParams != null) {
                          kParams.width = sizePx
                          kParams.height = sizePx
                          val tvKeyNum = kView.findViewWithTag<TextView>("tvKeyNum")
                          val tvKeySub = kView.findViewWithTag<TextView>("tvKeySub")
                          tvKeyNum?.text = "⌨️${point.order}"
                          tvKeyNum?.textSize = (sizeDp * 0.34f).coerceIn(8f, 13f)
                          tvKeySub?.textSize = (sizeDp * 0.24f).coerceIn(6f, 9f)
                          try {
                              windowManager.updateViewLayout(kView, kParams)
                          } catch (e: Exception) {}
                      }
                  }
              }

              private fun updateAllPointsVisuals() {
                  for (p in targetPoints) {
                      updatePointVisual(p)
                  }
                  syncAllSwipeOverlays()
                  refreshAllStackBadges()
              }

              // Angkat titik yang sedang dipilih ke lapisan paling atas agar mudah digeser bila bertumpuk
              private fun bringPointToFront(point: TargetPoint) {
                  try {
                      windowManager.removeView(point.view)
                      windowManager.addView(point.view, point.params)
                  } catch (e: Exception) {}
                  if (point.swipeHandleView != null && point.swipeHandleParams != null) {
                      try {
                          windowManager.removeView(point.swipeHandleView)
                          windowManager.addView(point.swipeHandleView, point.swipeHandleParams)
                      } catch (e: Exception) {}
                  }
                  // Jaga agar toolbar tetap di atas
                  if (floatingContainer != null) {
                      try {
                          windowManager.removeView(floatingContainer)
                          windowManager.addView(floatingContainer, containerParams)
                      } catch (e: Exception) {}
                  }
              }

              // DIALOG PENGATURAN PER-TITIK (KEYBOARD AKTIF, JEDA MS/DETIK, GARIS SWIPE, UBAH NO URUT, SUB-LOOP)
              private fun showPointSettingsDialog(point: TargetPoint) {
                  if (isPlaying || isPointsLocked) return
                  closePointSettingsDialog()

                  val density = resources.displayMetrics.density

                  val dialogParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      getOverlayLayoutType(),
                      WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                      softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_PAN or WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE
                  }

                  val dialogView = LayoutInflater.from(this).inflate(R.layout.layout_point_dialog, null)
                  val tvTitle = dialogView.findViewById<TextView>(R.id.tvDialogTitle)
                  val layoutMultiHelper = dialogView.findViewById<LinearLayout>(R.id.layoutMultiPointHelper)
                  val layoutQuickSwitch = dialogView.findViewById<LinearLayout>(R.id.layoutQuickSwitchPoints)
                  val btnMoveOrderPrev = dialogView.findViewById<Button>(R.id.btnMoveOrderPrev)
                  val btnMoveOrderNext = dialogView.findViewById<Button>(R.id.btnMoveOrderNext)
                  val tvSnapLabel = dialogView.findViewById<TextView>(R.id.tvSnapPositionLabel)
                  val layoutSnapPos = dialogView.findViewById<LinearLayout>(R.id.layoutSnapPositionPoints)

                  val rgType = dialogView.findViewById<RadioGroup>(R.id.rgPointType)
                  val rbTap = dialogView.findViewById<RadioButton>(R.id.rbTypeTap)
                  val rbSwipeUp = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeUp)
                  val rbSwipeDown = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeDown)
                  val rbPaste = dialogView.findViewById<RadioButton>(R.id.rbTypePaste)
                  val rbPopup = dialogView.findViewById<RadioButton>(R.id.rbTypePopup)

                  val layoutSwipe = dialogView.findViewById<LinearLayout>(R.id.layoutSwipeSettings)
                  val etSwipeDistance = dialogView.findViewById<EditText>(R.id.etSwipeDistance)

                  val etDelay = dialogView.findViewById<EditText>(R.id.etDialogDelay)
                  val rgDelayUnit = dialogView.findViewById<RadioGroup>(R.id.rgDelayUnit)
                  val rbUnitMs = dialogView.findViewById<RadioButton>(R.id.rbUnitMs)
                  val rbUnitSec = dialogView.findViewById<RadioButton>(R.id.rbUnitSec)

                  val cbSubLoop = dialogView.findViewById<CheckBox>(R.id.cbPointSubLoop)
                  val layoutSubLoop = dialogView.findViewById<LinearLayout>(R.id.layoutPointSubLoopFields)
                  val etJumpTo = dialogView.findViewById<EditText>(R.id.etPointJumpTo)
                  val etJumpCycle = dialogView.findViewById<EditText>(R.id.etPointJumpCycle)

                  val layoutPaste = dialogView.findViewById<LinearLayout>(R.id.layoutDialogPasteFields)
                  val etPasteText = dialogView.findViewById<EditText>(R.id.etDialogPasteText)
                  val cbAutoTap = dialogView.findViewById<CheckBox>(R.id.cbDialogAutoTap)

                  val layoutPopup = dialogView.findViewById<LinearLayout>(R.id.layoutDialogPopupFields)
                  val etPopupKeyDelay = dialogView.findViewById<EditText>(R.id.etPopupKeyDelay)

                  val btnSave = dialogView.findViewById<Button>(R.id.btnDialogSave)
                  val btnClose = dialogView.findViewById<Button>(R.id.btnDialogClose)

                  tvTitle.text = "Pengaturan Titik #${point.order} (${getPointTypeSymbol(point)})"

                  // Helper untuk menyimpan isi form dialog saat ini ke objek point (dipakai saat klik Simpan maupun saat pindah titik)
                  fun saveCurrentDialogFieldsToPoint() {
                      point.type = when (rgType.checkedRadioButtonId) {
                          R.id.rbTypeSwipeUp -> "swipe_up"
                          R.id.rbTypeSwipeDown -> "swipe_down"
                          R.id.rbTypePaste -> "paste"
                          R.id.rbTypePopup -> "popup"
                          else -> "tap"
                      }

                      val isSec = rgDelayUnit.checkedRadioButtonId == R.id.rbUnitSec
                      val delayInputVal = etDelay.text.toString().toDoubleOrNull() ?: if (isSec) 1.0 else 500.0
                      point.delayValue = delayInputVal
                      point.delayUnit = if (isSec) "s" else "ms"
                      point.delayMs = if (isSec) (delayInputVal * 1000.0).toLong().coerceAtLeast(50L) else delayInputVal.toLong().coerceAtLeast(50L)

                      point.swipeDistancePx = etSwipeDistance.text.toString().toFloatOrNull() ?: point.swipeDistancePx

                      point.jumpEnabled = cbSubLoop.isChecked
                      point.jumpToPoint = (etJumpTo.text.toString().toIntOrNull() ?: 1).coerceIn(1, targetPoints.size.coerceAtLeast(1))
                      point.jumpAfterCycle = (etJumpCycle.text.toString().toIntOrNull() ?: 1).coerceAtLeast(1)

                      point.pasteText = etPasteText.text.toString()
                      point.autoTapPaste = cbAutoTap.isChecked
                      point.keyDelayMs = etPopupKeyDelay.text.toString().toLongOrNull()?.coerceAtLeast(150L) ?: 400L

                      updatePointVisual(point)
                      syncAllSwipeOverlays()
                  }

                  // FITUR PERMUDAH TITIK DI LOKASI SAMA & UBAH NO. URUT
                  if (targetPoints.size <= 1) {
                      layoutMultiHelper.visibility = View.GONE
                  } else {
                      layoutMultiHelper.visibility = View.VISIBLE
                      layoutQuickSwitch.removeAllViews()
                      layoutSnapPos.removeAllViews()

                      val sorted = targetPoints.sortedBy { it.order }
                      for (other in sorted) {
                          val btnSwitch = Button(this).apply {
                              text = "#${other.order} ${getPointTypeSymbol(other)}"
                              textSize = 11f
                              minWidth = 0
                              setPadding((8 * density).toInt(), 0, (8 * density).toInt(), 0)
                              setTextColor(Color.WHITE)
                              val isCurrent = other.order == point.order
                              backgroundTintList = android.content.res.ColorStateList.valueOf(
                                  Color.parseColor(if (isCurrent) "#10B981" else "#334155")
                              )
                              layoutParams = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.WRAP_CONTENT,
                                  (30 * density).toInt()
