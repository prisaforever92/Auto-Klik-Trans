                  windowManager.addView(root, currentConfigDialogParams)
                  currentConfigDialogView = root
              }

              private fun loadNamedConfiguration(configName: String) {
                  val prefs = getSharedPreferences("autoklik_profiles", Context.MODE_PRIVATE)
                  val rawJson = prefs.getString(configName, null)
                  if (rawJson.isNullOrBlank()) {
                      Toast.makeText(this, "Konfigurasi '$configName' tidak ditemukan!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  try {
                      val profileObj = JSONObject(rawJson)
                      val pointsArray = profileObj.optJSONArray("points")
                      if (pointsArray == null || pointsArray.length() == 0) {
                          Toast.makeText(this, "Konfigurasi '$configName' belum memiliki titik tersimpan!", Toast.LENGTH_SHORT).show()
                          return
                      }

                      // Hapus titik lama beserta Pin Keyboard (jika ada) dari layar
                      for (point in targetPoints) {
                          try {
                              windowManager.removeView(point.view)
                          } catch (e: Exception) {}
                          if (point.keyView != null) {
                              try {
                                  windowManager.removeView(point.keyView)
                              } catch (e: Exception) {}
                          }
                      }
                      targetPoints.clear()

                      currentSizePercent = profileObj.optInt("size_percent", currentSizePercent).coerceIn(0, 100)
                      arePointsVisible = true
                      floatingContainer?.findViewById<Button>(R.id.btnFloatingVisibility)?.text = "👁️"

                      for (i in 0 until pointsArray.length()) {
                          val ptObj = pointsArray.getJSONObject(i)
                          addTargetPoint(ptObj)
                      }

                      Toast.makeText(this, "📂 Konfigurasi '$configName' (${targetPoints.size} titik) berhasil dimuat!", Toast.LENGTH_LONG).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Gagal memuat konfigurasi: ${e.message}", Toast.LENGTH_SHORT).show()
                  }
              }

              // FITUR 2: DIALOG UKURAN PERSENTASE 0-100% (20dp - 40dp)
              private fun showSizeDialog() {
                  closeSizeDialog()

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  currentSizeDialogParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                  }

                  val dialogView = LayoutInflater.from(this).inflate(R.layout.layout_size_dialog, null)
                  val tvTitle = dialogView.findViewById<TextView>(R.id.tvSizeDialogTitle)
                  val sbPercent = dialogView.findViewById<SeekBar>(R.id.sbSizePercent)

                  val btn0 = dialogView.findViewById<Button>(R.id.btnSize0)
                  val btn25 = dialogView.findViewById<Button>(R.id.btnSize25)
                  val btn50 = dialogView.findViewById<Button>(R.id.btnSize50)
                  val btn75 = dialogView.findViewById<Button>(R.id.btnSize75)
                  val btn100 = dialogView.findViewById<Button>(R.id.btnSize100)
                  val btnClose = dialogView.findViewById<Button>(R.id.btnSizeClose)

                  sbPercent.progress = currentSizePercent
                  tvTitle.text = "Ukuran Titik: $currentSizePercent% (${getTargetSizeDp()}dp)"

                  fun applySize(percent: Int) {
                      currentSizePercent = percent.coerceIn(0, 100)
                      sbPercent.progress = currentSizePercent
                      tvTitle.text = "Ukuran Titik: $currentSizePercent% (${getTargetSizeDp()}dp)"
                      updateAllPointsVisuals()

                      // Simpan preferensi
                      val prefs = getSharedPreferences("autoklik_saved_config", Context.MODE_PRIVATE).edit()
                      prefs.putInt("size_percent", currentSizePercent)
                      prefs.apply()
                  }

                  sbPercent.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) {
                              applySize(progress)
                          }
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })

                  btn0?.setOnClickListener { applySize(0) }
                  btn25?.setOnClickListener { applySize(25) }
                  btn50?.setOnClickListener { applySize(50) }
                  btn75?.setOnClickListener { applySize(75) }
                  btn100?.setOnClickListener { applySize(100) }

                  btnClose?.setOnClickListener {
                      closeSizeDialog()
                  }

                  windowManager.addView(dialogView, currentSizeDialogParams)
                  currentSizeDialogView = dialogView
              }

              private fun closeSizeDialog() {
                  if (currentSizeDialogView != null) {
                      try {
                          windowManager.removeView(currentSizeDialogView)
                      } catch (e: Exception) {}
                      currentSizeDialogView = null
                      currentSizeDialogParams = null
                  }
              }

              // MENAMBAH TITIK TARGET DENGAN GARIS PANAH SWIPE (BARU ATAU DARI LOAD KONFIGURASI)
              private fun addTargetPoint(savedObj: JSONObject? = null) {
                  val nextOrder = savedObj?.optInt("order", targetPoints.size + 1) ?: (targetPoints.size + 1)
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val defaultX = 120 + ((nextOrder - 1) % 4) * 110
                  val defaultY = 350 + ((nextOrder - 1) / 4) * 120

                  val pointParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = savedObj?.optInt("x", defaultX) ?: defaultX
                      y = savedObj?.optInt("y", defaultY) ?: defaultY
                  }

                  val pointView = LayoutInflater.from(this).inflate(R.layout.layout_target_point, null)
                  val pointRoot = pointView.findViewById<View>(R.id.pointRoot)
                  val tvNumber = pointView.findViewById<TextView>(R.id.tvTargetNumber)
                  val tvType = pointView.findViewById<TextView>(R.id.tvTargetType)
                  val layoutArrowUp = pointView.findViewById<View>(R.id.layoutArrowUp)
                  val viewLineUp = pointView.findViewById<View>(R.id.viewLineUp)
                  val tvSwipeDistUp = pointView.findViewById<TextView>(R.id.tvSwipeDistUp)
                  val layoutArrowDown = pointView.findViewById<View>(R.id.layoutArrowDown)
                  val viewLineDown = pointView.findViewById<View>(R.id.viewLineDown)
                  val tvSwipeDistDown = pointView.findViewById<TextView>(R.id.tvSwipeDistDown)

                  tvNumber.text = nextOrder.toString()
                  tvType.text = "🎯"

                  val isTen = nextOrder == 10
                  val targetPoint = TargetPoint(
                      order = nextOrder,
                      view = pointView,
                      params = pointParams,
                      type = savedObj?.optString("type", "tap") ?: "tap",
                      delayValue = savedObj?.optDouble("delayValue", 500.0) ?: 500.0,
                      delayUnit = savedObj?.optString("delayUnit", "ms") ?: "ms",
                      delayMs = savedObj?.optLong("delayMs", 500L) ?: 500L,
                      swipeDistancePx = savedObj?.optDouble("swipeDistancePx", 300.0)?.toFloat() ?: 300f,
                      jumpEnabled = savedObj?.optBoolean("jumpEnabled", isTen) ?: isTen,
                      jumpToPoint = savedObj?.optInt("jumpToPoint", 7) ?: 7,
                      jumpAfterCycle = savedObj?.optInt("jumpAfterCycle", 1) ?: 1,
                      pasteText = savedObj?.optString("pasteText", "") ?: "",
                      autoTapPaste = savedObj?.optBoolean("autoTapPaste", true) ?: true,
                      keyDelayMs = savedObj?.optLong("keyDelayMs", 400L) ?: 400L,
                      savedKeyX = savedObj?.optInt("keyX", -1) ?: -1,
                      savedKeyY = savedObj?.optInt("keyY", -1) ?: -1
                  )

                  if (targetPoint.jumpEnabled) {
                      tvType.text = "🔁${targetPoint.jumpToPoint}"
                  }

                  // 1. Sentuh & Seret Bulatan Nomor (pointRoot) untuk memindahkan posisi titik atau ketuk untuk buka Dialog
                  pointRoot.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var touchStartTime = 0L

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = pointParams.x
                                  initialY = pointParams.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  touchStartTime = System.currentTimeMillis()
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val deltaX = (event.rawX - initialTouchX).toInt()
                                  val deltaY = (event.rawY - initialTouchY).toInt()
                                  pointParams.x = initialX + deltaX
                                  pointParams.y = initialY + deltaY
                                  windowManager.updateViewLayout(pointView, pointParams)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  val diffTime = System.currentTimeMillis() - touchStartTime
                                  val moved = Math.abs(event.rawX - initialTouchX) > 12 || Math.abs(event.rawY - initialTouchY) > 12
                                  if (!moved && diffTime < 350) {
                                      showPointSettingsDialog(targetPoint)
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  // 2. Seret Garis Panah Atas (▲ SERET) langsung di layar untuk mengatur panjang/pendek Swipe Atas
                  layoutArrowUp.setOnTouchListener(object : View.OnTouchListener {
                      private var initialTouchY = 0f
                      private var initialDistPx = 300f
                      private var initialParamsY = 0

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          val density = resources.displayMetrics.density
                          val minPx = 50f * density
                          val maxPx = (resources.displayMetrics.heightPixels * 0.75f).coerceAtLeast(300f)

                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialTouchY = event.rawY
                                  initialDistPx = targetPoint.swipeDistancePx
                                  initialParamsY = pointParams.y
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  // Menarik ke atas memperpanjang garis, menarik ke bawah memperpendek garis
                                  val deltaUp = initialTouchY - event.rawY
                                  val newDistPx = (initialDistPx + deltaUp).coerceIn(minPx, maxPx)
                                  val actualChangePx = (newDistPx - initialDistPx).toInt()

                                  targetPoint.swipeDistancePx = newDistPx
                                  viewLineUp.layoutParams.height = newDistPx.toInt()
                                  viewLineUp.requestLayout()
                                  tvSwipeDistUp.text = "▲ ${newDistPx.toInt()}px"

                                  // Jaga agar lingkaran nomor (pointRoot) tetap diam di tempat saat panah atas ditarik
                                  pointParams.y = initialParamsY - actualChangePx
                                  try {
                                      windowManager.updateViewLayout(pointView, pointParams)
                                  } catch (e: Exception) {}
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  // 3. Seret Garis Panah Bawah (▼ SERET) langsung di layar untuk mengatur panjang/pendek Swipe Bawah
                  layoutArrowDown.setOnTouchListener(object : View.OnTouchListener {
                      private var initialTouchY = 0f
                      private var initialDistPx = 300f

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          val density = resources.displayMetrics.density
                          val minPx = 50f * density
                          val maxPx = (resources.displayMetrics.heightPixels * 0.75f).coerceAtLeast(300f)

                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialTouchY = event.rawY
                                  initialDistPx = targetPoint.swipeDistancePx
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  // Menarik ke bawah memperpanjang garis, menarik ke atas memperpendek garis
                                  val deltaDown = event.rawY - initialTouchY
                                  val newDistPx = (initialDistPx + deltaDown).coerceIn(minPx, maxPx)

                                  targetPoint.swipeDistancePx = newDistPx
                                  viewLineDown.layoutParams.height = newDistPx.toInt()
                                  viewLineDown.requestLayout()
                                  tvSwipeDistDown.text = "▼ ${newDistPx.toInt()}px"

                                  try {
                                      windowManager.updateViewLayout(pointView, pointParams)
                                  } catch (e: Exception) {}
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager.addView(pointView, pointParams)
                  targetPoints.add(targetPoint)
                  updatePointVisual(targetPoint)
                  if (savedObj == null) {
                      Toast.makeText(this, "Titik $nextOrder ditambah! (Ketuk angka untuk opsi Swipe & Jeda)", Toast.LENGTH_SHORT).show()
                  }
              }

              // MEMPERBARUI TAMPILAN VISUAL TITIK (UKURAN & GARIS PANAH SWIPE 1:1)
              private fun updatePointVisual(point: TargetPoint) {
                  val density = resources.displayMetrics.density
                  val sizeDp = getTargetSizeDp()
                  val sizePx = (sizeDp * density).toInt()

                  val pointRoot = point.view.findViewById<View>(R.id.pointRoot)
                  val tvNumber = point.view.findViewById<TextView>(R.id.tvTargetNumber)
                  val tvType = point.view.findViewById<TextView>(R.id.tvTargetType)

                  val layoutArrowUp = point.view.findViewById<View>(R.id.layoutArrowUp)
                  val viewLineUp = point.view.findViewById<View>(R.id.viewLineUp)
                  val tvSwipeDistUp = point.view.findViewById<TextView>(R.id.tvSwipeDistUp)

                  val layoutArrowDown = point.view.findViewById<View>(R.id.layoutArrowDown)
                  val viewLineDown = point.view.findViewById<View>(R.id.viewLineDown)
                  val tvSwipeDistDown = point.view.findViewById<TextView>(R.id.tvSwipeDistDown)

                  // Atur ukuran bulatan lingkaran target (Bulat Sempurna 1:1)
                  pointRoot.layoutParams.width = sizePx
                  pointRoot.layoutParams.height = sizePx
                  pointRoot.requestLayout()

                  // Sesuaikan ukuran font nomor dengan ukuran bulatan
                  tvNumber.textSize = (sizeDp * 0.45f).coerceIn(9f, 17f)

                  // FITUR SWIPE: Panjang garis panah di layar = jarak swipe sebenarnya (1:1)
                  val minPx = (50f * density).toInt()
                  val maxPx = (resources.displayMetrics.heightPixels * 0.75f).toInt().coerceAtLeast(300)
                  val lineHeightPx = point.swipeDistancePx.toInt().coerceIn(minPx, maxPx)
                  point.swipeDistancePx = lineHeightPx.toFloat()

                  when (point.type) {
                      "swipe_up" -> {
                          layoutArrowUp.visibility = View.VISIBLE
                          layoutArrowDown.visibility = View.GONE
                          viewLineUp.layoutParams.height = lineHeightPx
                          viewLineUp.requestLayout()
                          tvSwipeDistUp.text = "▲ ${lineHeightPx}px"
                          tvType.text = "▲"
                      }
                      "swipe_down" -> {
                          layoutArrowUp.visibility = View.GONE
                          layoutArrowDown.visibility = View.VISIBLE
                          viewLineDown.layoutParams.height = lineHeightPx
                          viewLineDown.requestLayout()
                          tvSwipeDistDown.text = "▼ ${lineHeightPx}px"
                          tvType.text = "▼"
                      }
                      "paste" -> {
                          layoutArrowUp.visibility = View.GONE
                          layoutArrowDown.visibility = View.GONE
                          tvType.text = "📋"
                      }
                      "popup" -> {
                          layoutArrowUp.visibility = View.GONE
                          layoutArrowDown.visibility = View.GONE
                          tvType.text = "⌨️"
                      }
                      else -> {
                          layoutArrowUp.visibility = View.GONE
                          layoutArrowDown.visibility = View.GONE
                          tvType.text = if (point.jumpEnabled) "🔁${point.jumpToPoint}" else "🎯"
                      }
                  }

                  if (point.jumpEnabled) {
                      tvType.text = "🔁${point.jumpToPoint}"
                  }

                  try {
                      windowManager.updateViewLayout(point.view, point.params)
                  } catch (e: Exception) {}

                  // Sinkronisasi Pin Keyboard (⌨️) untuk fitur "Popup"
                  syncPopupKeyPin(point)
              }

              // MEMBUAT / MEMPERBARUI / MENGHAPUS PIN HURUF KEYBOARD (⌨️) KHUSUS FITUR "POPUP"
              private fun syncPopupKeyPin(point: TargetPoint) {
                  if (point.type != "popup") {
                      if (point.keyView != null) {
                          try {
                              windowManager.removeView(point.keyView)
                          } catch (e: Exception) {}
                          point.keyView = null
                          point.keyParams = null
                      }
                      return
                  }

                  val density = resources.displayMetrics.density
                  val sizeDp = getTargetSizeDp()
                  val sizePx = (sizeDp * density).toInt()

                  if (point.keyView == null) {
                      val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      } else {
                          @Suppress("DEPRECATION")
                          WindowManager.LayoutParams.TYPE_PHONE
                      }

                      val defaultKeyX = if (point.savedKeyX >= 0) point.savedKeyX else (70 + ((point.order - 1) % 5) * 90)
                      val defaultKeyY = if (point.savedKeyY >= 0) point.savedKeyY else (resources.displayMetrics.heightPixels * 0.73f).toInt()

                      val kParams = WindowManager.LayoutParams(
                          sizePx,
                          sizePx,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = defaultKeyX
                          y = defaultKeyY
                      }

                      val pinContainer = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(Color.parseColor("#6D28D9")) // Ungu khas Pin Keyboard
                              setStroke((2.2f * density).toInt(), Color.parseColor("#FACC15")) // Garis tepi Kuning Emas
                          }
                      }

                      val tvKeyNum = TextView(this).apply {
                          tag = "tvKeyNum"
                          text = "⌨️${point.order}"
                          setTextColor(Color.WHITE)
                          textSize = (sizeDp * 0.34f).coerceIn(8f, 13f)
                          setTypeface(typeface, android.graphics.Typeface.BOLD)
                          gravity = Gravity.CENTER
                      }

                      val tvKeySub = TextView(this).apply {
                          tag = "tvKeySub"
                          text = "KEY"
                          setTextColor(Color.parseColor("#FACC15"))
                          textSize = (sizeDp * 0.24f).coerceIn(6f, 9f)
                          setTypeface(typeface, android.graphics.Typeface.BOLD)
                          gravity = Gravity.CENTER
                      }

                      pinContainer.addView(tvKeyNum)
                      pinContainer.addView(tvKeySub)

                      // Drag & Drop Pin Keyboard (⌨️) ke atas tombol huruf di Keyboard HP
                      pinContainer.setOnTouchListener(object : View.OnTouchListener {
                          private var initialX = 0
                          private var initialY = 0
                          private var initialTouchX = 0f
                          private var initialTouchY = 0f
                          private var touchStartTime = 0L

                          override fun onTouch(v: View, event: MotionEvent): Boolean {
                              when (event.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      initialX = kParams.x
                                      initialY = kParams.y
                                      initialTouchX = event.rawX
                                      initialTouchY = event.rawY
                                      touchStartTime = System.currentTimeMillis()
                                      return true
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      kParams.x = initialX + (event.rawX - initialTouchX).toInt()
                                      kParams.y = initialY + (event.rawY - initialTouchY).toInt()
                                      point.savedKeyX = kParams.x
                                      point.savedKeyY = kParams.y
                                      try {
                                          windowManager.updateViewLayout(pinContainer, kParams)
                                      } catch (e: Exception) {}
                                      return true
                                  }
                                  MotionEvent.ACTION_UP -> {
                                      val diff = System.currentTimeMillis() - touchStartTime
                                      val moved = Math.abs(event.rawX - initialTouchX) > 12 || Math.abs(event.rawY - initialTouchY) > 12
                                      if (!moved && diff < 350) {
                                          Toast.makeText(
                                              this@FloatingOverlayService,
                                              "⌨️ Pin Keyboard Titik #${point.order}: Geser pin ini tepat ke atas huruf pada Keyboard HP Anda!",
                                              Toast.LENGTH_SHORT
                                          ).show()
                                      }
                                      return true
                                  }
                              }
                              return false
                          }
                      })

                      pinContainer.visibility = if (arePointsVisible) View.VISIBLE else View.GONE
                      windowManager.addView(pinContainer, kParams)
                      point.keyView = pinContainer
                      point.keyParams = kParams
                      point.savedKeyX = kParams.x
                      point.savedKeyY = kParams.y
                  } else {
                      val kView = point.keyView as? LinearLayout
                      val kParams = point.keyParams
                      if (kView != null && kParams != null) {
                          kParams.width = sizePx
                          kParams.height = sizePx
                          val tvKeyNum = kView.findViewWithTag<TextView>("tvKeyNum")
                          val tvKeySub = kView.findViewWithTag<TextView>("tvKeySub")
                          tvKeyNum?.textSize = (sizeDp * 0.34f).coerceIn(8f, 13f)
                          tvKeySub?.textSize = (sizeDp * 0.24f).coerceIn(6f, 9f)
                          try {
                              windowManager.updateViewLayout(kView, kParams)
                          } catch (e: Exception) {}
                      }
                  }
              }

              private fun updateAllPointsVisuals() {
                  for (p in targetPoints) {
                      updatePointVisual(p)
                  }
              }

              // DIALOG PENGATURAN PER-TITIK (KEYBOARD AKTIF, JEDA MS/DETIK, GARIS SWIPE, SUB-LOOP)
              private fun showPointSettingsDialog(point: TargetPoint) {
                  closePointSettingsDialog()

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val dialogParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.CENTER
                      softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_PAN or WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE
                  }

                  val dialogView = LayoutInflater.from(this).inflate(R.layout.layout_point_dialog, null)
                  val tvTitle = dialogView.findViewById<TextView>(R.id.tvDialogTitle)
                  val rgType = dialogView.findViewById<RadioGroup>(R.id.rgPointType)
                  val rbTap = dialogView.findViewById<RadioButton>(R.id.rbTypeTap)
                  val rbSwipeUp = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeUp)
                  val rbSwipeDown = dialogView.findViewById<RadioButton>(R.id.rbTypeSwipeDown)
                  val rbPaste = dialogView.findViewById<RadioButton>(R.id.rbTypePaste)
                  val rbPopup = dialogView.findViewById<RadioButton>(R.id.rbTypePopup)

                  val layoutSwipe = dialogView.findViewById<LinearLayout>(R.id.layoutSwipeSettings)
                  val etSwipeDistance = dialogView.findViewById<EditText>(R.id.etSwipeDistance)

                  // FITUR 4: Jeda & Pilihan Unit ms / detik (s)
                  val etDelay = dialogView.findViewById<EditText>(R.id.etDialogDelay)
                  val rgDelayUnit = dialogView.findViewById<RadioGroup>(R.id.rgDelayUnit)
                  val rbUnitMs = dialogView.findViewById<RadioButton>(R.id.rbUnitMs)
                  val rbUnitSec = dialogView.findViewById<RadioButton>(R.id.rbUnitSec)

                  val cbSubLoop = dialogView.findViewById<CheckBox>(R.id.cbPointSubLoop)
                  val layoutSubLoop = dialogView.findViewById<LinearLayout>(R.id.layoutPointSubLoopFields)
                  val etJumpTo = dialogView.findViewById<EditText>(R.id.etPointJumpTo)
                  val etJumpCycle = dialogView.findViewById<EditText>(R.id.etPointJumpCycle)

                  val layoutPaste = dialogView.findViewById<LinearLayout>(R.id.layoutDialogPasteFields)
                  val etPasteText = dialogView.findViewById<EditText>(R.id.etDialogPasteText)
                  val cbAutoTap = dialogView.findViewById<CheckBox>(R.id.cbDialogAutoTap)

                  val layoutPopup = dialogView.findViewById<LinearLayout>(R.id.layoutDialogPopupFields)
                  val etPopupKeyDelay = dialogView.findViewById<EditText>(R.id.etPopupKeyDelay)

                  val btnSave = dialogView.findViewById<Button>(R.id.btnDialogSave)
                  val btnClose = dialogView.findViewById<Button>(R.id.btnDialogClose)

                  tvTitle.text = "Pengaturan Titik #${point.order}"

                  // Set Jeda dan Unit (ms / detik)
                  if (point.delayUnit == "s") {
                      rbUnitSec.isChecked = true
                      val formatted = if (point.delayValue % 1.0 == 0.0) point.delayValue.toLong().toString() else point.delayValue.toString()
                      etDelay.setText(formatted)
                  } else {
                      rbUnitMs.isChecked = true
                      etDelay.setText(point.delayValue.toLong().toString())
                  }

                  // Konversi otomatis angka contoh saat pengguna berpindah antara Milisekon (ms) dan Detik (s)
                  rgDelayUnit.setOnCheckedChangeListener { _, checkedId ->
                      val currentVal = etDelay.text.toString().toDoubleOrNull() ?: 500.0
                      if (checkedId == R.id.rbUnitSec && currentVal >= 100.0) {
                          val secVal = currentVal / 1000.0
                          val formatted = if (secVal % 1.0 == 0.0) secVal.toLong().toString() else secVal.toString()
                          etDelay.setText(formatted)
                      } else if (checkedId == R.id.rbUnitMs && currentVal < 50.0) {
                          val msVal = (currentVal * 1000.0).toLong()
                          etDelay.setText(msVal.toString())
                      }
                  }

                  etSwipeDistance.setText(point.swipeDistancePx.toInt().toString())

                  // Sub-Loop state
                  cbSubLoop.isChecked = point.jumpEnabled
                  layoutSubLoop.visibility = if (point.jumpEnabled) View.VISIBLE else View.GONE
                  etJumpTo.setText(point.jumpToPoint.toString())
                  etJumpCycle.setText(point.jumpAfterCycle.toString())

                  cbSubLoop.setOnCheckedChangeListener { _, isChecked ->
                      layoutSubLoop.visibility = if (isChecked) View.VISIBLE else View.GONE
                  }

                  // Paste & Popup state
                  etPasteText.setText(point.pasteText)
                  cbAutoTap.isChecked = point.autoTapPaste
                  etPopupKeyDelay.setText(point.keyDelayMs.toString())

                  // Type state
                  when (point.type) {
                      "swipe_up" -> {
                          rbSwipeUp.isChecked = true
                          layoutSwipe.visibility = View.VISIBLE
                          layoutPaste.visibility = View.GONE
                          layoutPopup.visibility = View.GONE
                      }
                      "swipe_down" -> {
                          rbSwipeDown.isChecked = true
                          layoutSwipe.visibility = View.VISIBLE
                          layoutPaste.visibility = View.GONE
                          layoutPopup.visibility = View.GONE
                      }
                      "paste" -> {
                          rbPaste.isChecked = true
                          layoutSwipe.visibility = View.GONE
                          layoutPaste.visibility = View.VISIBLE
                          layoutPopup.visibility = View.GONE
                      }
                      "popup" -> {
                          rbPopup.isChecked = true
                          layoutSwipe.visibility = View.GONE
                          layoutPaste.visibility = View.GONE
                          layoutPopup.visibility = View.VISIBLE
                      }
                      else -> {
                          rbTap.isChecked = true
                          layoutSwipe.visibility = View.GONE
                          layoutPaste.visibility = View.GONE
                          layoutPopup.visibility = View.GONE
                      }
                  }

                  rgType.setOnCheckedChangeListener { _, checkedId ->
                      layoutSwipe.visibility = if (checkedId == R.id.rbTypeSwipeUp || checkedId == R.id.rbTypeSwipeDown) View.VISIBLE else View.GONE
                      layoutPaste.visibility = if (checkedId == R.id.rbTypePaste) View.VISIBLE else View.GONE
                      layoutPopup.visibility = if (checkedId == R.id.rbTypePopup) View.VISIBLE else View.GONE
                  }

                  btnSave.setOnClickListener {
                      val prevType = point.type
                      point.type = when (rgType.checkedRadioButtonId) {
                          R.id.rbTypeSwipeUp -> "swipe_up"
                          R.id.rbTypeSwipeDown -> "swipe_down"
                          R.id.rbTypePaste -> "paste"
                          R.id.rbTypePopup -> "popup"
                          else -> "tap"
                      }

                      // Hitung Jeda sesuai unit (ms atau detik)
                      val isSec = rgDelayUnit.checkedRadioButtonId == R.id.rbUnitSec
                      val delayInputVal = etDelay.text.toString().toDoubleOrNull() ?: if (isSec) 1.0 else 500.0
                      point.delayValue = delayInputVal
                      point.delayUnit = if (isSec) "s" else "ms"
                      point.delayMs = if (isSec) (delayInputVal * 1000.0).toLong().coerceAtLeast(50L) else delayInputVal.toLong().coerceAtLeast(50L)

                      point.swipeDistancePx = etSwipeDistance.text.toString().toFloatOrNull() ?: 300f

                      // Jika baru diubah menjadi swipe_up, sesuaikan posisi Y agar bulatan tetap di tempatnya
                      if (prevType != "swipe_up" && point.type == "swipe_up") {
                          point.params.y = (point.params.y - point.swipeDistancePx.toInt()).coerceAtLeast(40)
                      } else if (prevType == "swipe_up" && point.type != "swipe_up") {
                          point.params.y = point.params.y + point.swipeDistancePx.toInt()
                      }

                      point.jumpEnabled = cbSubLoop.isChecked
                      point.jumpToPoint = etJumpTo.text.toString().toIntOrNull() ?: 7
                      point.jumpAfterCycle = etJumpCycle.text.toString().toIntOrNull() ?: 1

                      point.pasteText = etPasteText.text.toString()
                      point.autoTapPaste = cbAutoTap.isChecked
                      point.keyDelayMs = etPopupKeyDelay.text.toString().toLongOrNull()?.coerceAtLeast(150L) ?: 400L

                      updatePointVisual(point)
                      closePointSettingsDialog()
                      val unitLabel = if (isSec) "${point.delayValue} detik" else "${point.delayMs} ms"
                      if (point.type == "popup") {
                          Toast.makeText(this, "⌨️ Mode Popup Aktif! Geser Pin Ungu (⌨️${point.order}) ke huruf di Keyboard HP Anda.", Toast.LENGTH_LONG).show()
                      } else {
                          Toast.makeText(this, "Titik #${point.order} disimpan (Jeda: $unitLabel) ✔", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnClose.setOnClickListener {
                      closePointSettingsDialog()
                  }

                  windowManager.addView(dialogView, dialogParams)
                  currentDialogView = dialogView
                  currentDialogParams = dialogParams
              }

              private fun closePointSettingsDialog() {
                  if (currentDialogView != null) {
                      try {
                          windowManager.removeView(currentDialogView)
                      } catch (e: Exception) {}
                      currentDialogView = null
                      currentDialogParams = null
                  }
              }

              private fun removeLastTargetPoint() {
                  if (targetPoints.isNotEmpty()) {
                      val last = targetPoints.removeAt(targetPoints.size - 1)
                      try {
                          windowManager.removeView(last.view)
                      } catch (e: Exception) {}
                      if (last.keyView != null) {
                          try {
                              windowManager.removeView(last.keyView)
                          } catch (e: Exception) {}
                      }
                      Toast.makeText(this, "Titik ${last.order} dihapus", Toast.LENGTH_SHORT).show()
                  } else {
                      Toast.makeText(this, "Tidak ada titik untuk dihapus", Toast.LENGTH_SHORT).show()
                  }
              }

              // Mengatur apakah bulatan titik & Pin Keyboard menembus sentuhan ke layar di bawahnya saat Play berjalan
              private fun setTargetPointsTouchable(touchable: Boolean) {
                  val flags = if (touchable) {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  } else {
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  for (p in targetPoints) {
                      p.params.flags = flags
                      try {
                          windowManager.updateViewLayout(p.view, p.params)
                      } catch (e: Exception) {}

                      val kView = p.keyView
                      val kParams = p.keyParams
                      if (kView != null && kParams != null) {
                          kParams.flags = flags
                          try {
                              windowManager.updateViewLayout(kView, kParams)
                          } catch (e: Exception) {}
                      }
                  }
              }

              // EKSEKUSI DENGAN KOORDINAT PRESISI & PANJANG GARIS PANAH SWIPE / POPUP KEYBOARD
              private fun startClickExecution(service: AutoClickAccessibilityService) {
                  clickJob?.cancel()
                  clickJob = serviceScope.launch {
                      val prefs = getSharedPreferences("autoklik_prefs", Context.MODE_PRIVATE)
                      val jitterEnabled = prefs.getBoolean("jitter_enabled", true)
                      val defaultPaste = prefs.getString("paste_text", "AutoKlik Trans") ?: ""

                      Toast.makeText(applicationContext, "AutoKlik Berjalan!", Toast.LENGTH_SHORT).show()

                      var currentOrder = 1
                      var cycle = 1

                      while (isActive && isPlaying && targetPoints.isNotEmpty()) {
                          val point = targetPoints.find { it.order == currentOrder } ?: targetPoints.firstOrNull()
                          if (point != null) {
                              // Ambil koordinat layar presisi dari tengah bulatan nomor (pointRoot)
                              val pointRoot = point.view.findViewById<View>(R.id.pointRoot)
                              val loc = IntArray(2)
                              pointRoot.getLocationOnScreen(loc)
                              val tapX = loc[0] + (pointRoot.width / 2f)
                              val tapY = loc[1] + (pointRoot.height / 2f)

                              // Tunggu aksi (Tap / Swipe / Paste / Popup) selesai sebelum menghitung jeda titik
                              withTimeoutOrNull(3500L) {
                                  suspendCancellableCoroutine<Unit> { cont ->
                                      val done = {
                                          if (cont.isActive) cont.resume(Unit)
                                      }
                                      when (point.type) {
                                          "swipe_up" -> {
                                              val endY = (tapY - point.swipeDistancePx).coerceAtLeast(50f)
                                              service.executeSwipe(tapX, tapY, tapX, endY, 350L, done)
                                          }
                                          "swipe_down" -> {
                                              val maxScreenY = resources.displayMetrics.heightPixels - 50f
                                              val endY = (tapY + point.swipeDistancePx).coerceAtMost(maxScreenY)
                                              service.executeSwipe(tapX, tapY, tapX, endY, 350L, done)
                                          }
                                          "paste" -> {
                                              val text = if (point.pasteText.isNotBlank()) point.pasteText else defaultPaste
                                              service.executePaste(tapX, tapY, text, point.autoTapPaste, done)
                                          }
                                          "popup" -> {
                                              val kView = point.keyView
                                              if (kView != null) {
                                                  val kLoc = IntArray(2)
                                                  kView.getLocationOnScreen(kLoc)
                                                  val keyTapX = kLoc[0] + (kView.width / 2f)
                                                  val keyTapY = kLoc[1] + (kView.height / 2f)
                                                  service.executePopup(tapX, tapY, keyTapX, keyTapY, point.keyDelayMs, done)
                                              } else {
                                                  service.executeTap(tapX, tapY, point.durationMs, done)
                                              }
                                          }
                                          else -> {
                                              service.executeTap(tapX, tapY, point.durationMs, done)
                                          }
                                      }
                                  }
                              }

                              // Jeda acak (Anti-Deteksi) berdasarkan delayMs (dari ms atau detik)
                              var waitTime = point.delayMs
                              if (jitterEnabled) {
                                  val jitterFactor = Random.nextInt(-15, 16) / 100f
                                  waitTime = (waitTime * (1f + jitterFactor)).toLong().coerceAtLeast(50L)
                              }
                              delay(waitTime)

                              // LOGIKA SUB-LOOP PADA TITIK
                              if (point.jumpEnabled && cycle >= point.jumpAfterCycle && point.jumpToPoint <= targetPoints.size) {
                                  currentOrder = point.jumpToPoint
                              } else if (currentOrder >= targetPoints.size) {
                                  currentOrder = 1
                                  cycle++
                              } else {
                                  currentOrder++
                              }
                          } else {
                              currentOrder = 1
                          }
                      }
                  }
              }

              private fun stopClickExecution() {
                  isPlaying = false
                  clickJob?.cancel()
                  clickJob = null

                  setTargetPointsTouchable(true)

                  layoutMiniToolbar?.visibility = View.GONE
                  layoutFullToolbar?.visibility = View.VISIBLE
                  if (floatingContainer != null) {
                      try {
                          windowManager.updateViewLayout(floatingContainer, containerParams)
                      } catch (e: Exception) {}
                  }

                  Toast.makeText(applicationContext, "AutoKlik Dihentikan ⏹", Toast.LENGTH_SHORT).show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopClickExecution()
                  serviceScope.cancel()
                  closePointSettingsDialog()
                  closeSizeDialog()
                  closeConfigDialog()

                  for (point in targetPoints) {
                      try {
                          windowManager.removeView(point.view)
                      } catch (e: Exception) {}
                      if (point.keyView != null) {
                          try {
                              windowManager.removeView(point.keyView)
                          } catch (e: Exception) {}
                      }
                  }
                  targetPoints.clear()

                  if (floatingContainer != null) {
                      try {
                          windowManager.removeView(floatingContainer)
                      } catch (e: Exception) {}
                  }
              }
          }
